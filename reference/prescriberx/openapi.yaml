  # ──────────────────────────────────────────────────────────────────────
  # Webhooks — subscription management
  #
  # Phase 1 (2026-05-01) — every WebhookEventType slug below is wired
  # end-to-end. Subscribe to the events you care about; every matching
  # platform action will POST to your URL with an HMAC-signed envelope.
  # See `WebhookEnvelope` schema for the delivery body shape and
  # `/api/docs/webhooks-guide` for verifier examples.
  # ──────────────────────────────────────────────────────────────────────
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: |
        List webhook subscriptions for the authenticated user's tenant
        (client / sales_organization / telehealth_company). Admins with
        the `manage-webhook-settings` permission see all subscriptions.
      operationId: listWebhookSubscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: filter[is_active]
          in: query
          schema: { type: boolean }
        - name: filter[subscriber_type]
          in: query
          schema:
            type: string
            enum: [client, sales_organization, telehealth_company]
        - name: filter[subscriber_id]
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, url, is_active, failure_count]
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [Webhooks]
      summary: Create webhook subscription
      description: |
        Create a new subscription. The response body includes the signing
        `secret` ONLY ON CREATION — store it immediately. Use it to
        verify the `X-PrescribeRx-Signature` header on every delivery.

        URLs pointing at private IP ranges (localhost, 10.x, 192.168.x)
        are rejected. Use a public-routable URL.
      operationId: createWebhookSubscription
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST "https://demo.prescribe-rx.com/api/v1/webhooks" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{
                "name": "Production EHR sync",
                "url": "https://your-app.example.com/prescriberx-hook",
                "events": ["encounter.prescribed", "order.placed", "fulfillment.shipped"],
                "is_active": true
              }'
        - lang: PHP
          label: PHP — create + verify signature
          source: |
            // Create subscription (capture secret — only returned once)
            $sub = Http::withToken($token)->acceptJson()->post(
                'https://demo.prescribe-rx.com/api/v1/webhooks',
                [
                    'name' => 'Production EHR sync',
                    'url'  => 'https://your-app.example.com/prescriberx-hook',
                    'events' => ['encounter.prescribed', 'order.placed', 'fulfillment.shipped'],
                    'is_active' => true,
                ],
            )->json('data');

            $secret = $sub['secret']; // store immediately — never returned again

            // Verifier middleware
            function verifyWebhook(string $rawBody, string $signatureHeader, string $secret): bool
            {
                if (! str_starts_with($signatureHeader, 'sha256=')) return false;
                $expected = hash_hmac('sha256', $rawBody, $secret);
                return hash_equals($expected, substr($signatureHeader, 7));
            }
        - lang: JavaScript
          label: JavaScript — create + verify signature
          source: |
            // Create subscription
            const res = await fetch('https://demo.prescribe-rx.com/api/v1/webhooks', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                Accept: 'application/json',
              },
              body: JSON.stringify({
                name: 'Production EHR sync',
                url: 'https://your-app.example.com/prescriberx-hook',
                events: ['encounter.prescribed', 'order.placed', 'fulfillment.shipped'],
                is_active: true,
              }),
            });
            const { data } = await res.json();
            const secret = data.secret; // store immediately

            // Verifier
            import crypto from 'crypto';
            function verifyWebhook(rawBody, signatureHeader, secret) {
              if (!signatureHeader.startsWith('sha256=')) return false;
              const expected = crypto.createHmac('sha256', secret).update(rawBody).digest('hex');
              return crypto.timingSafeEqual(
                Buffer.from(signatureHeader.slice(7)),
                Buffer.from(expected),
              );
            }
        - lang: Python
          label: Python — create + verify signature
          source: |
            import requests, hmac, hashlib

            # Create subscription
            res = requests.post(
                'https://demo.prescribe-rx.com/api/v1/webhooks',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
                json={
                    'name': 'Production EHR sync',
                    'url': 'https://your-app.example.com/prescriberx-hook',
                    'events': ['encounter.prescribed', 'order.placed', 'fulfillment.shipped'],
                    'is_active': True,
                },
            )
            secret = res.json()['data']['secret']  # store immediately

            # Verifier
            def verify_webhook(raw_body: bytes, signature_header: str, secret: str) -> bool:
                if not signature_header.startswith('sha256='):
                    return False
                expected = hmac.new(secret.encode(), raw_body, hashlib.sha256).hexdigest()
                return hmac.compare_digest(expected, signature_header[7:])
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWebhookSubscriptionRequest' }
            example:
              subscriber_type: client
              subscriber_id: "019d5561-7b24-7096-baa7-85485643b0a7"
              url: "https://your-app.example.com/prescriberx-hook"
              events: ["encounter.prescribed", "order.placed", "patient.created"]
              description: "EHR sync — production"
      responses:
        '201':
          description: Subscription created. Response includes the signing `secret` (one-time view).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WebhookSubscription'
                      - type: object
                        properties:
                          secret:
                            type: string
                            description: |
                              HMAC signing secret. Returned ONCE on creation —
                              save immediately. Subsequent reads omit this field.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /webhooks/event-types:
    get:
      tags: [Webhooks]
      summary: List subscribable event types
      description: |
        Returns every event slug grouped by category. Use these slugs in
        the `events` array when creating a subscription. Wildcards
        (`encounter.*`, `*`) are also accepted.
      operationId: listWebhookEventTypes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Event types grouped by category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/WebhookEventType' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/{subscription}:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [Webhooks]
      summary: Get webhook subscription
      operationId: getWebhookSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription detail (signing secret omitted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    put:
      tags: [Webhooks]
      summary: Update webhook subscription
      description: |
        Update URL, event list, headers, description, or active flag.
        Signing secret is NOT updated here — use `/rotate-secret` instead.
      operationId: updateWebhookSubscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWebhookSubscriptionRequest' }
      responses:
        '200':
          description: Updated subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

    delete:
      tags: [Webhooks]
      summary: Delete webhook subscription
      description: Soft-deletes the subscription. No future deliveries will fire.
      operationId: deleteWebhookSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{subscription}/test:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Webhooks]
      summary: Send a test delivery
      description: |
        Sends a `webhook.test` delivery to the subscription URL using the
        same signing scheme as production deliveries. Use this to verify
        your endpoint accepts deliveries and verifies signatures.

        Header `X-PrescribeRx-Signature: sha256=<hex>` will be set.
      operationId: testWebhookSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Test delivery attempted; response reflects what your endpoint returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
                      http_status:
                        type: integer
                        nullable: true
                        description: HTTP status returned by the subscriber endpoint.
                      duration_ms:
                        type: integer
                        description: Wall-clock duration of the test delivery.
                      message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{subscription}/rotate-secret:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Webhooks]
      summary: Rotate signing secret
      description: |
        Generates a new HMAC signing secret and returns it once. Update
        your endpoint's stored secret IMMEDIATELY — every delivery after
        this call is signed with the new secret. There is no grace period
        with both secrets accepted.
      operationId: rotateWebhookSecret
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New signing secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                        description: The new signing secret (returned once).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{subscription}/re-enable:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Webhooks]
      summary: Re-enable an auto-disabled subscription
      description: |
        Subscriptions that fail 50 deliveries in a row are automatically
        disabled. Use this endpoint to clear the disabled flag and resume
        deliveries — assumes you've fixed the underlying issue.
      operationId: reEnableWebhookSubscription
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscription re-enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Subscription is not currently disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "This subscription is not disabled." }

  /webhooks/{subscription}/delivery-logs:
    parameters:
      - name: subscription
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Webhooks]
      summary: List delivery logs
      description: |
        Per-attempt delivery audit trail. Useful for diagnosing why an
        endpoint stopped receiving traffic. Filter by status to see only
        failures or only successful deliveries.
      operationId: listWebhookDeliveryLogs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, failed, retrying]
        - name: event_slug
          in: query
          schema:
            type: string
            example: "encounter.prescribed"
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated delivery log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDeliveryLog' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

