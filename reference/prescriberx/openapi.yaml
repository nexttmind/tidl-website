  /prescriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Prescriptions]
      summary: Get prescription detail
      operationId: getPrescription
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Prescription, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /prescriptions/{id}/status:
    put:
      tags: [Prescriptions]
      summary: Update prescription status (provider only)
      description: |
        Transition a prescription's status (e.g., draft → signed, signed →
        cancelled). Server validates the transition against the prescription
        state machine. Use `/cancel` for the cancel-with-reason flow.
      operationId: updatePrescriptionStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: "Target status (string-backed PrescriptionStatus)" }
                note:   { type: string, maxLength: 1000 }
      responses:
        '200': { description: Status updated, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /prescriptions/{id}/cancel:
    post:
      tags: [Prescriptions]
      summary: Cancel a prescription
      description: |
        Cancels a prescription and (when `cancel_order=true`) the linked order.
        Cancellation cascades to FC payload retraction where applicable.
      operationId: cancelPrescription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:        { type: string, maxLength: 500 }
                cancel_order:  { type: boolean, default: false }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --------------------------------------------------------------------------
  # Lab Catalog (Phase 5.1) — read-only reference data
  # --------------------------------------------------------------------------
  /lab-panels:
    get:
      tags: [LabCatalog]
      summary: List lab panels (with nested tests + biomarkers)
      description: |
        Active lab panels — named bundles of tests with clinical thresholds.
        Each panel response includes nested `tests[]` (with pivot data —
        display order, is_required flag, deviation thresholds, baseline
        ranges) and each test includes its biomarker mappings to
        `system_biomarkers`. Use `?include_tests=false` to skip the nested
        tests payload for a lighter list view.
      operationId: listLabPanels
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[lab_center_id]',     in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[panel_type]',        in: query, schema: { type: integer, description: "1=initial, 2=follow_up, 3=monitoring" } }
        - { name: 'filter[encounter_type_id]', in: query, schema: { type: string, format: uuid }, description: "Panels attached to a specific encounter type" }
        - { name: 'filter[search]',            in: query, schema: { type: string }, description: "Partial match on name + slug" }
        - { name: include_tests, in: query, schema: { type: boolean, default: true } }
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200': { description: Paginated panels, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /lab-panels/{id}:
    get:
      tags: [LabCatalog]
      summary: Get a single lab panel (full nested detail)
      description: |
        Returns the panel + every test in it + each test's biomarker
        mappings + reference range overrides + deviation thresholds.
        Single call replaces N+1 lookups across `lab_panels`,
        `lab_panel_tests`, `lab_tests`, `lab_test_biomarker_maps`,
        `system_biomarkers`.
      operationId: getLabPanel
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Panel, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /lab-tests:
    get:
      tags: [LabCatalog]
      summary: List individual lab tests (Rupa-synced or custom)
      operationId: listLabTests
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[lab_center_id]', in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[sample_type]',   in: query, schema: { type: string }, description: "blood / saliva / urine / stool / hair / etc." }
        - { name: 'filter[phlebotomy_required]', in: query, schema: { type: boolean } }
        - { name: 'filter[is_custom]',     in: query, schema: { type: boolean } }
        - { name: 'filter[search]',        in: query, schema: { type: string }, description: "Partial match on name + lab_company_name" }
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200': { description: Paginated tests, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

  /lab-tests/{id}:
    get:
      tags: [LabCatalog]
      summary: Get a single lab test
      operationId: getLabTest
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Test, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /biomarkers:
    get:
      tags: [LabCatalog]
      summary: List system biomarkers (canonical reference data)
      description: |
        Canonical biomarker concepts that lab tests map to. Each biomarker
        carries reference range, unit, polarity (whether HIGH or LOW is
        clinically "good" — important for flagging), category (Adrenal,
        Thyroid, etc.), and patient-friendly name + explanation for
        portal rendering.
      operationId: listBiomarkers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[category]', in: query, schema: { type: string, description: "Adrenal | Thyroid | Lipid | Hormone | etc." } }
        - { name: 'filter[search]',   in: query, schema: { type: string }, description: "Partial match on name / loinc_code / slug" }
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200': { description: Paginated biomarkers, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

  /biomarkers/{id}:
    get:
      tags: [LabCatalog]
      summary: Get a single biomarker (with its panels)
      operationId: getBiomarker
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Biomarker, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /lab-orders:
    post:
      tags: [LabOrders]
      summary: Create lab order(s) — panel-centric (L5.D)
      description: |
        Create one or more LabOrders. **Each picked LabPanel spawns
        its own LabOrder**; each panel routes via its bound
        `panel.lab_center_id` to the appropriate lab adapter
        (Junction / Red Drop HL7-SFTP / etc.).

        **Same controller serves the legacy `/telehealth/lab-orders`
        path** — both accept the same payload + return the same response.

        **Input modes (provide exactly one):**
          - `lab_panel_ids: uuid[]` (preferred multi)
          - `lab_panel_id: uuid` (single)
          - `lab_test_ids: uuid[]` (legacy, deprecated — auto-resolves
            to a single panel via `lab_panel_tests`; 422 if the tests
            span 0 or >1 panels)

        **`is_paid` default flipped TRUE in L7.A.** Sales-org
        integrations are assumed to cover lab cost; patient-pay via
        API requires explicit `is_paid: false`.

        Returns a single-order envelope (`lab_order_count: 1` plus
        top-level fields) for single-panel inputs, or a
        `{lab_orders: [...], lab_order_count: N}` shape for multi-panel
        fan-out.
      operationId: createLabOrders
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_chart_id]
              properties:
                patient_chart_id:
                  type: string
                  format: uuid
                lab_panel_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Multi-panel fan-out (preferred for >1 panels).
                lab_panel_id:
                  type: string
                  format: uuid
                  description: Single-panel mode.
                lab_test_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: |
                    DEPRECATED legacy mode. Auto-resolves to a single
                    panel via the lab_panel_tests pivot. Returns 422
                    when tests span 0 or >1 panels — reshape to
                    `lab_panel_ids` in that case.
                collection_method:
                  type: string
                  enum: [walk_in_test, at_home_phlebotomy, testkit]
                  default: walk_in_test
                lab_center_id:
                  type: string
                  format: uuid
                  description: |
                    Optional override. By default each panel routes via
                    its own `panel.lab_center_id`.
                encounter_id:
                  type: string
                  format: uuid
                is_paid:
                  type: boolean
                  default: true
                  description: |
                    L7.A default-flipped to true. Set `false` for
                    patient-pay via API.
                billing_type:
                  type: string
                  enum: [client_bill, patient_bill, patient_bill_passthrough]
                  default: client_bill
                icd_codes:
                  type: array
                  items: { type: string, maxLength: 10 }
                  description: ICD-10 codes (Junction-only; passed when billing_type=patient_bill).
            example:
              patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
              lab_panel_ids:
                - "019d7c61-643e-710a-9323-0c6740d53796"
                - "019ea432-a039-7201-8978-a1565ad42d44"
              collection_method: "walk_in_test"
              encounter_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
              billing_type: "client_bill"
              icd_codes: ["E66.01"]
      responses:
        '201':
          description: |
            One or more LabOrders created. Single-panel input returns
            top-level fields with `lab_order_count: 1`; multi-panel
            returns `{lab_orders: [...], lab_order_count: N}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    description: |
                      Single-panel: top-level keys directly. Multi-panel:
                      wraps in `lab_orders[]`. `lab_order_count` is
                      always present.
                    properties:
                      lab_order_count: { type: integer }
                      lab_orders:
                        type: array
                        items: { $ref: '#/components/schemas/LabOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            Validation error. Common cases:
              - None of `lab_panel_id` / `lab_panel_ids` / `lab_test_ids` provided, OR more than one provided
              - Legacy `lab_test_ids` resolved to 0 or >1 panels
              - A picked panel has no `lab_center_id`
              - `patient_chart_id` does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [LabOrders]
      summary: List lab orders (tenant-scoped)
      description: |
        Tenant-scoped: sales-org → orders where `billing_sales_org_id IN
        org + descendants` OR encounter is in those orgs; client →
        orders where the encounter's `client_id` matches; patient →
        orders for own `patient_chart_id`; admin/API → all.
      operationId: listLabOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[status]',             in: query, schema: { type: integer, description: "LabOrderStatus enum value" } }
        - { name: 'filter[lab_payment_status]', in: query, schema: { type: string } }
        - { name: 'filter[billing_type]',       in: query, schema: { type: string, enum: [client_bill, patient_bill] } }
        - { name: 'filter[lab_center_id]',      in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[lab_panel_id]',       in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[encounter_id]',       in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[patient_chart_id]',   in: query, schema: { type: string, format: uuid } }
        - { name: include, in: query, schema: { type: string, description: "Comma-separated: labCenter, labPanel, orderTests, orderTests.results" } }
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200': { description: Paginated lab orders, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /encounter-types/{encounterTypeId}/lab-requirements:
    get:
      tags: [LabCatalog]
      summary: Lab panels required for an encounter type
      description: |
        Returns the LabPanels attached to an encounter type via
        `encounter_type_lab_panels`, including pivot data (`is_initial`,
        `is_required`, `display_order`). Each panel response includes
        nested tests + biomarker mappings.
      operationId: getEncounterTypeLabRequirements
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterTypeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Required panels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      encounter_type:
                        type: object
                        properties:
                          id:            { type: string, format: uuid }
                          name:          { type: string }
                          requires_labs: { type: boolean }
                      panels:
                        type: array
                        items: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------------------
  # Lab Results (Phase 5.2) — upload PDF + read structured results
  # --------------------------------------------------------------------------
  /lab-orders/{id}/results/upload:
    post:
      tags: [LabOrders]
      summary: Upload a results PDF and trigger Textract extraction
      description: |
        Attach a results PDF (or image — PNG / JPG / TIFF) to an existing
        lab order. Stores the file on the `documents` S3 disk under
        `lab-results/{patient_chart_id}/{filename}`, transitions the order
        to `RESULTS_RECEIVED`, dispatches the `ExtractLabResultsJob` to
        the `protocol` queue (10–30s typical) for AWS Textract → biomarker
        mapping, and fires the `lab.results.received` webhook event.

        Returns 202 immediately with `extraction_status: pending`. Poll
        `GET /api/v1/lab-orders/{id}/results` to read structured biomarker
        rows once extraction completes (or subscribe to the
        `lab.results.received` webhook for push notification).

        Two body shapes accepted — pick one:
          - `multipart/form-data` with a `file` field (preferred for PDFs)
          - `application/json` with `file_base64` + `filename`

        Max file size: 25MB. Allowed types: pdf, png, jpg, jpeg, tiff.
      operationId: uploadLabResults
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Lab result PDF or image (≤25MB).
                notes:
                  type: string
                  maxLength: 2000
          application/json:
            schema:
              type: object
              required: [file_base64, filename]
              properties:
                file_base64: { type: string, description: "Base64-encoded file bytes." }
                filename:    { type: string, maxLength: 255, description: "Including extension; used to detect MIME type." }
                notes:       { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Upload accepted, extraction dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      lab_order_id:                   { type: string, format: uuid }
                      lab_order_number:               { type: string }
                      document_path:                  { type: string }
                      extraction_status:              { type: string, enum: [pending] }
                      extraction_queue:               { type: string, example: protocol }
                      estimated_completion_seconds:   { type: integer, example: 30 }
                      poll_url:                       { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /lab-orders/{id}/results:
    get:
      tags: [LabOrders]
      summary: Read structured biomarker results for a lab order
      description: |
        Returns per-test biomarker rows: value (raw + numeric), unit,
        flag (H/L/HH/LL/normal), critical flag, deviation from baseline,
        trend direction (vs prior result), pct change from prior, and
        any provider annotations. Wraps
        `LabResultComparisonService::buildOrderResultView()`.

        `extraction_status` on the lab_order envelope tracks Textract
        progress: `not_uploaded` → `pending` → `completed` (or
        `no_results` if Textract returned an empty extraction).
      operationId: getLabOrderResults
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Structured biomarker results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lab_order:
                        type: object
                        properties:
                          id:                  { type: string, format: uuid }
                          lab_order_number:    { type: string }
                          status:              { type: integer }
                          document_path:       { type: string, nullable: true }
                          extraction_status:
                            type: string
                            enum: [not_uploaded, pending, completed, no_results]
                          has_results:         { type: boolean }
                          has_abnormal:        { type: boolean, nullable: true }
                          has_critical:        { type: boolean, nullable: true }
                      tests:
                        type: array
                        items:
                          type: object
                          properties:
                            test_name:        { type: string }
                            results_pdf_path: { type: string, nullable: true }
                            biomarkers:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:                    { type: string }
                                  value:                   { type: string }
                                  numeric_value:           { type: number, nullable: true }
                                  unit:                    { type: string, nullable: true }
                                  flag:                    { type: string, nullable: true }
                                  is_abnormal:             { type: boolean }
                                  is_critical:             { type: boolean }
                                  reference_range:         { type: string, nullable: true }
                                  deviation_from_baseline: { type: number, nullable: true }
                                  trend_direction:         { type: string, nullable: true }
                                  trend_polarity:          { type: string, nullable: true }
                                  pct_change_from_prior:   { type: number, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientChartId}/biomarkers/trends:
    get:
      tags: [LabCatalog]
      summary: Time-series biomarker history (charting data)
      description: |
        Returns all biomarkers for a patient chart with one timepoint per
        completed lab order, in chronological order. Wraps
        `LabResultComparisonService::buildTimelineMatrix()`. Suitable for
        rendering Highcharts / Recharts line charts of e.g. testosterone,
        estradiol, glucose over time. Optional `?lab_panel_id=` filters
        to a single panel.
      operationId: getPatientBiomarkerTrends
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientChartId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lab_panel_id,   in: query, schema: { type: string, format: uuid }, description: "Filter to a single panel" }
      responses:
        '200':
          description: Trend matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      patient_chart_id: { type: string, format: uuid }
                      lab_panel_id:     { type: string, format: uuid, nullable: true }
                      lab_panel_name:   { type: string, nullable: true }
                      biomarkers:       { type: object, additionalProperties: true }
                      timepoints:       { type: object, additionalProperties: true }
                      summary:
                        type: object
                        properties:
                          total_biomarkers: { type: integer }
                          abnormal_count:   { type: integer }
                          critical_count:   { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientChartId}/lab-summary:
    get:
      tags: [LabCatalog]
      summary: Patient lab order summary (one row per order)
      description: |
        High-level "labs tab" payload — one row per LabOrder with panel
        name, status, has_abnormal / has_critical flags, ordered_at,
        results_received_at, test_count.
      operationId: getPatientLabSummary
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientChartId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /encounters/{encounterId}/lab-requirements:
    get:
      tags: [LabCatalog]
      summary: Lab requirements RESOLVED for a specific encounter
      description: |
        Same shape as the encounter-type version, but each panel carries a
        `status: satisfied | incomplete` field computed against the
        patient's recent (≤1 year) lab results. `missing_biomarker_ids`
        lists the biomarkers still needed before the encounter can
        clinically proceed. Use this from the embed/SDK to drive a
        "labs needed" prompt.
      operationId: getEncounterLabRequirements
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resolved requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      encounter:
                        type: object
                        properties:
                          id:               { type: string, format: uuid }
                          encounter_number: { type: string }
                          requires_labs:    { type: boolean }
                          all_satisfied:    { type: boolean }
                      panels:
                        type: array
                        items:
                          type: object
                          properties:
                            panel:                     { type: object, additionalProperties: true }
                            status:                    { type: string, enum: [satisfied, incomplete] }
                            biomarker_count:           { type: integer }
                            satisfied_biomarker_count: { type: integer }
                            missing_biomarker_ids:     { type: array, items: { type: string, format: uuid } }
        '404': { $ref: '#/components/responses/NotFound' }

  # --------------------------------------------------------------------------
  # Chat
  # --------------------------------------------------------------------------
  # Drop-in JS chat widget endpoints. Origin-gated, per-agent
  # rate-limited, no Sanctum auth. Two surfaces:
  #   1. /chat/agent-init/{agent_code} — lightweight bootstrap so
  #      the static widget JS can hydrate admin-managed branding +
  #      opening message without a sales-org redeploy.
  #   2. /chat/protocol-suggest — one Bedrock turn per call.
  #
  # The widget itself is served from /sdk/chat-widget.js (not part
  # of the API surface). See /api/docs/chat-widget-guide for the
  # full SDK contract, drop-in script tag, branding fields, and
  # bridgeToEmbed() walkthrough.
  # --------------------------------------------------------------------------
  /chat/agent-init/{agent_code}:
    get:
      tags: [Chat]
      summary: Bootstrap a chat widget — return public branding + opening message
      description: |
        Public read endpoint called once by the widget JS on mount.
        Returns the agent's name, opening message, branding (avatar,
        logo, primary/secondary color, font-family, custom CSS), and
        the configured turn cap. No Bedrock invocation, no
        conversation row written, no PHI surface.

        Origin allowlist enforced — the request's `Origin` header
        must exactly match (case-insensitive scheme + host + port)
        one of the agent's `allowed_origins`. Empty allowlist = no
        traffic accepted.

        Rate-limited per origin under a separate `chat-agent-init:*`
        bucket (distinct from the chat bucket so a heavily-trafficked
        chat endpoint still serves init reads).
      operationId: chatAgentInit
      parameters:
        - name: agent_code
          in: path
          required: true
          schema:
            type: string
            pattern: '^CHAT-[A-Z0-9]+$'
            example: CHAT-1RAK9HBC
        - name: Origin
          in: header
          required: true
          description: Browser-supplied origin. Must match one of the agent's `allowed_origins`.
          schema:
            type: string
            example: https://your-site.example.com
      responses:
        '200':
          description: Public-safe presentation config for the widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAgentInitResponse'
              examples:
                fullBranding:
                  summary: Agent with full branding configured
                  value:
                    agent_code: CHAT-1RAK9HBC
                    name: Wellness Recommender
                    opening_message: "Hi! What are you looking to address today?"
                    branding:
                      avatar_url: "https://cdn.example.com/avatar.png"
                      logo_url: "https://cdn.example.com/logo.svg"
                      color: "#0d6efd"
                      secondary_color: "#198754"
                      font_family: "'Inter', -apple-system, sans-serif"
                      custom_css: ".prxc-root .prxc-card { box-shadow: 0 4px 12px rgba(0,0,0,.08); }"
                    max_conversation_turns: 20
                minimal:
                  summary: Bare-bones agent (no branding edits)
                  value:
                    agent_code: CHAT-AAAA0001
                    name: Demo Agent
                    opening_message: "Hi! What are you looking to address today?"
                    branding: {}
                    max_conversation_turns: 20
        '403':
          description: Origin not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string, enum: [origin_not_allowed] }
                  message: { type: string }
        '404':
          description: Unknown or inactive agent
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string, enum: [agent_not_found] }
                  message: { type: string }
        '429':
          description: Rate-limited per origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:                { type: string, enum: [rate_limited] }
                  message:              { type: string }
                  retry_after_seconds:  { type: integer }
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl "https://demo.prescribe-rx.com/api/v1/chat/agent-init/CHAT-1RAK9HBC" \
              -H "Origin: https://your-site.example.com" \
              -H "Accept: application/json"
        - lang: JavaScript
          label: JavaScript (browser)
          source: |
            const res = await fetch(
              'https://demo.prescribe-rx.com/api/v1/chat/agent-init/CHAT-1RAK9HBC',
              { credentials: 'omit', mode: 'cors' }
            );
            const config = await res.json();
            // → { agent_code, name, opening_message, branding, max_conversation_turns }

  /chat/protocol-suggest:
    post:
      tags: [Chat]
      summary: Send one chat turn → get reply + 0–N product suggestions
      description: |
        One conversation turn. The model gets the agent's curated
        catalog inlined in its system prompt (intersection of
        sales-org curated products × allowed embeds × category
        focus, purchasable-only) and emits a free-text reply plus
        an optional `suggest_for_cart` tool_use containing
        product UUIDs. The server post-filters those UUIDs against
        the strict allowed-set before returning suggestions — any
        hallucinated id is silently dropped.

        First turn: omit `conversation_id` (or pass `null`); the
        response carries the new id. Subsequent turns: pass the same
        id back. Turns over `max_conversation_turns` return 410 with
        `conversation_complete=true`; the widget surfaces a "Start
        over" banner that calls `reset()` to wipe the local id.

        **Cross-tenant hijack protection:** if the supplied
        `conversation_id` belongs to a DIFFERENT agent, the server
        starts a fresh conversation rather than reading the foreign
        thread. Verified by Phase 2 smoke test.
      operationId: chatProtocolSuggest
      parameters:
        - name: Origin
          in: header
          required: true
          description: Must match one of the agent's `allowed_origins`.
          schema: { type: string, example: https://your-site.example.com }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatTurnRequest' }
            examples:
              firstTurn:
                summary: First turn (no conversation_id yet)
                value:
                  agent_code: CHAT-1RAK9HBC
                  message: "I want help losing 20 pounds."
                  conversation_id: null
                  visitor_fingerprint: "abc123def456ghi789jkl012"
              followUp:
                summary: Follow-up (conversation_id from prior response)
                value:
                  agent_code: CHAT-1RAK9HBC
                  message: "Tell me more about the second one."
                  conversation_id: "019df767-e17d-7040-aff4-a6737db5e371"
                  visitor_fingerprint: "abc123def456ghi789jkl012"
      responses:
        '200':
          description: Assistant turn with reply + 0–N suggestions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatTurnResponse' }
              examples:
                clarifying:
                  summary: Model needs more info → asks one question, no suggestions yet
                  value:
                    conversation_id: "019df767-e17d-7040-aff4-a6737db5e371"
                    turn_count: 1
                    conversation_complete: false
                    reply: "Got it. Are you looking for a daily oral medication, or are you open to weekly injections?"
                    suggestions: []
                withSuggestions:
                  summary: Model has enough info → emits 3 suggestions
                  value:
                    conversation_id: "019df767-e17d-7040-aff4-a6737db5e371"
                    turn_count: 2
                    conversation_complete: false
                    reply: "Based on what you described, here are three options worth a closer look. A licensed provider determines the final prescription during intake."
                    suggestions:
                      - product_id: "019c882f-1f9b-71b8-9c72-aaaaaaaaaaaa"
                        name: "NAD+ 1000mg (100mg/ml 10ml vial)"
                        description: "Cellular energy + recovery support."
                        price: 10.50
                        sku: "NAD-1000"
                        reason: "Supports the energy + athletic-recovery goal you mentioned."
                      - product_id: "019c8834-50fc-7104-a98c-bbbbbbbbbbbb"
                        name: "MOTS-C 10mg (1mg/ml 10ml vial)"
                        description: "Mitochondrial peptide for endurance + metabolism."
                        price: 10.50
                        sku: "MOTSC-10"
                        reason: "Targets endurance and metabolic recovery — pairs well with NAD+."
        '403':
          description: Origin not allowed
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, enum: [origin_not_allowed] }, message: { type: string } } }
        '404':
          description: Unknown or inactive agent
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, enum: [agent_not_found] }, message: { type: string } } }
        '410':
          description: Conversation turn cap hit — widget shows "Start over" banner
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:                  { type: string, enum: [conversation_complete] }
                  message:                { type: string }
                  conversation_id:        { type: string, format: uuid }
                  conversation_complete:  { type: boolean, enum: [true] }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Rate-limited per origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:                { type: string, enum: [rate_limited] }
                  message:              { type: string }
                  retry_after_seconds:  { type: integer }
        '502':
          description: Bedrock invocation failed
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string, enum: [model_unavailable] }, message: { type: string } } }
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST "https://demo.prescribe-rx.com/api/v1/chat/protocol-suggest" \
              -H "Origin: https://your-site.example.com" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{
                "agent_code": "CHAT-1RAK9HBC",
                "message": "I want help losing 20 pounds.",
                "conversation_id": null,
                "visitor_fingerprint": "abc123def456ghi789jkl012"
              }'
        - lang: JavaScript
          label: JavaScript (browser)
          source: |
            const res = await fetch(
              'https://demo.prescribe-rx.com/api/v1/chat/protocol-suggest',
              {
                method: 'POST',
                credentials: 'omit',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                  agent_code: 'CHAT-1RAK9HBC',
                  message: 'I want help losing 20 pounds.',
                  conversation_id: priorConversationId,  // null on first turn
                  visitor_fingerprint: localStorage.getItem('__prxChatFp'),
                }),
              }
            );
            const turn = await res.json();
            // → { conversation_id, turn_count, conversation_complete, reply, suggestions[] }
        - lang: PHP
          label: PHP (server-to-server)
          source: |
            $turn = Http::withHeaders([
                    'Origin' => 'https://your-site.example.com',  // required even s2s
                    'Accept' => 'application/json',
                ])
                ->post('https://demo.prescribe-rx.com/api/v1/chat/protocol-suggest', [
                    'agent_code' => 'CHAT-1RAK9HBC',
                    'message' => 'I want help losing 20 pounds.',
                    'conversation_id' => null,
                    'visitor_fingerprint' => null,
                ])
                ->json();
            // $turn['suggestions'] is always strictly within the agent's allowed product set.

  # --------------------------------------------------------------------------
  # External Telehealth — provider registration + order ingest
  # --------------------------------------------------------------------------
  /external-telehealth/providers:
    post:
      tags: [ExternalTelehealth]
      summary: Register an external provider
      description: |
        Creates a new ProviderProfile + User + ProviderLicense[] in
        PENDING status. An admin must approve before any order can
        reference this NPI. Idempotent on `(npi, client_id)` — a repeat
        registration returns 409 with the existing `provider_profile_id`
        so you can use it directly in order POSTs.

        NPI normalization: dashes / spaces / whitespace are stripped on
        save. `"12-345-67890"` → `"1234567890"`.

        Token must carry `external-telehealth:providers:write`.

        Reference guide with full curl examples: `/api/docs/external-telehealth-guide`.
      security:
        - bearerAuth: [external-telehealth:providers:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalProviderCreateRequest' }
            example:
              client_id: "019d028e-f449-72f3-94fc-c7b543c4f85e"
              npi: "1234567890"
              dea: "BX1234567"
              first_name: "Alex"
              last_name: "Smith"
              prefix: "DR"
              suffix: "MD"
              designation: "MD"
              dob: "1980-01-15"
              gender: 1
              email: "alex.smith@example-clinic.com"
              state_licenses:
                - { state: "GA", license_type: "MD", license_number: "GA-12345", expiration_date: "2027-01-01" }
                - { state: "FL", license_type: "MD", license_number: "FL-67890", expiration_date: "2027-06-01" }
      responses:
        '201':
          description: 'Provider registered, pending admin approval'
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalProviderEnvelope' } } }
        '409':
          description: '`(npi, client_id)` pair already has a provider — `data.provider_profile_id` is the existing one'
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalProviderCollisionEnvelope' } } }
        '422':
          description: 'Validation error: missing field, malformed NPI, or bad slug'
        '403':
          description: 'client_id is not in caller sales org tree, OR token missing ability'
        '401':
          description: 'Missing or invalid token'

  /external-telehealth/providers/{npi}:
    get:
      tags: [ExternalTelehealth]
      summary: Look up provider(s) by NPI
      description: |
        Returns every ProviderProfile in the caller's sales-org client
        tree matching the supplied NPI. Multiple rows are possible when
        one human prescribes at multiple of your clients (each clinic
        gets its own (User, ProviderProfile) pair tied to the shared
        NPI). Poll this endpoint after `POST /providers` until status
        reads `ACTIVE` before submitting orders for that prescriber.

        Path NPI tolerates dashes / whitespace; normalized to digits-only
        for lookup.

        Token must carry `external-telehealth:providers:read`.
      security:
        - bearerAuth: [external-telehealth:providers:read]
      parameters:
        - name: npi
          in: path
          required: true
          schema: { type: string, example: "1234567890" }
      responses:
        '200':
          description: 'One or more matching providers'
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalProviderListEnvelope' } } }
        '404':
          description: 'No provider at this NPI in caller sales-org tree. Call POST /providers first.'
        '401':
          description: 'Missing or invalid token'
        '403':
          description: 'Token missing ability'

  /external-telehealth/orders:
    post:
      tags: [ExternalTelehealth]
      summary: Submit a prescription order
      description: |
        End-to-end ingest of one fully-formed prescription order.
        Validates NPI → ProviderProfile, SKU → Product, compounding
        reason slug for is_compounded products, signed Rx PDF magic
        bytes (10 MB max). Persists patient (dedupe via
        email+DOB+last_name), the signed PDF to S3, Prescription marked
        signed + locked (we never re-sign or re-render — your PDF IS the
        legal document), and the Order with wholesale-only pricing +
        `payment_status=CLIENT_BILLED`. Fires the standard `OrderPlaced`
        event so the order routes through the existing fulfillment
        pipeline.

        **`Idempotency-Key` header is REQUIRED.** Any unique string per
        order (UUID v4 recommended). Re-POSTing within 24 hours returns
        the original order as HTTP 200 (not 201). Keys are scoped to
        the caller's sales org.

        Webhook subscribers receive `order.placed` immediately, then
        `fulfillment.shipped` / `fulfillment.delivered` from the FC's
        status callbacks. Every payload includes your supplied
        `external_order_id` for correlation.

        Token must carry `external-telehealth:orders:write`.
      security:
        - bearerAuth: [external-telehealth:orders:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, maxLength: 64, example: "8c4f1e3a-d2bb-4a7c-8b9a-1c3f5e7d9b0a" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExternalOrderCreateRequest' }
            example:
              client_id: "019da95b-1db4-7200-b0e3-c7ace7ee4dec"
              provider_npi: "1043478878"
              external_order_id: "ACME-2026-05-14-00042"
              notes: "Patient prefers afternoon delivery"
              patient:
                first_name: "Jane"
                last_name: "Doe"
                email: "jane.doe@example.com"
                date_of_birth: "1985-03-12"
                phone: "+15555550100"
                gender: 2
                address: { line1: "123 Main St", city: "Atlanta", state: "GA", postal_code: "30301" }
              shipping_address: { line1: "123 Main St", city: "Atlanta", state: "GA", postal_code: "30301" }
              prescription:
                pdf_base64: "JVBERi0xLjcKJWZha2UgcGRmIGZvciB0ZXN0aW5nCg=="
                signed_at: "2026-05-14T14:00:00Z"
                signed_by_name: "Dr. Alex Smith, MD"
              lines:
                - sku: "GLPSEMA-12-TABLET"
                  quantity: 1
                  sig: "Take one 12 mg tablet by mouth once weekly"
                  days_supply: 28
                  dose_amount: "12"
                  dose_unit: "mg"
                  frequency: "weekly"
                  refills: 0
      responses:
        '201':
          description: 'Order accepted and routed to fulfillment'
          content: { application/json: { schema: { $ref: '#/components/schemas/ExternalOrderEnvelope' } } }
        '200':
          description: 'Idempotency-Key replay — returns the original order body unchanged'
        '404':
          description: 'NPI not registered at the supplied client_id. Call POST /providers first.'
        '422':
          description: 'Validation — unknown SKU, NPI not 10 digits, bad PDF magic bytes, missing compounding_reason_slug on a compounded product, or missing Idempotency-Key header'
        '403':
          description: 'Cross-tenant client_id, provider PENDING approval, or token missing ability'
        '401':
          description: 'Missing or invalid token'

  # --------------------------------------------------------------------------
  # Clients (Phase B — #10b)
  # --------------------------------------------------------------------------
  /clients:
    get:
      tags: [Clients]
      summary: List clients
      description: >
        Filterable, paginated client list (requires `client:read`). A
        client-scoped token only sees its own client; a sales-org token sees
        clients in its hierarchy.
      operationId: listClients
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[sales_organization_id]', in: query, required: false, schema: { type: string, format: uuid }, description: "Exact." }
        - { name: 'filter[client_status]', in: query, required: false, schema: { type: integer }, description: "Exact (ClientStatus)." }
        - { name: 'filter[client_type]', in: query, required: false, schema: { type: integer }, description: "Exact (ClientType)." }
        - { name: 'filter[name]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: 'filter[email]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: 'filter[client_number]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: sort, in: query, required: false, schema: { type: string, default: '-created_at' }, description: "Allowed: created_at, updated_at, name, client_number." }
        - { name: include, in: query, required: false, schema: { type: string }, description: "Comma-separated: owner, salesOrganization, addresses." }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated clients
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Clients]
      summary: Create a client
      description: >
        Create a client together with its owner user and billing address (and an optional
        shipping address). The client is created PENDING approval — no invitation email is
        sent until an admin approves it. Requires abilities `client:read` AND `client:create`
        (the token needs both; the `/clients` group carries client:read and this route adds
        client:create).
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, client_type, owner_user, billing_address]
              properties:
                name: { type: string, maxLength: 255 }
                client_type: { type: integer }
                account_tier:
                  type: string
                  enum: [wholesale, retail]
                  nullable: true
                  description: >
                    Commercial classification (B3). A reporting/segmentation label only — it does
                    NOT drive checkout pricing (a client's price is its custom product price when
                    set, else the org/product retail price). Distinct from client_type.
                email: { type: string, format: email, description: 'Optional; defaults to owner_user.email (clients.email is NOT NULL).' }
                sales_organization_id: { type: string, format: uuid, description: 'Optional; defaults to the token''s sales org.' }
                owner_user:
                  type: object
                  required: [first_name, last_name, email]
                  properties:
                    first_name: { type: string, maxLength: 100 }
                    last_name: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 255 }
                billing_address:
                  type: object
                  required: [recipient, street_1, city, state, postal_code]
                  properties:
                    recipient: { type: string }
                    street_1: { type: string }
                    city: { type: string }
                    state: { type: string }
                    postal_code: { type: string }
                shipping_address:
                  type: object
                  nullable: true
      responses:
        '201':
          description: 'Client created (PENDING approval).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '422': { description: 'Validation error (nested owner_user.* / billing_address.*).' }
        '403': { description: 'Token lacks client:create, or cannot create clients in this sales org.' }
        '401': { description: 'Missing or invalid token.' }

  /clients/{id}/pricing:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Clients]
      summary: Read client custom pricing
      description: 'Flat per-product custom prices from the client_product_prices pivot. Requires ability `client:read`.'
      operationId: getClientPricing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Client pricing.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_custom_pricing: { type: boolean }
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string, format: uuid }
                        product_name: { type: string }
                        product_sku: { type: string }
                        custom_price: { type: number }
                        price_tier2: { type: number, nullable: true }
                        price_tier3: { type: number, nullable: true }
                        is_active: { type: boolean }
        '403': { description: 'Not your client.' }
        '404': { description: 'Client not found.' }
    put:
      tags: [Clients]
      summary: Set client custom pricing (flat per-product)
      description: >
        All-or-nothing batch upsert of flat per-product custom prices. Each row enforces the
        system wholesale floor; a violation on any row rolls back the whole batch. Setting any
        price flips has_custom_pricing=true. Requires abilities `client:read` AND
        `client:pricing:write`.
      operationId: updateClientPricing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prices]
              properties:
                prices:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, custom_price]
                    properties:
                      product_id: { type: string, format: uuid }
                      custom_price: { type: number, minimum: 0 }
      responses:
        '200': { description: 'Updated pricing (same shape as GET).' }
        '422': { description: 'Validation or wholesale-floor violation (batch rolled back).' }
        '403': { description: 'Not your client, or token lacks client:pricing:write.' }
        '404': { description: 'Client not found.' }

  /clients/{id}/orders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: per_page
        in: query
        required: false
        schema: { type: integer, default: 25 }
    get:
      tags: [Clients]
      summary: List a client's orders
      description: >
        The client's orders read scope-free by client_id (ownership checked), including orders
        placed via the API. Orders attributed only to a patient chart (client_id null) are
        excluded. Requires ability `client:read`.
      operationId: listClientOrders
      security:
        - bearerAuth: []
      responses:
        '200': { description: 'Paginated orders.' }
        '403': { description: 'Not your client.' }
        '404': { description: 'Client not found.' }

  /clients/{id}/staged-orders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Clients]
      summary: Place an order for a client (order mirror)
      description: >
        The external mirror of the client ordering portal — calls the checkout flow directly (no
        telehealth encounter). order_process selects the shape: bulk-to-client (ships to the
        client) or client-to-patient (ships to a patient); omitting it infers from patient
        presence. Prices are ALWAYS resolved server-side (no unit_price field). Controlled
        substances are refused. Prescription (client-to-patient rx) orders either sign now via
        signature on file (sign=true) or stage an unsigned prescription for portal signing
        (sign=false). Requires abilities `client:read` AND `order:create`.
      operationId: placeClientOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                order_process:
                  type: string
                  enum: [bulk-to-client, client-to-patient]
                  description: 'Optional; inferred from patient presence when omitted.'
                products:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 9999, default: 1 }
                      dose_product_id: { type: string, format: uuid, nullable: true, description: 'RX: must belong to product_id.' }
                      sig: { type: string, nullable: true }
                      days_supply: { type: integer, minimum: 1, maximum: 365, nullable: true }
                      refills: { type: integer, minimum: 0, maximum: 24, nullable: true }
                      indication_ids:
                        type: array
                        nullable: true
                        items: { type: string, format: uuid }
                      provider_directions: { type: string, nullable: true }
                patient:
                  type: object
                  nullable: true
                  description: 'client-to-patient: a new patient (or use patient_chart_id).'
                  required: [first_name, last_name, email, date_of_birth, sex, phone, street_1, city, state, postal_code]
                  properties:
                    first_name: { type: string, maxLength: 100 }
                    last_name: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 255 }
                    date_of_birth: { type: string, format: date }
                    sex: { type: string, enum: [male, female, other] }
                    phone: { type: string, maxLength: 20 }
                    street_1: { type: string }
                    street_2: { type: string, nullable: true }
                    city: { type: string }
                    state: { type: string, minLength: 2, maxLength: 2 }
                    postal_code: { type: string, maxLength: 32 }
                    middle_name: { type: string, nullable: true }
                    recipient: { type: string, nullable: true }
                patient_chart_id: { type: string, format: uuid, nullable: true, description: 'client-to-patient: target an existing chart.' }
                provider_npi: { type: string, nullable: true, description: 'Required when any product is rx_required.' }
                sign: { type: boolean, default: false, description: 'RX: true=sign now (sig on file); false=stage for portal signing.' }
                payment_mode: { type: string, enum: [pay_now, invoice], nullable: true, description: 'Default pay_now. invoice only when invoicing is active.' }
                payment_method_id: { type: string, format: uuid, nullable: true, description: 'Required for pay_now; must belong to the client.' }
                shipping_address_id: { type: string, format: uuid, nullable: true }
                customer_notes: { type: string, nullable: true }
                external_reference:
                  type: string
                  nullable: true
                  description: >
                    Integrator order id. Echoed back on every sales-org webhook for this order
                    (order.metadata.external_reference → webhook external_order_id) and used as the
                    checkout idempotency key, so a retried pay_now order dedups on (order + gateway).
                    CAVEAT: idempotency covers the CHARGE. For sign=false (staged, unsigned Rx) the
                    order is created PENDING_PROVIDER_REVIEW and NOT charged, so a retry with the
                    same external_reference can create a second staged order — dedup on your side
                    (or check GET /clients/{id}/orders) before re-POSTing a staged order.
      responses:
        '201':
          description: 'Order placed (or staged for signing).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id: { type: string, format: uuid }
                  order_number: { type: string, nullable: true }
                  flow: { type: string, enum: [bulk, c2p_non_rx, c2p_rx_signed, c2p_rx_staged] }
                  workflow_status: { type: string }
                  payment_status: { type: string }
                  patient_chart_id: { type: string, format: uuid, nullable: true }
                  patient_number: { type: string, nullable: true }
                  prescription_id: { type: string, format: uuid, nullable: true }
                  requires_signature: { type: boolean }
                  next_action: { type: string }
        '422': { description: 'Validation or business rule (unavailable/controlled product, mismatched dose, missing provider signature, invoice unavailable, etc.).' }
        '403': { description: 'Not your client, or token lacks order:create.' }
        '404': { description: 'Client not found.' }

# ============================================================================
# COMPONENTS
# ============================================================================

  # ##########################################################################
  # RECONCILED ENDPOINTS (added 2026-09-13) — brought the spec up to parity
  # with routes/api.php. Federation (/federation/*) is intentionally excluded
  # (internal HMAC hub<->spoke API, not the public bearer-token surface).
  # ##########################################################################

  # ==========================================================================
  # Clients — CRUD, sub-resources, and addresses  (reconciled 2026-09-13)
  # Group ability: client:read on every route below; write routes ADD a second
  # ability (client:update / client:delete) that STACKS with client:read (AND).
  # A wildcard `*` (API / admin) token satisfies all of them.
  # ==========================================================================
  /clients/{id}:
    get:
      tags: [Clients]
      summary: Get a client
      description: >
        Fetch one client with its owner, addresses, and sales organization
        eager-loaded. Read-only — no filter/include query support here (use
        `GET /clients` for the filterable index). Tenant-scoped: a client-scoped
        token may only read its own client; a sales-org token only clients whose
        `sales_organization_id` matches. 404 if the client is outside the token's
        tenant.
      operationId: getClient
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Client
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Clients]
      summary: Update a client
      description: >
        Partial update — only the keys you send are changed. Requires the
        `client:update` ability IN ADDITION to the group's `client:read`
        (a token with only `client:update` is rejected at the group gate).
        **Important:** the `id` field must be present in the JSON body and match
        the path id — the update DTO requires it and omitting it does not produce
        a clean 422.
      operationId: updateClient
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid, description: "Must equal the path id (DTO requirement)." }
                name: { type: string, maxLength: 255 }
                legal_name: { type: string }
                tax_id: { type: string }
                phone: { type: string }
                fax: { type: string }
                email: { type: string, format: email }
                website: { type: string }
                primary_contact_name: { type: string }
                primary_contact_email: { type: string, format: email }
                primary_contact_phone: { type: string }
                billing_contact_name: { type: string }
                billing_contact_email: { type: string, format: email }
                billing_contact_phone: { type: string }
                notes: { type: string }
                internal_notes: { type: string }
                client_status: { $ref: '#/components/schemas/ClientStatus' }
                client_type: { $ref: '#/components/schemas/ClientType' }
                account_tier: { type: integer, description: "AccountTier enum value." }
                can_order_rx: { type: boolean, description: "Whether the client may place Rx orders." }
                has_custom_pricing: { type: boolean }
                pricing_mode: { type: integer }
                pricing_tier_id_rx: { type: string, format: uuid }
                pricing_tier_id_non_rx: { type: string, format: uuid }
                settings: { type: object, additionalProperties: true }
                owner_id: { type: string, format: uuid }
                default_merchant_account_id: { type: string, format: uuid }
            example:
              id: "9c8b7a65-4d3e-2f1a-0b9c-8d7e6f5a4b3c"
              name: "Acme Wellness Clinic"
              phone: "555-0100"
              primary_contact_email: "ops@acmewellness.com"
              client_status: 1
              can_order_rx: true
      responses:
        '200':
          description: Client updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Clients]
      summary: Delete a client
      description: >
        Soft-deletes a client. Requires `client:delete` in addition to
        `client:read`. A client-scoped token can NEVER delete its own
        organization (403). Intended for admin / sales-org tokens.
      operationId: deleteClient
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Client deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{id}/patients:
    get:
      tags: [Clients]
      summary: List a client's patients
      description: >
        Paginated list of the client's patient charts, newest-first. No
        search/sort/filter — only pagination. Rows are patient-chart records.
      operationId: listClientPatients
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated patient charts (see meta.pagination)
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{id}/users:
    get:
      tags: [Clients]
      summary: List a client's users
      description: >
        All users attached to the client, as a compact projection
        (`id`, `name`, `email`, `user_type`, `user_status`). Not paginated.
      operationId: listClientUsers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Client users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                data:
                  - { id: "5e6f7a8b-...", name: "Jane Roe", email: "jane@acme.com", user_type: 6, user_status: 1 }
                meta: { request_id: "b1f2-uuid", timestamp: "2026-09-13T18:20:00+00:00" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{id}/settings:
    put:
      tags: [Clients]
      summary: Update client settings
      description: >
        Update the client-level settings that feed the settings waterfall
        (User → Client → Provider → EncounterType → System). Requires
        `client:update`. **Send `client_id` in the body** (required by the DTO).
        Note `bulk_ordering_enabled` defaults to `false` when omitted — it is a
        full replace of that flag, not a null-skip, so always send its intended
        value. Returns the merged settings object (not a full client resource).
      operationId: updateClientSettings
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid, description: "Must equal the path id (DTO requirement)." }
                bulk_ordering_enabled: { type: boolean, default: false, description: "Enable client bulk ordering. Omitting resets to false." }
                shipping:
                  type: object
                  nullable: true
                  description: >
                    Per-OrderProcess shipping overrides (keys `BULKTOCLIENT`,
                    `CLIENTTOPATIENT`). null = fall back to system defaults.
                  additionalProperties: true
            example:
              client_id: "9c8b7a65-4d3e-2f1a-0b9c-8d7e6f5a4b3c"
              bulk_ordering_enabled: true
              shipping: { BULKTOCLIENT: { flat_rate: 15.00 } }
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                data: { settings: { bulk_ordering_enabled: true } }
                message: "Settings updated successfully."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /clients/{clientId}/addresses:
    get:
      tags: [Clients]
      summary: List a client's addresses
      description: >
        All addresses on the client. Each address exposes both canonical keys
        (`street`, `street2`, `zip`) and legacy aliases (`street_1`, `street_2`,
        `postal_code`) for the same values.
      operationId: listClientAddresses
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Client addresses
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Clients]
      summary: Add a client address
      description: >
        Create an address on the client. `addressable_type`/`addressable_id`
        are set server-side (any values you send are ignored). Requires
        `client:update`. Unlike some internal paths, `country_code` and
        `address_type` have no defaults here — send them explicitly.
      operationId: createClientAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, street_1, city, state, postal_code, country_code, address_type]
              properties:
                recipient: { type: string, maxLength: 255 }
                street_1: { type: string, maxLength: 255 }
                street_2: { type: string, maxLength: 255 }
                city: { type: string, maxLength: 255 }
                state: { type: string, description: "US state code or name (UsStates enum)." }
                postal_code: { type: string, maxLength: 32 }
                country_code: { type: string, description: "Country code, e.g. US (CountryOfOrigin enum)." }
                address_type: { $ref: '#/components/schemas/AddressType' }
                default: { type: boolean, default: false }
                status: { type: boolean, default: true }
            example:
              recipient: "Acme Wellness Clinic"
              street_1: "123 Main St"
              street_2: "Suite 200"
              city: "Austin"
              state: "TX"
              postal_code: "78701"
              country_code: "US"
              address_type: 2
              default: true
      responses:
        '201':
          description: Address created
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /clients/{clientId}/addresses/{addressId}:
    put:
      tags: [Clients]
      summary: Update a client address
      description: >
        Partial update of an address owned by the client (404 if the address
        isn't the client's). Requires `client:update`. **Send `id` in the body**
        matching `addressId` (DTO requirement).
      operationId: updateClientAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid, description: "Must equal addressId (DTO requirement)." }
                recipient: { type: string, maxLength: 255 }
                street_1: { type: string, maxLength: 255 }
                street_2: { type: string, maxLength: 255 }
                city: { type: string, maxLength: 255 }
                state: { type: string }
                postal_code: { type: string, maxLength: 32 }
                country_code: { type: string }
                address_type: { $ref: '#/components/schemas/AddressType' }
                default: { type: boolean }
                status: { type: boolean }
            example:
              id: "0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d"
              street_2: "Suite 210"
              default: true
      responses:
        '200':
          description: Address updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Clients]
      summary: Delete a client address
      description: >
        Soft-deletes an address owned by the client (404 if not the client's).
        Requires `client:update` (there is no dedicated address-delete ability).
      operationId: deleteClientAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Address deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # Bulk Orders — ASYNC external-Rx intake  (reconciled 2026-09-13)
  # DISTINCT from POST /orders/bulk (that is a synchronous checkout, below).
  # This flow stages a request, queues ProcessBulkOrderJob, and you POLL status.
  # These endpoints require ONLY a valid Sanctum token (no ability gate) and do
  # NOT use the standard {success,data,meta} envelope — shapes are literal below.
  # Product lines are keyed by external SKU (not product UUIDs).
  # ==========================================================================
  /bulk-orders:
    post:
      tags: [BulkOrders]
      summary: Submit a bulk order (async)
      description: >
        Accept a fully-formed prescription + order from an external e-Rx system,
        stage it, and queue it for processing. Returns **200** with a
        `request_id` — this means *accepted & queued*, NOT that a real order
        exists yet. Poll `GET /bulk-orders/{requestId}/status` until the status
        is terminal and `bulk_order_id` is present.


        **Idempotent:** a duplicate (`client_id`, `external_order_id`) returns the
        EXISTING request instead of creating a new one, so retries are safe.
        Lines are keyed by external **SKU** (mapped to `dose_product.fulfillment_sku`),
        not product UUIDs.
      operationId: submitBulkOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, external_order_id, shipping_address, lines, prescription]
              properties:
                client_id: { type: string, format: uuid, description: "PRX client the order belongs to. Unknown → 404." }
                external_order_id: { type: string, maxLength: 100, description: "Integrator's order id. IDEMPOTENCY KEY (with client_id)." }
                order_process_slug: { type: string, maxLength: 100, description: "Optional pharmacy/fulfillment routing slug." }
                external_reference: { type: string, maxLength: 255 }
                special_instructions: { type: string, maxLength: 1000 }
                shipping_address:
                  type: object
                  required: [recipient, street_1, city, state, postal_code]
                  properties:
                    recipient: { type: string, maxLength: 255 }
                    street_1: { type: string, maxLength: 255 }
                    street_2: { type: string, maxLength: 255, nullable: true }
                    city: { type: string, maxLength: 255 }
                    state: { type: string, description: "US state (2-letter or name)." }
                    postal_code: { type: string, maxLength: 10 }
                    country_code: { type: string, default: US }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, quantity]
                    properties:
                      sku: { type: string, maxLength: 100, description: "Maps to dose_product.fulfillment_sku." }
                      quantity: { type: integer, minimum: 1 }
                prescription:
                  type: object
                  required: [patient_name, patient_dob, patient_phone, patient_email, prescriber_name, prescriber_npi, prescriber_license_number, prescriber_license_state, prescriber_signature, medical_conditions, current_medications, allergies, fda_consent_accepted, fda_consent_accepted_at, telehealth_consent_accepted, telehealth_consent_accepted_at, prescription_items]
                  properties:
                    patient_name: { type: string, maxLength: 255 }
                    patient_first_name: { type: string, nullable: true }
                    patient_last_name: { type: string, nullable: true }
                    patient_dob: { type: string, format: date }
                    patient_phone: { type: string, maxLength: 20 }
                    patient_email: { type: string, format: email }
                    prescriber_name: { type: string }
                    prescriber_npi: { type: string, maxLength: 10 }
                    prescriber_dea_number: { type: string, maxLength: 50, nullable: true }
                    prescriber_license_number: { type: string, maxLength: 50 }
                    prescriber_license_state: { type: string, maxLength: 2 }
                    prescriber_signature:
                      type: object
                      required: [type, data, signed_at, ip_address]
                      description: "Signature capture for the audit trail."
                      properties:
                        type: { type: string, enum: [png, svg, dataurl] }
                        data: { type: string }
                        signed_at: { type: string, format: date-time }
                        ip_address: { type: string, description: "Valid IP — audit trail." }
                    medical_conditions: { type: array, items: { type: object, additionalProperties: true }, description: "Required array (may be empty)." }
                    current_medications: { type: array, items: { type: object, additionalProperties: true }, description: "Required array (may be empty)." }
                    allergies: { type: array, items: { type: object, additionalProperties: true }, description: "Required array (may be empty)." }
                    fda_consent_accepted: { type: boolean }
                    fda_consent_accepted_at: { type: string, format: date }
                    telehealth_consent_accepted: { type: boolean }
                    telehealth_consent_accepted_at: { type: string, format: date }
                    clinical_notes: { type: string, maxLength: 5000, nullable: true }
                    prescription_items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [sku, medication_name, sig, quantity, refills, prescribed_date]
                        properties:
                          sku: { type: string, maxLength: 100 }
                          medication_name: { type: string, maxLength: 255 }
                          sig: { type: string, maxLength: 1000, description: "Directions for use." }
                          quantity: { type: string, maxLength: 100, description: "STRING, not integer." }
                          refills: { type: integer, minimum: 0, maximum: 12 }
                          prescribed_date: { type: string, format: date }
                          expiration_date: { type: string, format: date }
            example:
              client_id: "9c1a2b3c-4d5e-6f7a-8b9c-0d1e2f3a4b5c"
              external_order_id: "EXT-10231"
              order_process_slug: "client-to-patient"
              shipping_address: { recipient: "Jane Doe", street_1: "12 Oak St", city: "Austin", state: "TX", postal_code: "78701" }
              lines: [ { sku: "SEMA-5MG", quantity: 2 } ]
              prescription:
                patient_name: "Jane Doe"
                patient_dob: "1985-04-12"
                patient_phone: "5125550123"
                patient_email: "jane@example.com"
                prescriber_name: "Dr. Smith"
                prescriber_npi: "1234567890"
                prescriber_license_number: "TX99123"
                prescriber_license_state: "TX"
                prescriber_signature: { type: "dataurl", data: "data:image/png;base64,iVBOR...", signed_at: "2026-09-13T10:00:00Z", ip_address: "203.0.113.9" }
                medical_conditions: []
                current_medications: []
                allergies: []
                fda_consent_accepted: true
                fda_consent_accepted_at: "2026-09-13"
                telehealth_consent_accepted: true
                telehealth_consent_accepted_at: "2026-09-13"
                prescription_items: [ { sku: "SEMA-5MG", medication_name: "Semaglutide 5mg", sig: "Inject 0.25mg SC weekly", quantity: "2", refills: 3, prescribed_date: "2026-09-13" } ]
      responses:
        '200':
          description: Accepted & queued (NOT created — poll status). On idempotent replay, status reflects the existing request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, example: pending }
                  message: { type: string }
                  submitted_at: { type: string, format: date-time }
              example: { request_id: "7f3c8a12-...", status: "pending", message: "Bulk order received and queued for processing", submitted_at: "2026-09-13T10:00:01+00:00" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Client not found
          content: { application/json: { schema: { type: object, properties: { message: { type: string }, errors: { type: object, additionalProperties: true } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /bulk-orders/cancel:
    post:
      tags: [BulkOrders]
      summary: Cancel a bulk order (by patient identifiers)
      description: >
        Cancel a bulk order by fuzzy patient-identifier match (no order id).
        At least **2 non-null** patient identifiers must be supplied among
        `patient_name`, `patient_first_name`, `patient_last_name`, `patient_dob`.
        For a client-scoped token the `client_id` is forced to the caller's own
        client (body value ignored); only unscoped/platform tokens honor a body
        `client_id`. When no order matches, the response is **400** (not 404).
      operationId: cancelBulkOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid }
                patient_name: { type: string, maxLength: 255, nullable: true }
                patient_first_name: { type: string, maxLength: 255, nullable: true }
                patient_last_name: { type: string, maxLength: 255, nullable: true }
                patient_dob: { type: string, format: date, nullable: true }
                cancellation_reason: { type: string, maxLength: 1000, nullable: true }
            example: { client_id: "9c1a2b3c-...", patient_first_name: "Jane", patient_last_name: "Doe", patient_dob: "1985-04-12", cancellation_reason: "Patient request" }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  order_number: { type: string }
                  cancelled_at: { type: string, format: date-time }
                  cancellation_reason: { type: string, nullable: true }
              example: { message: "Bulk order cancelled successfully", order_number: "BORD-00042", cancelled_at: "2026-09-13T11:02:00+00:00", cancellation_reason: "Patient request" }
        '400':
          description: No matching order (or other business error)
          content: { application/json: { schema: { type: object, properties: { message: { type: string }, error: { type: string } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Fewer than 2 patient identifiers, or DTO validation failed
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }

  /bulk-orders/{requestId}/status:
    get:
      tags: [BulkOrders]
      summary: Poll bulk-order status
      description: >
        The poll endpoint for the async flow. `requestId` is the `request_id`
        returned by `POST /bulk-orders` (the REQUEST id, not the resulting bulk
        order id). Loop until `status` is terminal and `bulk_order_id` is
        populated, then use that id for the prescription view/PDF endpoints.
      operationId: getBulkOrderStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Status (flat, no envelope)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string, format: uuid }
                  status: { type: string, description: "pending → processing → completed | failed" }
                  submitted_at: { type: string, format: date-time }
                  processed_at: { type: string, format: date-time, nullable: true }
                  bulk_order_id: { type: string, format: uuid, nullable: true }
                  bulk_order_number: { type: string, nullable: true }
                  error_message: { type: string, nullable: true }
                  validation_errors: { type: object, additionalProperties: true, nullable: true }
              example: { request_id: "7f3c8a12-...", status: "completed", submitted_at: "2026-09-13T10:00:01+00:00", processed_at: "2026-09-13T10:00:07+00:00", bulk_order_id: "a12b34c5-...", bulk_order_number: "BORD-00042", error_message: null, validation_errors: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Request not found or not accessible to this token
          content: { application/json: { schema: { type: object, properties: { message: { type: string }, errors: { type: object, additionalProperties: true } } } } }

  /bulk-orders/{bulkOrderId}/prescription:
    get:
      tags: [BulkOrders]
      summary: View bulk-order prescription (HTML)
      description: >
        Renders the prescription as an **HTML** fragment (Content-Type
        `text/html`) for modal/iframe display — NOT JSON. `bulkOrderId` is the
        BulkOrder id (from a completed status poll). Access: a client-scoped
        token may only view its own; a sales-org token is DENIED (bulk orders
        are client-scoped); an unscoped/platform token has full access.
        Not-found or access-denied both render the 404 HTML page.
      operationId: viewBulkOrderPrescription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bulkOrderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Prescription HTML
          content: { text/html: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Not found or access denied (HTML error page)
          content: { text/html: { schema: { type: string } } }

  /bulk-orders/{bulkOrderId}/prescription/pdf:
    get:
      tags: [BulkOrders]
      summary: Download bulk-order prescription (PDF)
      description: >
        Streams the prescription as a **PDF** (`application/pdf`, attachment).
        Same ownership rules as the HTML view. Errors here are JSON (unlike the
        HTML view).
      operationId: downloadBulkOrderPrescriptionPdf
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: bulkOrderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: PDF stream
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Not found or access denied
          content: { application/json: { schema: { type: object, properties: { message: { type: string }, errors: { type: object, additionalProperties: true } } } } }

  # ==========================================================================
  # Orders — synchronous bulk checkout  (reconciled 2026-09-13)
  # ==========================================================================
  /orders/bulk:
    post:
      tags: [Orders]
      summary: Create a bulk order (synchronous checkout)
      description: >
        SYNCHRONOUS checkout that creates a real `Order` (process
        `BULK_TO_CLIENT`, shipped to the client) and CHARGES the card in-request
        (`should_charge=true`, `capture_mode=sale`). Requires `order:read` AND
        `order:create`. Lines use product **UUIDs** (not SKUs).


        **PRX prerequisite:** the client must have a configured merchant account
        or the charge fails (402). If you pass `billing_address_id` together with
        `payment_method_id`, the billing address is synced to the gateway CIM
        before the charge to avoid an AVS decline — recommended.
      operationId: createBulkOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, lines]
              properties:
                client_id: { type: string, format: uuid, description: "Order owner (orderable_type=client). exists:clients,id." }
                external_order_id: { type: string, maxLength: 255, description: "Integrator reference." }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid, description: "Real product UUID (not a SKU)." }
                      quantity: { type: integer, minimum: 1 }
                coupon_code: { type: string, maxLength: 50, description: "Applied to totals." }
                shipping_address_id: { type: string, format: uuid, description: "Existing address; omit and checkout may fail to ship." }
                billing_address_id: { type: string, format: uuid, description: "Optional-but-important: synced to gateway CIM before charge (AVS)." }
                payment_method_id: { type: string, format: uuid, description: "Vaulted method to charge. Omit only if the flow tolerates no payment." }
                notes: { type: string, maxLength: 1000 }
            example:
              client_id: "9c1a2b3c-..."
              external_order_id: "PO-559"
              lines: [ { product_id: "3a7b1c2d-...", quantity: 10 } ]
              shipping_address_id: "aa11bb22-..."
              billing_address_id: "cc33dd44-..."
              payment_method_id: "bb22cc33-..."
              coupon_code: "WELCOME10"
              notes: "Rush"
      responses:
        '201':
          description: Order created & charged
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '400':
          description: Business rule error (bad coupon/product, etc.)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==========================================================================
  # Patient encounter intake via order API  (reconciled 2026-09-13)
  # Despite the name, /patient-orders creates a telehealth ENCOUNTER (+ patient
  # User/PatientChart + vaulted payment method), not an Order. Bespoke envelope.
  # ==========================================================================
  /patient-orders:
    post:
      tags: [Orders]
      summary: Create a patient encounter (intake + vault payment)
      description: >
        Creates a full patient graph in one transaction — User + PatientChart
        (+addresses, allergies, conditions) + a VAULTED payment method + an
        Encounter (`status=PENDING_INTAKE`). It does NOT create an order or
        charge a card; the payment method is vaulted for later. Requires only a
        valid Sanctum token (tenant is enforced inside the action).


        **PRX prerequisites:** (1) an active `EncounterType` must exist for the
        `product_type_id` (else 404); (2) a merchant account must exist on the
        instance or be passed as `payment.merchant_account_id` (else 500 "No
        merchant account configured"); (3) the patient must have a **billing**
        address among `patient.addresses` to vault the card. An existing patient
        (matched by email) is updated & reused, not duplicated.
      operationId: createPatientEncounterOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient, encounter, payment]
              properties:
                patient:
                  type: object
                  required: [first_name, last_name, email, addresses]
                  properties:
                    client_id: { type: string, maxLength: 191, nullable: true, description: "Must match the token's tenant or be omitted (else 422)." }
                    sales_organization_id: { type: string, maxLength: 191, nullable: true, description: "Must match the token's tenant or be omitted (else 422)." }
                    first_name: { type: string, maxLength: 100 }
                    last_name: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 255, description: "Matched case-insensitively to an existing patient; a non-patient user → 404." }
                    mobile_phone: { type: string, nullable: true }
                    dob: { type: string, maxLength: 10, nullable: true }
                    gender: { $ref: '#/components/schemas/Gender' }
                    race: { $ref: '#/components/schemas/Race' }
                    blood_type: { $ref: '#/components/schemas/BloodType' }
                    language: { $ref: '#/components/schemas/Language' }
                    marital_status: { $ref: '#/components/schemas/MaritalStatus' }
                    addresses:
                      type: array
                      minItems: 1
                      description: "At least one required; a BILLING address is required to vault payment."
                      items:
                        type: object
                        required: [recipient, street_1, city, state, postal_code, address_type]
                        properties:
                          address_id: { type: string, format: uuid, nullable: true }
                          recipient: { type: string }
                          street_1: { type: string }
                          street_2: { type: string, nullable: true }
                          city: { type: string }
                          state: { type: string, description: "US state." }
                          postal_code: { type: string }
                          country_code: { type: string, default: US }
                          address_type: { $ref: '#/components/schemas/AddressType' }
                          default: { type: boolean }
                          status: { type: boolean }
                    allergies: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
                    conditions: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
                    settings: { type: object, additionalProperties: true }
                encounter:
                  type: object
                  required: [product_type_id]
                  properties:
                    product_type_id: { type: string, format: uuid, description: "Resolves the active EncounterType (else 404)." }
                    product_id: { type: string, format: uuid, nullable: true }
                    dose_product_id: { type: string, format: uuid, nullable: true }
                    order_process_slug: { type: string, maxLength: 100, nullable: true }
                    intake_answers: { type: object, additionalProperties: true, description: "If non-empty, requires_patient_intake=false and intake is skipped." }
                    consents: { type: array, items: { type: object, additionalProperties: true } }
                    metadata: { type: object, additionalProperties: true }
                    notes: { type: string, maxLength: 2000, nullable: true }
                    external_reference: { type: string, maxLength: 255, nullable: true }
                payment:
                  type: object
                  required: [provider, token, card]
                  properties:
                    provider: { $ref: '#/components/schemas/GatewayProviders' }
                    merchant_account_id: { type: string, format: uuid, description: "Optional; if omitted, resolved by MerchantAssignmentService (none → 500)." }
                    token:
                      type: object
                      description: "Gateway tokenization payload (fields vary by gateway; all nullable)."
                      properties:
                        payment_method_id: { type: string, nullable: true }
                        customer_id: { type: string, nullable: true }
                        data_descriptor: { type: string, nullable: true }
                        data_value: { type: string, nullable: true }
                        payment_token: { type: string, nullable: true }
                    card:
                      type: object
                      required: [brand, last_four, exp_month, exp_year]
                      properties:
                        brand: { type: string }
                        last_four: { type: string, minLength: 4, maxLength: 4 }
                        exp_month: { type: integer, minimum: 1, maximum: 12 }
                        exp_year: { type: integer, minimum: 2000, maximum: 2100 }
                    is_default: { type: boolean, default: true }
                external_reference: { type: string, maxLength: 255, nullable: true }
                metadata: { type: object, additionalProperties: true }
            example:
              patient:
                first_name: "Jane"
                last_name: "Doe"
                email: "jane@example.com"
                mobile_phone: "5125550123"
                dob: "1985-04-12"
                addresses: [ { recipient: "Jane Doe", street_1: "12 Oak St", city: "Austin", state: "TX", postal_code: "78701", country_code: "US", address_type: 1, default: true } ]
              encounter: { product_type_id: "pt00aa11-...", intake_answers: {} }
              payment:
                provider: "authorize_net"
                token: { data_descriptor: "COMMON.ACCEPT.INAPP.PAYMENT", data_value: "eyJ...=" }
                card: { brand: "visa", last_four: "4242", exp_month: 12, exp_year: 2028 }
      responses:
        '201':
          description: Patient encounter created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      patient_user_id: { type: string, format: uuid }
                      patient_chart_id: { type: string, format: uuid }
                      encounter_id: { type: string, format: uuid }
                      encounter_number: { type: string }
                      encounter_status: { type: string, example: pending_intake }
                      payment_method_id: { type: string, format: uuid }
                      requires_patient_intake: { type: boolean }
                      next_steps: { type: array, items: { type: string } }
                      metadata: { type: object, additionalProperties: true }
              example:
                message: "Patient encounter created successfully."
                data: { patient_user_id: "usr...", patient_chart_id: "pc...", encounter_id: "enc...", encounter_number: "ENC-00187", encounter_status: "pending_intake", payment_method_id: "pm...", requires_patient_intake: true, next_steps: ["patient_intake_required"], metadata: { user_created: true, external_reference: null } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Email belongs to a non-patient user, no EncounterType for the product type, or no billing address
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500':
          description: No merchant account configured (or other server error)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  # ==========================================================================
  # Patients — sub-resource CRUD (vitals, addresses, allergies, medications,
  # conditions, consents, documents)  (reconciled 2026-09-13)
  # Group ability: patient:read on every route; write routes ADD patient:update.
  # TENANCY: PatientChart carries the HasPatientChartScope global scope, so a
  # patientId outside the token's tenant returns 404 "Patient not found." (never
  # 403). Sub-resources are fetched THROUGH the chart relation, and update/delete
  # pin id + patient_chart_id server-side — a body value cannot retarget a row
  # (IDOR fix, commit 07ac822be). Do not send id/patient_chart_id in bodies.
  # ==========================================================================
  /patients/lookup:
    get:
      tags: [Patients]
      summary: Look up a patient by email (dedup)
      description: >
        Exact-match identity lookup so an integrator can resolve "do I already
        have this patient?" before creating a duplicate chart (contrast the fuzzy
        `filter[email]` on the index). Scoped to the caller's org. Returns the
        canonical (earliest) chart plus any duplicate chart ids.
      operationId: lookupPatient
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email }, description: "Exact email to resolve." }
      responses:
        '200':
          description: Lookup result (data is null when no match)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                data: { canonical_patient_chart_id: "9d1c...", patient_id: "7a44...", has_duplicates: true, duplicate_chart_ids: ["b2e9..."], chart: { id: "9d1c...", first_name: "Jane" } }
                message: "Patient found."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/{patientChartId}/vitals:
    get:
      tags: [Patients]
      summary: List a chart's vitals
      description: >
        Vital readings for the chart, newest-first. This endpoint uses a bespoke
        envelope — `{success, data:[...], count}` with NO `meta` block and no
        pagination. Authorization is by the vital policy (patient own-chart, or
        staff with chart in tenant visibility) — a foreign chart is 403 here.
      operationId: listChartVitals
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientChartId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: source, in: query, required: false, schema: { type: string, enum: [manual, encounter, mobile_app, api] } }
        - { name: start_date, in: query, required: false, schema: { type: string, format: date }, description: "Both start_date and end_date must be present for the range filter to apply." }
        - { name: end_date, in: query, required: false, schema: { type: string, format: date }, description: "Must be after_or_equal start_date." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Vitals (bespoke envelope with count, no meta)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { type: object, additionalProperties: true } }
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Patients]
      summary: Record a vital for a chart
      description: >
        Create a vital reading on the chart. Requires `patient:update`. All
        measurement fields are optional — BMI and waist/hip ratio are auto-derived.
        `patient_chart_id` comes from the path (never send it in the body).
        Bespoke envelope on success. NOTE: an authorization failure on this
        endpoint currently surfaces as 500 (the gate runs inside the catch-all),
        not 403.
      operationId: storeChartVital
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientChartId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encounter_id: { type: string, format: uuid, description: "Optionally link the vital to an encounter." }
                weight: { type: number, minimum: 0, maximum: 2000, description: "lbs; drives BMI." }
                height: { type: number, minimum: 0, maximum: 120, description: "inches; drives BMI." }
                systolic_bp: { type: integer, minimum: 0, maximum: 300 }
                diastolic_bp: { type: integer, minimum: 0, maximum: 200 }
                heart_rate: { type: integer, minimum: 0, maximum: 300 }
                temperature: { type: number, minimum: 0, maximum: 120 }
                respiratory_rate: { type: integer, minimum: 0, maximum: 100 }
                oxygen_saturation: { type: integer, minimum: 0, maximum: 100 }
                waist_circumference: { type: number, minimum: 0, maximum: 200 }
                hip_circumference: { type: number, minimum: 0, maximum: 200 }
                neck_circumference: { type: number, minimum: 0, maximum: 100 }
                blood_glucose: { type: integer, minimum: 0, maximum: 1000 }
                glucose_timing: { type: string }
                pain_level: { type: integer, minimum: 0, maximum: 10 }
                pain_location: { type: string }
                source: { type: string, default: manual }
                notes: { type: string }
            example: { weight: 210.5, systolic_bp: 128, diastolic_bp: 82, heart_rate: 72, source: "api" }
      responses:
        '201':
          description: Vital recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /patients/{patientId}/allergies/{allergyId}:
    put:
      tags: [Patients]
      summary: Update a patient allergy
      description: >
        Partial update of an allergy owned by the chart. Requires `patient:update`.
        `id`/`patient_chart_id` are server-pinned — do not send them.
      operationId: updatePatientAllergy
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: allergyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allergy_name: { type: string, description: "The allergen." }
                terminology_allergy_id: { type: string, description: "Link to coded terminology." }
                allergy_type: { type: string }
                allergy_severity: { type: string }
                allergy_reaction: { type: string }
                snomed_code: { type: string }
                allergy_notes: { type: string }
                status: { type: boolean, description: "Active flag; false deactivates." }
            example: { allergy_severity: "severe", allergy_reaction: "anaphylaxis" }
      responses:
        '200':
          description: Allergy updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      summary: Delete a patient allergy
      description: "Soft-deletes an allergy owned by the chart. Requires patient:update. Returns 200 with data:null (not 204)."
      operationId: deletePatientAllergy
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: allergyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Allergy removed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/medications/{medicationId}:
    put:
      tags: [Patients]
      summary: Update a patient medication
      description: "Partial update of a medication owned by the chart. Requires patient:update. id/patient_chart_id are server-pinned."
      operationId: updatePatientMedication
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: medicationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                medication_name: { type: string }
                terminology_medication_id: { type: string }
                ndc_code: { type: string }
                snomed_code: { type: string }
                rxnorm_code: { type: string }
                dosage: { type: string }
                frequency: { type: string }
                notes: { type: string }
