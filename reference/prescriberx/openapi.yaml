          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # Pricing
  # --------------------------------------------------------------------------
  /pricing/validate-coupon:
    post:
      tags: [Pricing]
      summary: Validate coupon code
      description: Validate a coupon and calculate the discount amount.
      operationId: validateCoupon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coupon_code, cart_subtotal]
              properties:
                coupon_code:
                  type: string
                cart_subtotal:
                  type: number
                product_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: For product-restricted coupons
            example:
              coupon_code: SAVE20
              cart_subtotal: 157.00
              product_ids: ["019bde3e-e71a-7225-98fe-8f28b4cbcd77"]
      responses:
        '200':
          description: Coupon validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      coupon_id:
                        type: string
                        format: uuid
                      code:
                        type: string
                      discount_type:
                        type: string
                        enum: [fixed, percentage]
                      discount_value:
                        type: number
                      discount_amount:
                        type: number
                      message:
                        type: string
                      restrictions:
                        type: object
                        properties:
                          min_order:
                            type: number
                            nullable: true
                          max_discount:
                            type: number
                            nullable: true
                          starts_at:
                            type: string
                            format: date-time
                            nullable: true
                          ends_at:
                            type: string
                            format: date-time
                            nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pricing/preview:
    post:
      tags: [Pricing]
      summary: Preview cart pricing
      description: Calculate pricing for a cart including discounts, shipping, and tax.
      operationId: previewPricing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                client_id:
                  type: string
                  format: uuid
                  description: Client for pricing resolution
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                coupon_code:
                  type: string
                shipping_address:
                  type: object
                  properties:
                    state:
                      type: string
                      maxLength: 2
                    zip:
                      type: string
                shipping_method:
                  type: string
                  enum: [ground, 3day, 2day, overnight]
                  default: ground
            example:
              client_id: "019c94dd-8292-7112-9e5b-c458125e8d33"
              lines:
                - product_id: "019bde3e-e71a-7225-98fe-8f28b4cbcd77"
                  quantity: 2
              coupon_code: SAVE10
              shipping_address:
                state: GA
                zip: "30301"
              shipping_method: ground
      responses:
        '200':
          description: Cart pricing breakdown
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lines:
                        type: array
                        items:
                          type: object
                          properties:
                            product_id:
                              type: string
                              format: uuid
                            product_name:
                              type: string
                            sku:
                              type: string
                            quantity:
                              type: integer
                            unit_price:
                              type: number
                            line_total:
                              type: number
                      subtotal:
                        type: number
                      discount:
                        type: object
                        nullable: true
                        properties:
                          code:
                            type: string
                          type:
                            type: string
                          value:
                            type: number
                          amount:
                            type: number
                      shipping:
                        type: object
                        properties:
                          method:
                            type: string
                          amount:
                            type: number
                      tax:
                        type: object
                        properties:
                          rate:
                            type: number
                          amount:
                            type: number
                      total:
                        type: number
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pricing/shipping-rates:
    post:
      tags: [Pricing]
      summary: Get shipping rate quotes
      description: Get available shipping methods and rates for an address.
      operationId: getShippingRates
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: object
                  required: [line1, city, state, zip]
                  properties:
                    line1:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                      maxLength: 2
                    zip:
                      type: string
                subtotal:
                  type: number
                  description: For free shipping threshold check
            example:
              address:
                line1: "456 Oak Ave"
                city: Marietta
                state: GA
                zip: "30060"
              subtotal: 150.00
      responses:
        '200':
          description: Shipping rate options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rates:
                        type: array
                        items:
                          type: object
                          properties:
                            method:
                              type: string
                            carrier:
                              type: string
                            name:
                              type: string
                            amount:
                              type: number
                            estimated_days:
                              type: integer
                      free_shipping_threshold:
                        type: number
                      qualifies_for_free_shipping:
                        type: boolean
              example:
                data:
                  rates:
                    - method: ground
                      carrier: UPS
                      name: UPS Ground
                      amount: 9.99
                      estimated_days: 5
                    - method: 2day
                      carrier: UPS
                      name: UPS 2nd Day Air
                      amount: 24.99
                      estimated_days: 2
                  free_shipping_threshold: 100
                  qualifies_for_free_shipping: true
        '401':
          $ref: '#/components/responses/Unauthorized'

