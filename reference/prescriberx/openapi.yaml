      description: "Soft-deletes a schedule block (provider-scoped). Requires provider:update. Returns 200 with data:null."
      operationId: deleteProviderScheduleBlock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Schedule block removed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /providers/{providerId}/schedule/overrides:
    post:
      tags: [Scheduling]
      summary: Add a schedule override (block/add a specific date)
      description: >
        Create a single-date override — either BLOCK the day or ADD availability
        outside the normal weekly schedule. `override_date` must be today or
        later. Omit start/end times for a whole-day override. Requires
        `provider:update`.
      operationId: createProviderScheduleOverride
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override_date, override_type]
              properties:
                override_date: { type: string, format: date, description: "The calendar date; must be >= today." }
                override_type: { type: integer, enum: [1, 2], description: "1=BLOCKED, 2=AVAILABLE." }
                start_time: { type: string, nullable: true, description: "H:i; null = whole day." }
                end_time: { type: string, nullable: true }
                reason: { type: string, maxLength: 500, nullable: true }
                timezone: { type: string, maxLength: 64, default: America/New_York }
            example: { override_date: "2026-12-24", override_type: 1, reason: "Holiday" }
      responses:
        '201':
          description: Override created
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /providers/{providerId}/schedule/overrides/{overrideId}:
    delete:
