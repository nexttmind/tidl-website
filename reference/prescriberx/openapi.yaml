    # ------------------------------------------------------------------------
    # Encounter Type Schema
    # ------------------------------------------------------------------------
    EncounterType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "019ce396-46a1-73ab-87d6-c40310555401"
        name:
          type: string
        slug:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        product_class:
          type: string
          nullable: true
        product_type:
          type: string
          nullable: true
        is_featured:
          type: boolean
        requires_labs:
          type: boolean
        interaction_type:
          type: integer
          nullable: true
          description: |
            Modality enum VALUE (how the visit is conducted). As of 2026-07-14
            this field returns the integer enum value (was the label). Use
            `interaction_type_label` for the human string.
        interaction_type_label:
          type: string
          nullable: true
          description: Human-readable modality label (e.g., Asynchronous, Video).
        is_quick_consult:
          type: boolean
          description: |
            When true, this is a no-product quick-consult type (Async/Chat/
            Voice/Video). It is the ONLY case in which a unified intake may be
            submitted WITHOUT a product/package/plan selection.

    # ------------------------------------------------------------------------
    # Encounter Schema
    # ------------------------------------------------------------------------
    VideoRoom:
      type: object
      description: >
        A synchronous video-consult room and the patient's join link. Returned
        by GET /encounters/{id}/video-room and embedded as Encounter.video_room.
      properties:
        room_name:
          type: string
          description: Deterministic room identity (e.g. enc_{encounterId}).
          example: enc_019d5561-7b2b-7096-8d90-4ee49ef2ede8
        provider:
          type: string
          description: Video provider backing the room.
          example: twilio
        status:
          type: string
          description: Interaction status (scheduled | active | completed).
          example: scheduled
        materialized:
          type: boolean
          description: Whether the real Twilio room has been created yet (lazily, at first join).
          example: false
        requires_verification:
          type: boolean
          description: Whether one-time-code re-verification is required at join on an untrusted device.
          example: true
        can_join_now:
          type: boolean
          description: True inside the 15-minutes-before access window (and not terminal).
          example: false
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-12T15:30:00Z"
        opens_at:
          type: string
          format: date-time
          nullable: true
          description: When the room opens for joining (scheduled_at minus 15 minutes).
          example: "2026-08-12T15:15:00Z"
        join_url:
          type: string
          format: uri
          description: >
            Durable, signed patient join link. Non-expiring for a scheduled room
            (secured by the access gate + OTP re-verification at redemption);
            24h-signed for an ad-hoc room.
          example: "https://app.example.com/video/join/019d5561-...?signature=..."

    Encounter:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
        encounter_number:
          type: string
          example: ENC-00042
        status:
          type: string
          description: String-backed status. See EncounterStatus enum.
          example: pending_provider_review
        status_label:
          type: string
          example: Pending Provider Review
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: "1=Urgent, 2=High, 3=Normal, 4=Low, 5=Non-Urgent"
        priority_label:
          type: string
        encounter_type_id:
          type: string
          format: uuid
          nullable: true
        patient_chart_id:
          type: string
          format: uuid
          nullable: true
        provider_profile_id:
          type: string
          format: uuid
          nullable: true
        reason_for_visit:
          type: string
          nullable: true
        chief_complaint:
          type: string
          nullable: true
        symptoms:
          type: array
          nullable: true
          items:
            type: string
        interaction_type:
          type: integer
          nullable: true
          description: See InteractionType enum
        encounter_date:
          type: string
          format: date-time
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        scheduled_at:
          type: string
          format: date-time
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        no_show_at:
          type: string
          format: date-time
          nullable: true
          description: When the visit was marked a no-show (still reschedulable).
        rescheduled_at:
          type: string
          format: date-time
          nullable: true
          description: When the visit was last rescheduled.
        reschedule_count:
          type: integer
          description: Number of times the visit has been rescheduled.
          example: 0
        video_room:
          allOf:
            - $ref: '#/components/schemas/VideoRoom'
          nullable: true
          description: >
            The durable video room + persistent join link, present for a
            synchronous video consult when the interactions relation is loaded
            (e.g. GET /encounters/{id}?include=interactions, or the reschedule /
            no-show responses). Null otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        patient:
          type: object
          nullable: true
          description: Included via ?include=patient
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            phone:
              type: string
        provider:
          type: object
          nullable: true
          description: Included via ?include=providerProfile
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            npi:
              type: string
            dea:
              type: string
            license:
              type: string
            license_state:
              type: string
        encounter_type:
          type: object
          nullable: true
          description: Included via ?include=encounterType
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
            duration_minutes:
              type: integer
        prescriptions:
          type: array
          nullable: true
          description: Included via ?include=prescriptions
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
              is_controlled:
                type: boolean
              item_count:
                type: integer
              issued_at:
                type: string
                format: date-time

    CreateEncounterRequest:
      type: object
      required: [encounter_type_id, reason_for_visit]
      properties:
        patient_chart_id:
          type: string
          format: uuid
          description: Required if patient_id not provided
        patient_id:
          type: string
          format: uuid
          description: Required if patient_chart_id not provided
        encounter_type_id:
          type: string
          format: uuid
        reason_for_visit:
          type: string
          maxLength: 500
        chief_complaint:
          type: string
          maxLength: 1000
        symptoms:
          type: array
          items:
            type: string
        scheduled_at:
          type: string
          format: date-time
          description: Must be in the future
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        metadata:
          type: object

    # ------------------------------------------------------------------------
    # Order Schemas
    # ------------------------------------------------------------------------
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_number:
          type: string
          example: ORD-00123
        external_order_id:
          type: string
          nullable: true
        orderable_type:
          type: string
          enum: [patient_chart, client]
        orderable_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
          nullable: true
        payment_status:
          type: integer
          description: See PaymentStatus enum (0-10)
        workflow_status:
          type: integer
          description: See WorkflowStatus enum (0-9)
        shipping_status:
          type: integer
          description: See ShippingStatus enum (0-7)
        product_total:
          type: number
          description: Sum of order line totals before discounts and shipping.
        sub_total:
          type: number
          description: Subtotal after line-level adjustments, before shipping and discount.
        discount_total:
          type: number
          description: Total discount applied (coupons, promotions).
        total_shipping:
          type: number
          description: Shipping charge for the order.
        grand_total:
          type: number
          description: Final total the customer pays (sub_total - discount_total + total_shipping).
        currency:
          type: string
          example: USD
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        lines:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/OrderLine'
        shipping_address:
          type: object
          nullable: true
          properties:
            recipient:
              type: string
            street_1:
              type: string
            street_2:
              type: string
              nullable: true
            city:
              type: string
            state:
              type: string
            postal_code:
              type: string
            country_code:
              type: string
              nullable: true

    OrderLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
          description: Snapshot at time of order
        sku:
          type: string
          description: Snapshot at time of order
        quantity:
          type: integer
        unit_price:
          type: number
        line_total:
          type: number

    CreatePatientOrderRequest:
      type: object
      required: [client_id, patient_chart_id, lines]
      properties:
        client_id:
          type: string
          format: uuid
        patient_chart_id:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
        coupon_code:
          type: string
        shipping_address_id:
          type: string
          format: uuid
        billing_address_id:
          type: string
          format: uuid
        payment_method_id:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 1000
        is_recurring:
          type: boolean
          default: false
          description: >
            Place a recurring (subscription) order with NO system package. When
            true, checkout creates a PatientSubscription (package_id=null) from the
            order's product type + interval. Constraint: a recurring order must
            contain exactly ONE product type (returns 4xx otherwise).
        subscription_interval_unit:
          type: string
          enum: [day, week, month, year]
          default: month
          description: Billing cadence unit (only used when is_recurring=true).
        subscription_interval_count:
          type: integer
          minimum: 1
          maximum: 24
          default: 1
          description: Number of interval units between renewals.

