  /encounters/{id}/answers:
    patch:
      tags: [Encounters]
      summary: Amend / append intake answers without creating a new encounter
      description: |
        Merges a new set of intake answers into the encounter's
        existing `tier3_encounter_questions` blob. Use this instead of
        re-submitting `POST /telehealth/intake/unified` when the patient
        or integration needs to correct or extend the answer set on a
        chart that already exists.

        **Semantics:**
          - Append/update, not replace. Keys NOT in the incoming `answers`
            map are preserved on the chart.
          - Pass `null` for a slug to remove that answer.
          - Same-value re-PATCH is a no-op (skipped from the diff to
            avoid spurious audit entries from idempotent client retries).
          - Each meaningful change is recorded in the encounter audit log
            under `action="intake_answers_amended"` with a per-slug diff
            of `{before, after, op}` where `op` is one of `appended`,
            `updated`, `removed`.

        **Tenant auth:** same rules as `GET /encounters/{id}` /
        `index()` — sales-org tokens see encounters in their org +
        descendant orgs, client tokens see encounters with matching
        `client_id`, patient tokens see only their own.
      operationId: amendEncounterAnswers
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties:
                    description: |
                      Answer value keyed by `EncounterField.slug`. Same
                      keys as `POST /telehealth/intake/unified`'s `answers`.
                      Can be string / number / boolean / array (arrays
                      for multiselect / checkbox fields). Pass `null`
                      to remove an existing answer.
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: array
                        items: { type: string }
                      - type: 'null'
            example:
              answers:
                glp1_adverse_reaction_direct: "Yes"
                hba1c_value: 7.4
                old_screening_field: null
      responses:
        '200':
          description: Amendment applied (may be a no-op if every submitted answer was already on file).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "2 answer(s) amended on encounter 019d5561-..." }
                  data:
                    type: object
                    properties:
                      encounter_id: { type: string, format: uuid }
                      amended_count:
                        type: integer
                        description: Number of slugs that actually changed (excludes no-op same-value re-PATCH).
                      diff:
                        type: object
                        description: Per-slug diff of meaningful changes.
                        additionalProperties:
                          type: object
                          properties:
                            before: { description: "Prior answer value, null if not previously set." }
                            after: { description: "New answer value, null when op=removed." }
                            op:
                              type: string
                              enum: [appended, updated, removed]
                      answers:
                        type: object
                        description: Full updated `tier3_encounter_questions.questions` map after merge.
              example:
                success: true
                message: "2 answer(s) amended on encounter 019d5561-7b2b-7096-8d90-4ee49ef2ede8."
                data:
                  encounter_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
                  amended_count: 2
                  diff:
                    glp1_adverse_reaction_direct:
                      before: "No"
                      after: "Yes"
                      op: "updated"
                    hba1c_value:
                      before: null
                      after: 7.4
                      op: "appended"
                  answers:
                    glp1_adverse_reaction_direct:
                      slug: "glp1_adverse_reaction_direct"
                      question_text: "Have you ever had an adverse reaction to a GLP-1?"
                      answer: "Yes"
                      answer_type: "string"
                    hba1c_value:
                      slug: "hba1c_value"
                      question_text: "Most recent HbA1c value"
                      answer: 7.4
                      answer_type: "string"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Caller's token does not have access to this encounter
            (different sales-org / client / patient than the encounter
            is bound to).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            `answers` field missing or not an object, OR the encounter
            has no intake row to amend (use `POST /telehealth/intake/unified`
            to submit answers for the first time).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /encounters/{id}/assign:
    post:
      tags: [Encounters]
