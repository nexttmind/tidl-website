  # --------------------------------------------------------------------------
  # Catalog — single-call scoped products + packages + plans + items
  # --------------------------------------------------------------------------
  /catalog:
    get:
      tags: [Products]
      summary: Comprehensive scoped catalog (products + packages + plans + items)
      description: |
        Single endpoint that returns everything an integrator needs to render
        a checkout — products + packages with nested plans + items + product,
        all scoped to the bearer token's tenant via `ApiCatalogScopeResolver`.
        Matches the shape the web embed uses internally.

        Pricing fields are visibility-gated:
          - patient / unauth → retail only
          - sales-org / client / admin → retail + wholesale + (optional)
            consumer / custom + (admin) cost
        Sales-org overrides on `sales_organization_products` (when
        `*_override` flags set) win over the system default. Client tier
        overrides win for that client.
      operationId: getCatalog
      security:
        - bearerAuth: []
      parameters:
        - name: include_inactive
          in: query
          description: Admin tokens only — include is_active=false packages and plans.
          schema: { type: boolean, default: false }
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "https://demo.prescribe-rx.com/api/v1/catalog" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $catalog = Http::withToken($token)
                ->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/catalog')
                ->json();

            $products = $catalog['products'];
            $packages = $catalog['packages'];
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch('https://demo.prescribe-rx.com/api/v1/catalog', {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const { products, packages, scope, meta } = await res.json();
        - lang: Python
          label: Python (requests)
          source: |
            import requests

            catalog = requests.get(
                'https://demo.prescribe-rx.com/api/v1/catalog',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
            ).json()
            products, packages = catalog['products'], catalog['packages']
      responses:
        '200':
          description: Scoped catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  scope:
                    type: object
                    properties:
                      sales_organization_id:   { type: string, format: uuid, nullable: true }
                      sales_organization_name: { type: string, nullable: true }
                      client_id:               { type: string, format: uuid, nullable: true }
                      client_name:             { type: string, nullable: true }
                      admin:                   { type: boolean }
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  packages:
                    type: array
                    items: { $ref: '#/components/schemas/Package' }
                  meta:
                    type: object
                    properties:
                      product_count: { type: integer }
                      package_count: { type: integer }
                      generated_at:  { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------------------
  # Product taxonomy (classes + types)
  # --------------------------------------------------------------------------
  /product-classes:
    get:
      tags: [Products]
      summary: List product classes
      description: |
        The complete, unscoped list of active product **classes** — the broadest
        level of the catalog taxonomy (e.g. "GLP-1s & GIPs"). Many embeds and
        encounter types are configured by class or type, so this lets an integrator
        map its own front-end to PRX classes without parsing the product list.

        `slug` is a stable identifier (the display `name` may be edited) and is the
        value accepted as `products[].product_class_slug` on
        `POST /telehealth/intake/unified`.
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive LIKE filter on the class name.
      responses:
        '200':
          description: Product classes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductClass' }
              example:
                success: true
                data:
                  - id: 019b8f02-7d68-72d7-90e8-1be7ff3b94e1
                    name: GLP-1s & GIPs
                    short_name: GLP-1s & GIPs
                    slug: glp-1s-gips
                    description: null
                    is_active: true
        '401': { $ref: '#/components/responses/Unauthorized' }

  /product-types:
    get:
      tags: [Products]
      summary: List product types
      description: |
        The complete, unscoped list of active product **types** — one level below
        class (e.g. "Semaglutide", "Tirzepatide"). Optionally filter to a class.

        `slug` is a stable identifier and is the value accepted as
        `products[].product_type_slug` on `POST /telehealth/intake/unified`;
        `product_class_id` links the type to its class.
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive LIKE filter on the type name.
        - name: filter.product_class_id
          in: query
          schema: { type: string, format: uuid }
          description: Return only types in this class.
      responses:
        '200':
          description: Product types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProductType' }
              example:
                success: true
                data:
                  - id: 019b9783-6a7e-73fc-92d6-2970937796db
                    product_class_id: 019b8f02-7d68-72d7-90e8-1be7ff3b94e1
                    name: Semaglutide
                    short_name: Semaglutide
                    slug: injectable
                    description: null
                    rx_required: true
                    is_active: true
        '401': { $ref: '#/components/responses/Unauthorized' }

