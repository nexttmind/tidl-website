  /telehealth/preclusions/evaluate:
    post:
      tags: [Telehealth]
      summary: Evaluate preclusions in real-time
      description: |
        Stateless preclusion evaluator that mirrors the embed's live-firing
        logic. Submit an encounter type + answer set (and optionally a
        patient chart) and get back every preclusion that would fire —
        without creating an encounter or mutating any chart data.

        **Identical evaluation as the embed.** Under the hood the endpoint
        calls the same `PreclusionCheckService` methods (`evaluateFieldPreclusions`
        + `checkPreclusions`) that the front-end Livewire `StepRenderer`
        invokes on every keystroke. If the embed fires a preclusion for an
        input, this endpoint fires the same one. Guaranteed by shared logic.

        **Encounter type:** Provide exactly one of `encounter_type_id` or
        `encounter_type_slug`.

        **Answers:** Object keyed by `EncounterField.slug` (the same keys
        you'd send to `POST /telehealth/intake/unified`). Values may be
        string / number / boolean / array (arrays for multiselect / checkbox).
        Partial answer sets are fine — only fields you supply are evaluated.

        **Patient chart (optional):** When `patient_chart_id` is provided,
        terminology-based preclusions also fire against the chart's
        allergies / medications / conditions. Omit for a new-patient
        pre-validation use case.

        **Use cases:**
          - Live front-end validation as the patient answers questions
          - Pre-flight check before `POST /telehealth/intake/unified` to
            warn the patient about contraindications
          - Server-side audit: verify your stored answers still wouldn't
            fire preclusions today (e.g., after a clinical rules update)

        **Returns** each triggered preclusion with a `source` tag:
          - `field_config` — per-field `preclusion_config` JSON rule (v1/v2)
          - `encounter_type_rule` — global preclusion attached to the
            EncounterType / ProductClass / ProductType
          - `terminology` — chart-based rule (only when `patient_chart_id`
            is supplied)

        Plus a `summary` block with counts by severity and a `has_hard_stop`
        boolean for quick gating.
      operationId: evaluatePreclusions
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST "https://demo.prescribe-rx.com/api/v1/telehealth/preclusions/evaluate" \
              -H "Authorization: Bearer YOUR_API_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{
                "encounter_type_slug": "glp-1-screening",
                "answers": {
                  "glp1_adverse_reaction_direct": "Yes",
                  "currently_taking_glp": "yes",
                  "hba1c_over_8": ["yes_hba1c_over_8"]
                }
              }'
        - lang: PHP
          label: PHP (Guzzle)
          source: |
            <?php
            $client = new GuzzleHttp\Client(['base_uri' => 'https://demo.prescribe-rx.com']);
            $response = $client->post('/api/v1/telehealth/preclusions/evaluate', [
                'headers' => [
                    'Authorization' => 'Bearer ' . $_ENV['PRESCRIBE_RX_TOKEN'],
                    'Accept' => 'application/json',
                ],
                'json' => [
                    'encounter_type_slug' => 'glp-1-screening',
                    'answers' => [
                        'glp1_adverse_reaction_direct' => 'Yes',
                        'currently_taking_glp' => 'yes',
                        'hba1c_over_8' => ['yes_hba1c_over_8'],
                    ],
                    'patient_chart_id' => $existingPatientChartId ?? null,
                ],
            ]);
            $body = json_decode($response->getBody(), true);
            $hardStop = $body['data']['summary']['has_hard_stop'] ?? false;
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const response = await fetch(
              'https://demo.prescribe-rx.com/api/v1/telehealth/preclusions/evaluate',
              {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.PRESCRIBE_RX_TOKEN}`,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },
                body: JSON.stringify({
                  encounter_type_slug: 'glp-1-screening',
                  answers: {
                    glp1_adverse_reaction_direct: 'Yes',
                    currently_taking_glp: 'yes',
                    hba1c_over_8: ['yes_hba1c_over_8'],
                  },
                  patient_chart_id: existingPatientChartId || undefined,
                }),
              }
            );
            const body = await response.json();
            const triggered = body.data.triggered_preclusions;
            if (body.data.summary.has_hard_stop) {
              // block submission, show provider-acknowledgment UI
            }
        - lang: Python
          label: Python (requests)
          source: |
            import os, requests

            r = requests.post(
                'https://demo.prescribe-rx.com/api/v1/telehealth/preclusions/evaluate',
                headers={
                    'Authorization': f"Bearer {os.environ['PRESCRIBE_RX_TOKEN']}",
                    'Accept': 'application/json',
                },
                json={
                    'encounter_type_slug': 'glp-1-screening',
                    'answers': {
                        'glp1_adverse_reaction_direct': 'Yes',
                        'currently_taking_glp': 'yes',
                        'hba1c_over_8': ['yes_hba1c_over_8'],
                    },
                },
            )
            data = r.json()['data']
            print(f"{data['summary']['total']} preclusions fired (hard stop: {data['summary']['has_hard_stop']})")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              description: |
                Provide exactly one of `encounter_type_id` or `encounter_type_slug`.
              properties:
                encounter_type_id:
                  type: string
                  format: uuid
                  description: Encounter type UUID. Provide this OR `encounter_type_slug`.
                  example: "019ce396-46a1-73ab-87d6-c40310555401"
                encounter_type_slug:
                  type: string
                  description: Encounter type slug. Provide this OR `encounter_type_id`.
                  example: "glp-1-screening"
                answers:
                  type: object
                  additionalProperties:
                    description: |
                      Answer value for the field whose slug is the key. Can be
                      string / number / boolean / array (arrays for multiselect
                      and checkbox fields).
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: array
                        items: { type: string }
                  description: |
                    Answer set keyed by `EncounterField.slug`. Same keys you'd
                    send to `POST /telehealth/intake/unified`. Partial sets ok.
                  example:
                    glp1_adverse_reaction_direct: "Yes"
                    currently_taking_glp: "yes"
                    hba1c_over_8: ["yes_hba1c_over_8"]
                patient_chart_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: |
                    Optional patient chart UUID. When provided, terminology
                    preclusions (allergies / medications / conditions on the
                    chart) also evaluate. Omit for new-patient pre-validation.
      responses:
        '200':
          description: Evaluation result. May include zero triggered preclusions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      encounter_type:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          slug: { type: string }
                          name: { type: string }
                      answers_evaluated:
                        type: object
                        description: Echo of the submitted answers.
                      patient_chart_id:
                        type: string
                        format: uuid
                        nullable: true
                      triggered_preclusions:
                        type: array
                        items:
                          type: object
                          properties:
                            preclusion_id:
                              type: string
                              nullable: true
                              description: Preclusion model UUID when the rule is bound to a persisted Preclusion row; null for inline field_config rules without a preclusion_id pointer.
                            source:
                              type: string
                              enum: [field_config, encounter_type_rule, terminology]
                            field_slug: { type: string }
                            field_label: { type: string }
                            option_value:
                              type: string
                              nullable: true
                              description: Specific option value that triggered the rule (for radio/checkbox/multiselect).
                            severity:
                              type: string
                              enum: [absolute, relative, warning, severe, warn, hardstop, soft]
                              description: |
                                Severity flavor. New code uses `absolute|relative|warning`;
                                legacy field_config rules may emit `severe|warn|hardstop|soft`.
                                Treat anything mapping to `absolute`/`severe`/`hardstop` as a
                                hard stop and refer to `can_override`.
                            severity_enum:
                              type: integer
                              description: Numeric severity (higher = more severe). Sortable.
                            can_override:
                              type: boolean
                              description: Whether the patient can proceed without provider intervention.
                            requires_acknowledgment:
                              type: boolean
                              description: Whether the provider must explicitly acknowledge the rule before signing.
                            message: { type: string }
