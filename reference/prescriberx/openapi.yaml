    patch:
      tags: [Encounters]
      summary: Update non-clinical encounter fields
      description: |
        Correct an already-submitted encounter instead of re-POSTing the intake
        (which would duplicate / conflict — Encounter Intake Safeguards D).
        Editable: `reason_for_visit`, `chief_complaint`, `symptoms`, `priority`,
