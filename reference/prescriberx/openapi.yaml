            example: { dosage: "500mg", frequency: "twice daily" }
      responses:
        '200':
          description: Medication updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      summary: Delete a patient medication
      description: "Soft-deletes a medication owned by the chart. Requires patient:update. Returns 200 with data:null."
      operationId: deletePatientMedication
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: medicationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Medication removed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/conditions/{conditionId}:
    put:
      tags: [Patients]
      summary: Update a patient condition
      description: "Partial update of a condition owned by the chart. Requires patient:update. id/patient_chart_id are server-pinned."
      operationId: updatePatientCondition
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: conditionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                condition_name: { type: string }
                terminology_condition_id: { type: string }
                icd10_code: { type: string }
                snomed_code: { type: string }
                condition_type: { type: string }
                condition_severity: { type: string }
                condition_notes: { type: string }
                status: { type: boolean }
            example: { condition_name: "Type 2 Diabetes", icd10_code: "E11.9" }
      responses:
        '200':
          description: Condition updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      summary: Delete a patient condition
      description: "Soft-deletes a condition owned by the chart. Requires patient:update. Returns 200 with data:null."
      operationId: deletePatientCondition
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: conditionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Condition removed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/addresses/{addressId}:
    put:
      tags: [Patients]
      summary: Update a patient address
      description: >
        Partial update (send only changed fields) of an address owned by the
        chart. Requires `patient:update`. Setting `default:true` unsets other
        defaults of the same `address_type`.
      operationId: updatePatientAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient: { type: string, maxLength: 255 }
                street_1: { type: string, maxLength: 255 }
                street_2: { type: string, maxLength: 255, nullable: true }
                city: { type: string, maxLength: 100 }
                state: { type: string, minLength: 2, maxLength: 2, description: "2-letter US state code." }
                postal_code: { type: string, maxLength: 10 }
                address_type: { type: integer, enum: [1, 2, 3] }
                default: { type: boolean, nullable: true }
            example: { street_1: "742 Evergreen Ter", city: "Springfield", state: "IL", postal_code: "62704", default: true }
      responses:
        '200':
          description: Address updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Patients]
      summary: Delete a patient address
      description: "Soft-deletes an address owned by the chart. Requires patient:update. Returns 200 with data:null."
      operationId: deletePatientAddress
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: addressId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Address removed
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/consents/{consentId}:
    get:
      tags: [Patients]
      summary: Get a consent record
      description: >
        One consent audit-log entry for the chart, in detailed form (includes
        the consent text snapshot, checkboxes, user agent, revocation info).
      operationId: getPatientConsent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Consent record
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/consents/{consentId}/revoke:
    post:
      tags: [Patients]
      summary: Revoke a consent
      description: >
        Revoke an ACTIVE consent (requires `patient:update`). Only revocable
        consent types may be revoked: SMS opt-in, email opt-in, and TCPA. Any
        other type (HIPAA, telehealth, privacy, …) → 422. A `reason` is required
        for the compliance audit trail.
      operationId: revokePatientConsent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500, description: "Audit reason (TCPA/HIPAA)." }
            example: { reason: "Patient requested opt-out via phone." }
      responses:
        '200':
          description: Consent revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Patient not found, or no active consent record
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: Missing reason, or consent type is not revocable
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }

  /patients/{patientId}/documents/identity-check:
    get:
      tags: [Patients]
      summary: Identity-document upload/verify status
      description: >
        Whether the chart's three identity documents (government ID front, ID
        back, selfie-with-ID) are uploaded and verified, plus roll-up flags.
      operationId: patientIdentityCheck
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Identity status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                data: { front_id: true, front_id_verified: false, back_id: true, back_id_verified: false, selfie: false, selfie_verified: false, all_uploaded: false, all_verified: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/documents/{documentId}:
    get:
      tags: [Patients]
      summary: Get a patient document
      description: >
        One document on the chart, including a pre-signed `temporary_url` for
        download and verification/archival metadata.
      operationId: getPatientDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Document
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Patients]
      summary: Delete a patient document
      description: >
        Soft-deletes the document row (the underlying S3 object is not removed).
        Requires `patient:update`. Returns 200 with data:null.
      operationId: deletePatientDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Document deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/documents/{documentId}/verify:
    post:
      tags: [Patients]
      summary: Verify a patient document
      description: >
        Marks the document verified (stamps verifier + timestamp). Requires
        `patient:update`. Re-verifying just re-stamps.
      operationId: verifyPatientDocument
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 1000, description: "Stored as verification_notes." }
            example: { notes: "Government ID matches patient name and DOB." }
      responses:
        '200':
          description: Document verified
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==========================================================================
  # Providers  (reconciled 2026-09-13)
  # Group ability: provider:read; write routes ADD provider:update.
  # Tenant-scoped: a token with client_id may only touch its own client's
  # providers (403 on mismatch). Writes target provider_profiles (name/email
  # live on the user row and are NOT editable here).
  # ==========================================================================
  /providers:
    get:
      tags: [Providers]
      summary: List providers
      description: >
        Filterable, paginated provider list. `filter[provider_status]` maps to
        the real `status` column; sorting is limited to `created_at`/`updated_at`.
        A client-scoped token only ever sees its own client's providers.
      operationId: listProviders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[client_id]', in: query, required: false, schema: { type: string, format: uuid }, description: "Exact." }
        - { name: 'filter[provider_type]', in: query, required: false, schema: { type: integer }, description: "Exact (ProviderType)." }
        - { name: 'filter[provider_status]', in: query, required: false, schema: { type: integer }, description: "Exact (ProviderStatus; maps to status column)." }
        - { name: 'filter[first_name]', in: query, required: false, schema: { type: string }, description: "Partial (user.first_name)." }
        - { name: 'filter[last_name]', in: query, required: false, schema: { type: string }, description: "Partial (user.last_name)." }
        - { name: 'filter[npi]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: sort, in: query, required: false, schema: { type: string, default: '-created_at' }, description: "Allowed: created_at, updated_at (prefix - for desc)." }
        - { name: include, in: query, required: false, schema: { type: string }, description: "Comma-separated: user, client, licenses." }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated providers (see meta.pagination)
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /providers/{id}:
    get:
      tags: [Providers]
      summary: Get a provider
      description: "Detailed provider profile, including licenses, availability, and settings."
      operationId: getProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Provider
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Providers]
      summary: Update a provider
      description: >
        Partial update of the provider profile (requires `provider:update`).
        The path id overrides any `id` in the body. `telehealth_company_id` is
        always written (send null to clear it); all other fields are left
        untouched when omitted. Name/email are NOT editable here.
      operationId: updateProvider
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dob: { type: string, format: date, description: "Y-m-d." }
                gender: { $ref: '#/components/schemas/Gender' }
                prefix: { type: string, description: "Prefix enum." }
                suffix: { type: string, description: "ProviderSuffix enum." }
                designation: { type: string, maxLength: 255, description: "Post-nominal credential, e.g. MD." }
                dea: { type: string, maxLength: 50 }
                npi: { type: string, maxLength: 20 }
                npi_check: { type: object, additionalProperties: true }
                npi_checked_at: { type: string, format: date-time }
                telehealth_company_id: { type: string, format: uuid, nullable: true, description: "Always written; null clears it." }
                is_internal: { type: boolean }
                bio: { type: string }
                profile_photo_path: { type: string }
                signature_path: { type: string }
                signature_hash: { type: string }
                signature_collected_at: { type: string, format: date-time }
                provider_settings: { type: object, additionalProperties: true }
                status: { type: integer, description: "Admin-only." }
                availability_status: { type: integer }
                unavailable_from: { type: string, format: date-time }
                unavailable_until: { type: string, format: date-time }
                unavailable_reason: { type: string }
            example: { designation: "MD", dea: "BX1234567", is_internal: true, bio: "Board-certified in internal medicine." }
      responses:
        '200':
          description: Provider updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /providers/{id}/availability:
    put:
      tags: [Providers]
      summary: Update provider availability
      description: >
        Set the provider's availability status and unavailability window
        (requires `provider:update`). Fields distinguish absent (untouched) from
        explicit null (cleared). 422 if `unavailable_until <= unavailable_from`.
      operationId: updateProviderAvailability
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                availability_status: { $ref: '#/components/schemas/ProviderAvailabilityStatus' }
                unavailable_from: { type: string, format: date-time, nullable: true }
                unavailable_until: { type: string, format: date-time, nullable: true }
                unavailable_reason: { type: string, nullable: true }
            example: { availability_status: 3, unavailable_from: "2026-10-01T00:00:00Z", unavailable_until: "2026-10-08T00:00:00Z", unavailable_reason: "On leave" }
      responses:
        '200':
          description: Availability updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /providers/{id}/encounters:
    get:
      tags: [Providers]
      summary: List a provider's encounters
      description: "Paginated encounters for the provider, newest-first. No filters/sorts."
      operationId: listProviderEncounters
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated encounters
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /providers/{id}/licenses:
    get:
      tags: [Providers]
      summary: List a provider's licenses
      description: >
        State licenses for the provider (not paginated) with computed
        `is_active` / `is_verified` flags and `status_label`.
      operationId: listProviderLicenses
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Licenses
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /providers/{id}/signature:
    put:
      tags: [Providers]
      summary: Update provider signature
      description: >
        Sets the provider's stored signature reference (requires
        `provider:update`). These are stored file-path/hash references — this is
        NOT a multipart upload. All three fields are written unconditionally, so
        send them together (an omitted field is written as null).
      operationId: updateProviderSignature
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signature_path: { type: string, nullable: true, description: "Stored path to the signature image." }
                signature_hash: { type: string, nullable: true, description: "Integrity hash." }
                signature_collected_at: { type: string, format: date-time, nullable: true }
            example: { signature_path: "signatures/prov-123.png", signature_hash: "sha256:...", signature_collected_at: "2026-09-13T12:00:00Z" }
      responses:
        '200':
          description: Signature updated (data has has_signature)
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==========================================================================
  # Provider schedule & overrides  (reconciled 2026-09-13)
  # NOTE: the ENTIRE providers/{providerId}/schedule subtree requires the
  # provider:update ability — including the read (GET) endpoint.
  # Times are wall-clock (H:i) in the accompanying `timezone` string, not UTC.
  # ==========================================================================
  /providers/{providerId}/schedule:
    get:
      tags: [Scheduling]
      summary: List a provider's weekly schedule
      description: >
        Active recurring weekly schedule blocks, ordered by day then start time.
        Requires `provider:update` (this whole subtree is write-gated, even reads).
      operationId: listProviderSchedule
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Schedule blocks
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Scheduling]
      summary: Add a weekly schedule block
      description: >
        Create a recurring weekly availability block. `end_time` must be after
        `start_time`. Overlapping an existing active block for the same day → 422.
      operationId: createProviderScheduleBlock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day_of_week, start_time, end_time]
              properties:
                day_of_week: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday … 6=Saturday." }
                start_time: { type: string, description: "24h H:i local time, e.g. 09:00." }
                end_time: { type: string, description: "24h H:i; must be after start_time." }
                timezone: { type: string, maxLength: 64, default: America/New_York, description: "IANA tz the times are expressed in." }
                effective_from: { type: string, format: date }
                effective_until: { type: string, format: date, description: "Must be after effective_from." }
            example: { day_of_week: 1, start_time: "09:00", end_time: "17:00", timezone: "America/New_York", effective_from: "2026-10-01" }
      responses:
        '201':
          description: Schedule block created
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Validation error, or the block overlaps an existing one for that day
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }

  /providers/{providerId}/schedule/{scheduleId}:
    put:
      tags: [Scheduling]
      summary: Update a weekly schedule block
      description: >
        Partial update of a schedule block (provider-scoped lookup; foreign id →
        404). Requires `provider:update`. Note: there is no overlap re-check on
        update.
      operationId: updateProviderScheduleBlock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                day_of_week: { type: integer, minimum: 0, maximum: 6 }
                start_time: { type: string }
                end_time: { type: string }
                timezone: { type: string, maxLength: 64, nullable: true }
                is_active: { type: boolean, description: "Toggle the block on/off." }
                effective_from: { type: string, format: date }
                effective_until: { type: string, format: date }
            example: { start_time: "10:00", end_time: "18:00", is_active: true }
      responses:
        '200':
          description: Schedule block updated
