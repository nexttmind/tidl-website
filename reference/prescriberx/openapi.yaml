        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnifiedIntakeRequest'
            examples:
              01_specific_product:
                summary: Order an EXACT SKU (product_id) — provider prescribes as-sent
                description: |
                  Minimal complete payload. The order line names one concrete
                  SKU by UUID, so the provider is not choosing a concentration —
                  they review and prescribe the exact product. `quantity` is the
                  number of units purchased.
                value:
                  encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
                  patient:
                    first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
