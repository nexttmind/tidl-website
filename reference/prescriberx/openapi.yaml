    WebhookDeliveryLog:
      type: object
      description: |
        Per-attempt delivery audit row. One row per HTTP request — retries
        produce additional rows with incrementing `attempt_number`.
      properties:
        id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        event_slug:
          type: string
          example: "encounter.prescribed"
        payload_hash:
          type: string
          nullable: true
          description: SHA-256 of the `data` block. Useful for de-duping.
        payload:
          type: object
          nullable: true
          description: |
            The exact `WebhookEnvelope` delivered to your endpoint
            ({event, timestamp, data, webhook_id, subscription_id}). Persisted so
            you can inspect or replay precisely what was sent — not just its hash.
            Null for delivery rows written before this field was introduced.
          allOf:
            - $ref: '#/components/schemas/WebhookEnvelope'
        url: { type: string, format: uri }
        http_status:
          type: integer
          nullable: true
          description: HTTP status returned by the subscriber endpoint.
        response_body:
          type: string
          nullable: true
          description: First 1000 chars of the subscriber response body.
        attempt_number: { type: integer, minimum: 1 }
        duration_ms:
          type: integer
          nullable: true
          description: Wall-clock duration of the HTTP call.
        status:
          type: string
          enum: [pending, delivered, failed, retrying]
        error_message: { type: string, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    WebhookEnvelope:
      type: object
      description: |
        Standard delivery body. Every webhook POST has this envelope; the
        `data` block varies per event slug — see the per-event payload
        schemas (`WebhookEncounterCreatedData`, `WebhookOrderPlacedData`, etc.).

        **Headers on every delivery:**
        - `X-PrescribeRx-Signature: sha256=<hex>` — HMAC-SHA256 of the raw
          request body using your subscription's signing secret.
        - `X-Webhook-ID` — UUID; use as your idempotency key.
        - `X-Webhook-Event` — the event slug.
        - `X-Webhook-Timestamp` — ISO-8601 timestamp matching `timestamp`.
        - `User-Agent: PrescribeRx-Webhook/1.0`.

        **Order correlation (`external_order_id`):** when the originating order
        entered through the External Telehealth Orders API, the integrator's own
        `external_order_id` is echoed in the `data` block so you can correlate a
        webhook back to the order YOU placed without holding our id map. It is
        present on every event that traces to such an order — order/fulfillment
        events directly, and encounter/subscription/refill/reassessment/lab/
        prescription/appointment events via their originating order. The field is
        simply absent (not null) for events whose order was created internally
        (admin UI, embed checkout, etc.) or that have no originating order.
      required: [event, timestamp, webhook_id, subscription_id, data]
      properties:
        event:
          $ref: '#/components/schemas/WebhookEventType'
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp the event was emitted.
        webhook_id:
          type: string
          format: uuid
          description: |
            Unique per delivery (NOT per event — retries reuse the same id).
            Use as your idempotency key.
        subscription_id: { type: string, format: uuid }
        data:
          type: object
          description: |
            Event-specific payload. Shape depends on the `event` slug —
            consult the per-slug schema. All payloads are non-PHI: identifiers,
            status fields, timestamps. No clinical content.
          oneOf:
            - $ref: '#/components/schemas/WebhookEncounterCreatedData'
            - $ref: '#/components/schemas/WebhookEncounterStatusChangedData'
            - $ref: '#/components/schemas/WebhookEncounterAssignedData'
            - $ref: '#/components/schemas/WebhookEncounterPrescribedData'
            - $ref: '#/components/schemas/WebhookEncounterCompletedData'
            - $ref: '#/components/schemas/WebhookEncounterCancelledData'
            - $ref: '#/components/schemas/WebhookEncounterScheduledData'
            - $ref: '#/components/schemas/WebhookOrderPlacedData'
            - $ref: '#/components/schemas/WebhookOrderPaidData'
            - $ref: '#/components/schemas/WebhookOrderCancelledData'
            - $ref: '#/components/schemas/WebhookOrderStatusChangedData'
            - $ref: '#/components/schemas/WebhookFulfillmentShippedData'
            - $ref: '#/components/schemas/WebhookFulfillmentDeliveredData'
            - $ref: '#/components/schemas/WebhookFulfillmentCancelledData'
            - $ref: '#/components/schemas/WebhookLabOrderCreatedData'
            - $ref: '#/components/schemas/WebhookLabResultsReceivedData'
            - $ref: '#/components/schemas/WebhookLabReviewCompletedData'
            - $ref: '#/components/schemas/WebhookLabDeviationFlaggedData'
            - $ref: '#/components/schemas/WebhookPrescriptionWrittenData'
            - $ref: '#/components/schemas/WebhookSubscriptionCreatedData'
            - $ref: '#/components/schemas/WebhookSubscriptionRenewedData'
            - $ref: '#/components/schemas/WebhookSubscriptionCancelledData'
            - $ref: '#/components/schemas/WebhookSubscriptionPaymentFailedData'
            - $ref: '#/components/schemas/WebhookSubscriptionPausedData'
            - $ref: '#/components/schemas/WebhookSubscriptionResumedData'
            - $ref: '#/components/schemas/WebhookSubscriptionRefillRequestedData'
            - $ref: '#/components/schemas/WebhookSubscriptionReassessmentDueData'
            - $ref: '#/components/schemas/WebhookPatientCreatedData'
            - $ref: '#/components/schemas/WebhookAppointmentScheduledData'
            - $ref: '#/components/schemas/WebhookAppointmentCancelledData'
            - $ref: '#/components/schemas/WebhookAppointmentRescheduledData'
            - $ref: '#/components/schemas/WebhookTestData'

