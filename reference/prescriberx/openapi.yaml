  # --------------------------------------------------------------------------
  # /prescriptions — Prescription read + cancel + status updates
  # --------------------------------------------------------------------------
  /prescriptions:
    get:
      tags: [Prescriptions]
      summary: List prescriptions (tenant-scoped)
      operationId: listPrescriptions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[encounter_id]',         in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[patient_chart_id]',     in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[provider_profile_id]',  in: query, schema: { type: string, format: uuid } }
        - { name: 'filter[status]',               in: query, schema: { type: string } }
        - { name: include, in: query, schema: { type: string, description: "Comma-separated includes (encounter, patientChart, prescriber, products)" } }
