                      plan_id: "019c1a2b-3c4d-5e6f-7a8b-9c0d1e2f3a4c"
                      quantity: 1
                  reason_for_visit: Weight management consultation
              05_multi_line_quantities:
                summary: Multiple lines mixing identifiers + quantities/months
                description: |
                  Several order lines in one intake: an exact SKU (qty 3), a
                  generic type for a 3-month supply, and a class-level generic.
                  Shows that quantity is per-line and honored on every shape.
                value:
                  encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
                  patient:
                    first_name: Jane
                    last_name: Smith
