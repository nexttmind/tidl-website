                        dosage_form: { type: string, nullable: true }
                        code: { type: string, nullable: true, description: "rxcui." }
                        display: { type: string }
              example: { data: [ { id: "7f..", name: "Semaglutide", patient_friendly_name: "Semaglutide", generic_name: "semaglutide", brand_name: "Ozempic", strength: "0.25 mg", dosage_form: "injection", code: "1991302", display: "Semaglutide 0.25 mg injection" } ] }
