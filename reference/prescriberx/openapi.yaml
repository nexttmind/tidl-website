          type: boolean

    Package:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
        pricing:
          $ref: '#/components/schemas/PackagePricing'
        product:
