  # ==========================================================================
  # Encounters — queue + provider/patient messaging  (reconciled 2026-09-13)
  # The /encounters/* group has NO ability middleware — access is enforced by
  # in-controller ownership (ApiEncounterAccess) / role checks, not token scopes.
  # ==========================================================================
  /encounters/queue:
    get:
      tags: [Encounters]
      summary: Global encounter queue + statistics
      description: >
        The global provider queue (pending intake / assignment / review) with
        queue statistics and SLA-breach count (admin surface — NOT tenant-scoped;
        any authenticated token reaches it). Optional `priority` / `status`
        filters narrow the returned queue.
      operationId: getEncounterQueue
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: priority, in: query, required: false, schema: { type: integer }, description: "Filter by EncounterPriority (1=urgent … 5=non-urgent)." }
        - { name: status, in: query, required: false, schema: { type: string }, description: "Filter by EncounterStatus value." }
      responses:
        '200':
          description: Queue + statistics
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /encounters/{id}/messages:
    get:
      tags: [Encounters]
      summary: Encounter conversation messages (poll)
      description: >
        Messages on an encounter's provider↔patient conversation, ordered
        `created_at, id`. Access is by encounter ownership (assigned provider,
        the patient's chart, or the owning client/sales-org tree).


        **Incremental poll:** pass `after` (a message id from a prior
        `meta.latest_cursor`, or an ISO-8601 timestamp) to get only messages
        newer than the cursor. Bearer tokens cannot authorize the realtime
        broadcast channel, so POLL this endpoint: first call without `after`,
        then feed `meta.latest_cursor` back each time. The response `meta` here is
        `{count, latest_cursor, has_more}` (no request_id/timestamp). If no
        conversation exists yet, returns an empty list + `latest_cursor: null`.
      operationId: listEncounterMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: after
          in: query
          required: false
          description: Keyset cursor — a message id (preferred, from a prior latest_cursor) or an ISO-8601 timestamp. Invalid/foreign value → 422.
          schema: { type: string }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 200, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: Messages (meta = count / latest_cursor / has_more)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        sent_at: { type: string, format: date-time }
                        sender_type: { type: string, enum: [patient, provider] }
                        sender_name: { type: string }
                        body: { type: string }
                        read_at: { type: string, format: date-time, nullable: true }
                  meta:
                    type: object
                    properties:
                      count: { type: integer }
                      latest_cursor: { type: string, nullable: true }
                      has_more: { type: boolean }
              example:
                success: true
                data: [ { id: "0192f-uuidv7", sent_at: "2026-09-13T11:59:02+00:00", sender_type: "provider", sender_name: "Dr. Lee", body: "Please upload your ID.", read_at: null } ]
                meta: { count: 1, latest_cursor: "0192f-uuidv7", has_more: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Encounters]
      summary: Send an encounter message
      description: >
        Post a message to the encounter's conversation (created lazily if needed).
        `sender_type` chooses whose identity the message is attributed to — the
        sender id is derived server-side (provider → assigned provider's user,
        else the patient), never trusted from input.
      operationId: sendEncounterMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
                sender_type: { type: string, enum: [patient, provider], default: patient }
            example: { body: "Thanks, I uploaded my ID.", sender_type: "patient" }
      responses:
        '201':
          description: Message sent
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==========================================================================
  # Prescriptions — prescribe / validate / refill  (reconciled 2026-09-13)
  # prescribe & validate are provider-facing (role-based auth: admin OR the
  # encounter's assigned provider). refill adds the prescription:read ability.
  # ==========================================================================
  /encounters/{encounterId}/prescribe:
    post:
      tags: [Prescriptions]
      summary: Prescribe for an encounter
      description: >
        Create a prescription for the encounter and transition it to PRESCRIBED.
        Authorization is ROLE-based: an admin, or the encounter's assigned
        provider — patient/client/sales-org tokens are 403'd. Runs preclusion
        validation first; a failure returns 422 with `errors`.
        `encounter_id`/`patient_chart_id`/`provider_profile_id`/`client_id` are
        derived from the encounter (not the body).
      operationId: prescribeForEncounter
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, sig, quantity, days_supply]
                    properties:
                      product_id: { type: string, format: uuid, description: "exists:products." }
                      dose_product_id: { type: string, format: uuid, description: "exists:doses." }
                      package_id: { type: string, format: uuid, description: "exists:packages." }
                      sig: { type: string, maxLength: 500, description: "Dosing directions." }
                      quantity: { type: integer, minimum: 1 }
                      days_supply: { type: integer, minimum: 1 }
                      daw: { type: boolean, default: false, description: "Dispense as written." }
                      patient_instructions: { type: string, maxLength: 1000 }
                      pharmacist_notes: { type: string, maxLength: 500 }
                pharmacy_notes: { type: string, maxLength: 1000 }
                diagnosis_codes: { type: array, items: { type: string, maxLength: 10 } }
                dea_number: { type: string, maxLength: 20 }
                npi_number: { type: string, maxLength: 20 }
                metadata: { type: object, additionalProperties: true }
            example:
              items: [ { product_id: "9f1c2a3e-...", dose_product_id: "3ab0...", sig: "Inject 0.25mg SC weekly", quantity: 4, days_supply: 28, daw: false, patient_instructions: "Rotate injection site." } ]
              diagnosis_codes: ["E66.9"]
              pharmacy_notes: "Ship refrigerated."
              dea_number: "BX1234567"
              npi_number: "1598765432"
      responses:
        '201':
          description: Prescription created
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Body validation OR preclusion failure (errors listed)
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }

  /encounters/{encounterId}/prescribe/validate:
    post:
      tags: [Prescriptions]
      summary: Validate a prescription (dry run)
      description: >
        Side-effect-free preclusion/validation preview for a proposed
        prescription — no persistence, no status change. Returns validity plus
        errors/warnings/checks.
      operationId: validatePrescription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, sig, quantity, days_supply]
                    properties:
                      product_id: { type: string, format: uuid }
                      dose_product_id: { type: string, format: uuid }
                      sig: { type: string, maxLength: 500 }
                      quantity: { type: integer, minimum: 1 }
                      days_supply: { type: integer, minimum: 1 }
            example: { items: [ { product_id: "9f1c2a3e-...", sig: "Inject 0.25mg SC weekly", quantity: 4, days_supply: 28 } ] }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example: { success: true, data: { valid: true, errors: [], warnings: [], checks: [] } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /prescriptions/{id}/refill:
    post:
      tags: [Prescriptions]
      summary: Request a prescription refill
      description: >
        Request a refill. Requires `prescription:read` plus refill authorization
        (admin / assigned provider / owning patient / owning client or sales-org).
        A plain Rx charges the card on file (product + shipping); a
        subscription-backed Rx routes through the subscription lane. When there is
        no card on file, the response indicates a checkout fallback the client
        must complete.


        The HTTP status reflects the outcome: `charged` / `subscription` /
        `checkout_fallback` → 200; `payment_failed` → **402**.
      operationId: refillPrescription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000, description: "Free-text refill note." }
            example: { note: "Patient requested early refill before travel." }
      responses:
        '200':
          description: Refill processed (outcome = charged | subscription | checkout_fallback)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  outcome: { type: string, enum: [charged, subscription, checkout_fallback] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      order_id: { type: string, format: uuid, nullable: true }
                      subscription_id: { type: string, format: uuid, nullable: true }
              example: { success: true, outcome: "charged", message: "Refill charged.", data: { order_id: "ord...", subscription_id: null } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/PaymentRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ==========================================================================
  # Lab orders — read/list  (reconciled 2026-09-13)
  # ==========================================================================
  /encounters/{id}/labs:
    get:
      tags: [LabOrders]
      summary: List an encounter's lab orders
      description: >
        Lab orders for the encounter (this alias lives in the encounters group,
        so it is gated by tenant ownership, not the `lab:read` ability). Supports
        the same filters/sorts/includes as the main lab-orders index.
      operationId: listEncounterLabOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: 'filter[status]', in: query, required: false, schema: { type: string } }
        - { name: 'filter[lab_payment_status]', in: query, required: false, schema: { type: string } }
        - { name: 'filter[billing_type]', in: query, required: false, schema: { type: string } }
        - { name: 'filter[lab_center_id]', in: query, required: false, schema: { type: string, format: uuid } }
        - { name: 'filter[lab_panel_id]', in: query, required: false, schema: { type: string, format: uuid } }
        - { name: sort, in: query, required: false, schema: { type: string, default: '-created_at' }, description: "Allowed: ordered_at, results_received_at, created_at, status." }
        - { name: include, in: query, required: false, schema: { type: string }, description: "labCenter, labPanel, orderTests, orderTests.results." }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated lab orders
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /patients/{patientChartId}/labs:
    get:
      tags: [LabOrders]
      summary: List a chart's lab orders
      description: >
        Lab orders for the patient chart (requires `patient:read`). The tenant
        predicate still applies — a patient token only sees its own chart's
        orders; org/client tokens are scoped to their tree.
      operationId: listChartLabOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: patientChartId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: 'filter[status]', in: query, required: false, schema: { type: string } }
        - { name: 'filter[lab_payment_status]', in: query, required: false, schema: { type: string } }
        - { name: 'filter[billing_type]', in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, default: '-created_at' } }
        - { name: include, in: query, required: false, schema: { type: string } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated lab orders
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lab-orders/{id}:
    get:
      tags: [LabOrders]
      summary: Get a lab order (with results)
      description: >
        One lab order with its results (biomarker values, reference ranges,
        flags). Requires `lab:read`. Visibility relies on the chart global scope.
      operationId: getLabOrderDetail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Lab order
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # Patient portal — held-encounter completion (Batch B)  (reconciled 2026-09-13)
  # ==========================================================================
  /me/patient/encounters/{encounterId}/requirements:
    get:
      tags: [PatientPortal]
      summary: What a held encounter still needs
      description: >
        Projects what the authenticated patient must still provide to move a held
        (REQUIRES_INFORMATION) encounter forward — required intake fields plus
        identity documents / DL text. `resolvable_via_api` is false when a
        provider is attached (that is a provider-driven info request, not
        completable via `provide-information`) or the encounter isn't held.
      operationId: getMyEncounterRequirements
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Requirements projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                data:
                  encounter_id: "enc..."
                  status: "requires_information"
                  resolvable_via_api: true
                  info_request_message: "Please upload a photo of your ID and confirm your shipping address."
                  completeness_pct: 60
                  items:
                    - { slug: "id-front", label: "Government ID (front)", type: "file", satisfied: false }
                    - { slug: "address_zip", label: "ZIP code", type: "field", satisfied: false }
                  missing: ["id-front", "address_zip"]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/patient/encounters/{encounterId}/provide-information:
    post:
      tags: [PatientPortal]
      summary: Provide missing information for a held encounter
      description: >
        Submit the information a held (REQUIRES_INFORMATION) encounter is waiting
        on. Requires `patient:read` AND `patient:update`. Accepts
        `multipart/form-data` so identity photos can be uploaded. Send only the
        fields that were missing (all optional). The action requires the
        encounter to be held with NO provider attached (else 409); when every
        required item is satisfied it clears the hold and transitions the
        encounter to UNASSIGNED (re-enters auto-assign) — otherwise it stays held
        and returns 422 with what's still missing.


        Discover exactly which fields/documents to send via
        `GET /me/patient/encounters/{encounterId}/requirements`.
      operationId: provideMyEncounterInformation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounterId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: string }
                date_of_birth: { type: string, format: date }
                gender: { type: string, maxLength: 32 }
                phone: { type: string, maxLength: 32 }
                email: { type: string, format: email }
                address_street1: { type: string }
                address_street2: { type: string }
                address_city: { type: string, maxLength: 128 }
                address_state: { type: string, maxLength: 64 }
                address_zip: { type: string, maxLength: 16, description: "Shipping address is a hard intake gate." }
                weight: { type: string, maxLength: 16 }
                height_feet: { type: string, maxLength: 8 }
                height_inches: { type: string, maxLength: 8 }
                drivers_license_number: { type: string, maxLength: 64 }
                drivers_license_state: { type: string, maxLength: 64 }
                id_front: { type: string, format: binary, description: "Image/file, max 10 MB." }
                id_back: { type: string, format: binary }
                selfie_photo: { type: string, format: binary }
                body_photo: { type: string, format: binary }
      responses:
        '200':
          description: Intake completed — encounter released for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
              example:
                success: true
                message: "Intake completed — your encounter has been submitted for review."
                data: { released: true, missing: [], missing_fields: [], missing_docs: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Encounter is not awaiting patient completion (wrong status, or a provider is attached)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422':
          description: Body validation, no intake linked, OR still-incomplete (errors.missing / missing_fields / missing_docs)
          content: { application/json: { schema: { $ref: '#/components/schemas/ValidationErrorResponse' } } }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Sanctum bearer token from POST /auth/login. Must be sent alongside
        `Accept: application/json` on every request — see the "Required Headers"
        section in the API description for details.

  parameters:
    AcceptHeader:
      name: Accept
      in: header
      required: true
      description: |
        MUST be `application/json` on every request. Without this header,
        authentication failures return a 302 redirect to the web login page
        instead of a JSON 401 response. The server injects this header via
        middleware as a safety net, but clients should still send it explicitly.
      schema:
        type: string
        enum:
          - application/json
        default: application/json
      example: application/json

    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "019b9783-d3fe-730a-8278-b131e3ad6b57"

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 25
        maximum: 100

    SortParam:
      name: sort
      in: query
      schema:
        type: string
      description: "Field to sort by. Prefix with - for descending (e.g., -created_at)"

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthenticated.

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized action.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Resource not found.

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            success: false
            message: Validation failed
            errors:
              email: ["The email field is required."]
              password: ["The password field is required."]

    PaymentRequired:
      description: Payment failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Payment declined.

  # ==========================================================================
  # SCHEMAS
  # ==========================================================================
  schemas:

    # ------------------------------------------------------------------------
    # Peptides (Ingredient Knowledge Base)
    # ------------------------------------------------------------------------
    PeptideListItem:
      type: object
      properties:
        generic_name: { type: string, example: semaglutide }
        compound_class: { type: string, nullable: true, example: GLP-1 receptor agonist }
        brand_names:
          type: array
          items: { type: string }
          example: [Ozempic, Wegovy]
        synonyms:
          type: array
          items: { type: string }
        evidence_tier: { type: string, nullable: true, example: A }
        summary: { type: string, nullable: true, description: Truncated patient summary }
        updated_at: { type: string, format: date-time, nullable: true }

    Peptide:
      type: object
      description: |
        Clinician sections and evidence_score are null for audience=patient.
        drug_interactions and preclusions are null unless audience=clinician AND
        the token holds peptide:clinical:read.
      properties:
        generic_name: { type: string, example: semaglutide }
        compound_class: { type: string, nullable: true }
        brand_names: { type: array, items: { type: string } }
        synonyms: { type: array, items: { type: string } }
        description: { type: string, nullable: true }
        evidence_tier: { type: string, nullable: true }
        evidence_score: { type: string, nullable: true, description: Clinician audience only }
        mechanism_of_action: { type: string, nullable: true, description: Clinician audience only }
        sections:
          type: object
          properties:
            overview: { type: string, nullable: true }
            patient_summary: { type: string, nullable: true }
            pharmacology: { type: string, nullable: true, description: Clinician audience only }
            clinical_evidence: { type: string, nullable: true, description: Clinician audience only }
            dosing_guidelines: { type: string, nullable: true, description: Clinician audience only }
            safety_profile: { type: string, nullable: true, description: Clinician audience only }
        dosing:
          type: array
          description: Approved dosing guidance (both audiences).
          items:
            type: object
            properties:
              indication: { type: string, nullable: true }
              route_of_administration: { type: string, nullable: true }
              initial_dose: { type: string, nullable: true }
              initial_dose_unit: { type: string, nullable: true }
              maintenance_dose: { type: string, nullable: true }
              maintenance_dose_unit: { type: string, nullable: true }
              max_dose: { type: string, nullable: true }
              max_dose_unit: { type: string, nullable: true }
              frequency: { type: string, nullable: true }
        drug_interactions:
          type: array
          nullable: true
          description: Approved interactions. Null unless audience=clinician AND token holds peptide:clinical:read.
          items:
            type: object
            properties:
              medication_a_name: { type: string }
              medication_b_name: { type: string }
              severity: { type: string, nullable: true }
              mechanism: { type: string, nullable: true }
              clinical_management: { type: string, nullable: true }
        preclusions:
          type: array
          nullable: true
          description: Approved preclusions/contraindications. Null unless audience=clinician AND token holds peptide:clinical:read.
          items:
            type: object
            properties:
              restricted_name: { type: string }
              severity: { type: string, nullable: true }
              reason: { type: string, nullable: true }
        references:
          type: array
          items: { type: object }
          description: Clinical references with source attribution.
        audience: { type: string, enum: [patient, clinician] }
        disclaimer: { type: string, description: "Off-label / clinical-supervision disclaimer, always present." }
        updated_at: { type: string, format: date-time, nullable: true }

    # ------------------------------------------------------------------------
    # Standard Response Envelopes
    # ------------------------------------------------------------------------
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'

    # Generic data envelope used by Phase 2 endpoints whose per-route
    # response shape isn't yet enumerated. Refines `SuccessResponse` by
    # asserting a `data` object/array — clients should code against the
    # envelope and treat `data` as opaque until tighter typing lands in
    # Phase 3.
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: array, items: { type: object, additionalProperties: true } }
        message:
          type: string
        meta:
          $ref: '#/components/schemas/Meta'

    PatientVitalCreateRequest:
      type: object
      required: [patient_chart_id, type]
      description: |
        Generic vital-creation payload. Each `type` requires its own value
        field — `weight_lbs` for `weight`, `systolic`+`diastolic` for
        `blood_pressure`, `glucose_mgdl` for `glucose`, etc. The
        type-specific endpoints (e.g. `/me/patient/vitals/weight`) provide
        stricter, per-type schemas.
      properties:
        patient_chart_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [weight, blood_pressure, glucose, heart_rate, height, temperature, oxygen_saturation, respiratory_rate, other]
        weight_lbs:        { type: number, minimum: 50, maximum: 800 }
        height_inches:     { type: number, minimum: 30, maximum: 96 }
        systolic:          { type: integer, minimum: 60, maximum: 250 }
        diastolic:         { type: integer, minimum: 40, maximum: 150 }
        heart_rate_bpm:    { type: integer, minimum: 40, maximum: 200 }
        glucose_mgdl:      { type: number,  minimum: 20, maximum: 800 }
        temperature_f:     { type: number,  minimum: 80, maximum: 115 }
        oxygen_saturation: { type: integer, minimum: 50, maximum: 100 }
        respiratory_rate:  { type: integer, minimum: 6,  maximum: 60 }
        fasting:           { type: boolean, description: "Glucose only — was the reading taken fasting?" }
        recorded_at:       { type: string, format: date-time }
        note:              { type: string, maxLength: 500 }

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
