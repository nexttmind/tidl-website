  /patients/{id}/issue-token:
    post:
      tags: [Patients]
      summary: Issue a patient-scoped portal token
      description: |
        Mint a short-lived (30 min) bearer token scoped to a single patient, for
        a white-label patient portal. `{id}` is the **PatientChart id**. If the
        chart has no linked user yet, a passwordless ACTIVE patient user is
        auto-provisioned from the chart demographics (re-linked by email).

        Requires the `patient:issue-token` ability AND ownership of the chart
        (tenant hierarchy honored; admins bypass). The minted token is capped to
        the PATIENT ability set — requesting abilities beyond that returns 422.
        PHI-audit-logged with the issuer.
      operationId: issuePatientToken
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid }, description: PatientChart id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  maxLength: 120
                  description: Required label for the issued token (matches IssuePatientTokenData::$device_name). NOTE the field is device_name, not token_name.
                abilities:
                  type: array
                  items: { type: string }
                  description: Subset of the patient ability set. Defaults to the full patient set.
            example:
              device_name: "portal-session"
              abilities: ["patient:read"]
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /patients/{patientId}/allergies:
    get:
      tags: [Patients]
      summary: List patient allergies
      operationId: listPatientAllergies
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "019d5561-7b24-7096-baa7-85485643b0a7"
      responses:
        '200':
          description: Allergy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        severity:
                          type: string
                          nullable: true
                        reaction:
                          type: string
                          nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Patients]
      summary: Add patient allergy
      description: |
        Adds an allergy to the patient chart. Supply EITHER `allergy_name`
        (free-text — for patient-typed input that doesn't match terminology)
        OR `terminology_allergy_id` (catalog reference from
        `GET /telehealth/allergies` search). If both are supplied, the
        explicit `allergy_name` wins. Unmatched patient input persists
        as-is with `terminology_allergy_id = null`.

        Back-compat: `name` is accepted as an alias for `allergy_name`.
      operationId: addPatientAllergy
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allergy_name:
                  type: string
                  description: Free-text allergen name. Required unless `terminology_allergy_id` provided.
                  example: Penicillin
                name:
                  type: string
                  deprecated: true
                  description: Back-compat alias for `allergy_name`. Use `allergy_name` going forward.
                terminology_allergy_id:
                  type: string
                  format: uuid
                  description: Optional reference to a `terminology_allergies` row. When provided without `allergy_name`, the catalog's `allergen_name` is used.
                allergy_type:
                  type: string
                  nullable: true
                  description: Optional classification (e.g. "drug", "food", "environmental").
                allergy_severity:
                  type: string
                  nullable: true
                  description: Optional severity label (e.g. "mild", "moderate", "severe").
                allergy_reaction:
                  type: string
                  nullable: true
                snomed_code:
                  type: string
                  nullable: true
                allergy_notes:
                  type: string
                  nullable: true
            examples:
              freeText:
                summary: Free-text (no terminology match)
                value: { allergy_name: "Penicillin", allergy_severity: "severe", allergy_reaction: "anaphylaxis" }
              fromTerminology:
                summary: From terminology catalog
                value: { terminology_allergy_id: "00052176-3351-4ba4-8100-666505f84e4f", allergy_severity: "mild" }
      responses:
        '201':
          description: Allergy added
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

