            curl -X GET "https://demo.prescribe-rx.com/api/v1/packages?per_page=10" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $packages = Http::withToken($token)
                ->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/packages', ['per_page' => 10])
                ->json('data');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch(
              'https://demo.prescribe-rx.com/api/v1/packages?per_page=10',
              { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } },
