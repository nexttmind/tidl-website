      description: |
        Fires per Rx (line-item-level signing) — distinct from
        `encounter.prescribed` which fires once per encounter state machine
        transition. A single encounter can fire multiple prescription.written
        events.
      properties:
        prescription_id: { type: string, format: uuid }
        prescription_number: { type: string, nullable: true }
        encounter_id: { type: string, format: uuid }
        patient_chart_id: { type: string, format: uuid }
        provider_profile_id: { type: string, format: uuid }
        status: { type: string }
        signed_at: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionCreatedData:
      type: object
      properties:
        event_type: { type: string, enum: [subscription.created] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid, nullable: true }
        status: { type: string, example: "active" }
        billing_term: { type: string, nullable: true }
        grand_total: { type: number, format: float, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionRenewedData:
      type: object
      properties:
        event_type: { type: string, enum: [subscription.renewed] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        status: { type: string }
        renewal_order_id: { type: string, format: uuid, nullable: true }
        renewal_order_number: { type: string, nullable: true }
        renewal_count: { type: integer, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionCancelledData:
      type: object
      properties:
        event_type: { type: string, enum: [subscription.cancelled] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        status: { type: string, example: "cancelled" }
        cancelled_at: { type: string, format: date-time }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionPaymentFailedData:
      type: object
      properties:
        event_type: { type: string, enum: [subscription.payment_failed] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        status: { type: string }
        failure_reason: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    # ── Subscription lifecycle: pause / resume / refill / reassessment ──
    # All four share the base subscription shape (subscriptionEventFromModel)
    # plus event-specific extras. external_order_id is echoed when the
    # subscription's originating order came through the External Telehealth API.

    WebhookSubscriptionPausedData:
      type: object
      description: |
        Fires when a subscription is paused (billing suspended, no charges/refills
        generated until resumed). Base subscription shape; no extra fields.
      properties:
        event_type: { type: string, enum: [subscription.paused] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid, nullable: true }
        status: { type: string, example: "paused" }
        billing_term: { type: string, nullable: true }
        grand_total: { type: number, format: float, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionResumedData:
      type: object
      description: |
        Fires when a paused subscription is resumed and billing recommences.
        Base subscription shape; no extra fields.
      properties:
        event_type: { type: string, enum: [subscription.resumed] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid, nullable: true }
        status: { type: string, example: "active" }
        billing_term: { type: string, nullable: true }
        grand_total: { type: number, format: float, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionRefillRequestedData:
      type: object
      description: |
        Fires when a refill is requested against a subscription (patient-, admin-,
        or integrator-initiated). For externally-billed subscriptions this is the
        signal to originate + charge the refill on your side.
      properties:
        event_type: { type: string, enum: [subscription.refill_requested] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid, nullable: true }
        status: { type: string }
        billing_term: { type: string, nullable: true }
        grand_total: { type: number, format: float, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        requested_at: { type: string, format: date-time }
        note:
          type: string
          nullable: true
          description: Optional free-text note supplied with the refill request.
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookSubscriptionReassessmentDueData:
      type: object
      description: |
        Fires when a subscription reaches a reassessment checkpoint (a new
        provider encounter is required before further dispensing). `checkpoint_id`
        identifies the checkpoint that came due.
      properties:
        event_type: { type: string, enum: [subscription.reassessment_due] }
        subscription_id: { type: string, format: uuid }
        subscription_number: { type: string, nullable: true }
        patient_chart_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid, nullable: true }
        status: { type: string }
        billing_term: { type: string, nullable: true }
        grand_total: { type: number, format: float, nullable: true }
        next_bill_at: { type: string, format: date-time, nullable: true }
        last_billed_at: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }
        checkpoint_id: { type: string, format: uuid, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookPatientCreatedData:
      type: object
      properties:
        patient_chart_id: { type: string, format: uuid }
        patient_number: { type: string, nullable: true }
        client_id: { type: string, format: uuid, nullable: true }
        sales_organization_id: { type: string, format: uuid, nullable: true }
        source:
          type: string
          enum: [api, admin, intake, embed, registration]
          description: |
            Differentiates how the chart was created. `api` = direct API
            client, `admin` = admin UI, `intake` = in-app intake wizard,
            `embed` = third-party embed wizard, `registration` = self-signup.
        created_at: { type: string, format: date-time }

    WebhookAppointmentScheduledData:
      type: object
      properties:
        event_type: { type: string, enum: [appointment.scheduled] }
        appointment_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid, nullable: true }
        patient_chart_id: { type: string, format: uuid, nullable: true }
        provider_profile_id: { type: string, format: uuid, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        duration_minutes: { type: integer, nullable: true }
        status: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookAppointmentCancelledData:
      type: object
      properties:
        event_type: { type: string, enum: [appointment.cancelled] }
        appointment_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid, nullable: true }
        patient_chart_id: { type: string, format: uuid, nullable: true }
        provider_profile_id: { type: string, format: uuid, nullable: true }
        scheduled_at: { type: string, format: date-time, nullable: true }
        cancellation_reason: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookAppointmentRescheduledData:
      type: object
      properties:
        event_type: { type: string, enum: [appointment.rescheduled] }
        appointment_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid, nullable: true }
        patient_chart_id: { type: string, format: uuid, nullable: true }
        provider_profile_id: { type: string, format: uuid, nullable: true }
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: New scheduled time after the reschedule.
        timestamp: { type: string, format: date-time }
        external_order_id:
          type: string
          nullable: true
          description: Integrator's originating order id, when applicable. See WebhookEnvelope.

    WebhookTestData:
      type: object
      description: |
        Body of a test delivery from `POST /webhooks/{id}/test`. Use this
        to verify your endpoint handles deliveries correctly before
        receiving real events.
      properties:
        message:
          type: string
          example: "This is a test webhook delivery from PrescribeRx."
        subscription_url: { type: string, format: uri }
        subscribed_events:
          type: array
          items: { type: string }
        test_sent_at: { type: string, format: date-time }

    # ──────────────────────────────────────────────────────────────────
    # Chat (drop-in widget endpoints)
    # ──────────────────────────────────────────────────────────────────

    ChatBranding:
      type: object
      description: |
        Per-agent branding payload. All fields optional. Missing keys
        fall back to widget defaults (neutral blue, system font, no
        logo). Edits flow live to mounted widgets on the next page
        load — no sales-org redeploy needed.
      properties:
        avatar_url:
          type: string
          format: uri
          description: 32×32 round image in the chat header. Square images render best.
          example: https://cdn.example.com/avatar.png
        logo_url:
          type: string
          format: uri
          description: |
            Optional wider rectangular brand mark (up to 160×32). When
            set, replaces the round avatar and the header slot adopts
            the `prxc-has-logo` class.
          example: https://cdn.example.com/logo.svg
        color:
          type: string
          description: |
            Primary brand color. Hex, leading `#` recommended.
            Drives header background, user message bubbles, send
            button, and the suggestion-card "Add to cart" button.
            Surfaced as the `--prxc-brand` CSS variable.
          example: "#0d6efd"
        secondary_color:
          type: string
          description: |
            Accent color. Drives suggestion-card price text and a 3px
            left border on bot messages. Falls back to `color` when
            unset. Surfaced as the `--prxc-brand-secondary` CSS variable.
          example: "#198754"
        font_family:
          type: string
          description: |
            CSS `font-family` stack applied to the entire widget root.
            **The host page is responsible for loading any web fonts**
            via `@font-face` or `<link>` — the widget does not.
          example: "'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
        custom_css:
          type: string
          maxLength: 8000
          description: |
            Raw CSS injected into the host page as a separate
            `<style id="prxc-custom-styles">` tag. **Admins are
            responsible for scoping selectors with `.prxc-root`** so
            rules don't leak onto the rest of the host site. Same
            trust model as `system_prompt_overrides` (admin-only).
          example: |
            .prxc-root .prxc-card { box-shadow: 0 4px 12px rgba(0,0,0,.08); }
            .prxc-root .prxc-bubble-bot { border-radius: 6px; }

    ChatAgentInitResponse:
      type: object
      required: [agent_code, name, opening_message, branding, max_conversation_turns]
      properties:
        agent_code:
          type: string
          pattern: '^CHAT-[A-Z0-9]+$'
          example: CHAT-1RAK9HBC
        name:
          type: string
          example: Wellness Recommender
        opening_message:
          type: string
          description: First chat bubble shown to the visitor when the panel opens.
          example: "Hi! What are you looking to address today?"
        branding:
          $ref: '#/components/schemas/ChatBranding'
        max_conversation_turns:
          type: integer
          description: Soft cap. The widget surfaces a "Start over" banner once exceeded.
          example: 20

    ChatTurnRequest:
      type: object
      required: [agent_code, message]
      properties:
        agent_code:
          type: string
          pattern: '^CHAT-[A-Z0-9]+$'
          example: CHAT-1RAK9HBC
        message:
          type: string
          maxLength: 4000
          description: Visitor's message for this turn. Plain text — no markdown processing.
          example: "I want help losing 20 pounds."
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: |
            UUID returned by the previous turn. Pass `null` (or omit)
            on the first turn — the response carries the new id.
            **Cross-tenant safe:** if the id belongs to a different
            agent, the server starts a fresh conversation rather than
            reading the foreign thread.
          example: "019df767-e17d-7040-aff4-a6737db5e371"
        visitor_fingerprint:
          type: string
          maxLength: 64
          nullable: true
          description: |
            Anonymous visitor token persisted by the widget in
            `localStorage` under `__prxChatFp`. Used for
            repeat-visitor analytics (Phase 5/6). Never PHI.
          example: "abc123def456ghi789jkl012"

    ChatProductSuggestion:
      type: object
      required: [product_id, name, reason]
      description: |
        One product card the model recommended. The `product_id` is
        guaranteed to be inside the agent's strict allowed-set
        (catalog post-filter — hallucinated ids are dropped before
        the response leaves the controller).
      properties:
        product_id:
          type: string
          format: uuid
          description: Canonical product UUID. Hand to `PrescribeRx.addProduct(id)` if running the embed bridge, or to your custom cart.
          example: "019c882f-1f9b-71b8-9c72-aaaaaaaaaaaa"
        name:
          type: string
          example: "NAD+ 1000mg (100mg/ml 10ml vial)"
        description:
          type: string
          nullable: true
          example: "Cellular energy + recovery support."
        price:
          type: number
          format: float
          nullable: true
          description: Sales-org retail price, already org-cascaded by `PricingService`.
          example: 10.50
        sku:
          type: string
          nullable: true
          example: "NAD-1000"
        reason:
          type: string
          description: One-sentence justification the model produced for this customer's specific message.
          example: "Supports the energy + athletic-recovery goal you mentioned."

    ChatTurnResponse:
      type: object
      required: [conversation_id, turn_count, conversation_complete, reply, suggestions]
      properties:
        conversation_id:
          type: string
          format: uuid
          description: Pass back on every subsequent turn for context continuity.
        turn_count:
          type: integer
          description: How many turns the conversation has used. Compared to `max_conversation_turns` on the init response.
        conversation_complete:
          type: boolean
          description: |
            `true` once the turn cap is hit. The widget disables the
            input and renders a "Start over" banner. New turns return
            HTTP 410 with the same flag.
        reply:
          type: string
          description: Free-text assistant reply, ≤ 4 sentences (model-side rule). Always ends with the disclaimer "Not medical advice — a licensed provider reviews everything during intake."
        suggestions:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ChatProductSuggestion' }
          description: 0 to `max_suggestions_per_response` cards. Empty when the model is still gathering info.

    # ------------------------------------------------------------------
    # External Telehealth — Phase 1/2 schemas
    # See /api/docs/external-telehealth-guide for narrative + curl ref.
    # ------------------------------------------------------------------
    ExternalProviderCreateRequest:
      type: object
      required: [client_id, npi, first_name, last_name, designation]
      properties:
        client_id: { type: string, format: uuid }
        npi:
          type: string
          maxLength: 20
          description: 10-digit NPI. Dashes/whitespace allowed; stripped on save.
        dea: { type: string, maxLength: 30 }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        designation: { type: string, maxLength: 100, example: "MD" }
        prefix: { type: string, enum: [DR, MR, MRS, MS] }
        suffix: { type: string, enum: [MD, DO, NP, PA, CMA, LPN, DPM, CNS, DM, DP] }
        dob: { type: string, format: date }
        gender: { type: integer, enum: [1, 2, 3], description: "1=Male, 2=Female, 3=Other" }
        email: { type: string, format: email, description: "Optional; auto-generated stub if missing" }
        mobile_phone: { type: string }
        bio: { type: string }
        state_licenses:
          type: array
          items: { $ref: '#/components/schemas/ExternalStateLicenseInput' }

    ExternalStateLicenseInput:
      type: object
      required: [state]
      properties:
        state: { type: string, minLength: 2, maxLength: 2, description: "USPS 2-letter state code", example: "GA" }
        license_type: { type: string, example: "MD" }
        license_number: { type: string }
        expiration_date: { type: string, format: date }

    ExternalProvider:
      type: object
      properties:
        provider_profile_id: { type: string, format: uuid }
        provider_number: { type: string, example: "PROV-1234567890" }
        npi: { type: string }
        dea: { type: string, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        prefix: { type: string, nullable: true }
        suffix: { type: string, nullable: true }
        designation: { type: string }
        status:
          type: string
          enum: [ACTIVE, ON_LEAVE, INACTIVE, PENDING]
          description: "Orders accepted only when status=ACTIVE"
        client_id: { type: string, format: uuid }
        sales_organization_id: { type: string, format: uuid, nullable: true }
        created_via: { type: string, example: "external_telehealth_api", nullable: true }
        created_at: { type: string, format: date-time }
        state_licenses:
          type: array
          items:
            type: object
            properties:
              state: { type: integer }
              license_number: { type: string, nullable: true }
              expiration_date: { type: string, format: date, nullable: true }
              status: { type: integer, nullable: true }

    ExternalProviderEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ExternalProvider' }
        message: { type: string }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }

    ExternalProviderListEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/ExternalProvider' }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }

    ExternalProviderCollisionEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: "Provider already exists at this client." }
        data:
          type: object
          properties:
            provider_profile_id: { type: string, format: uuid }
            provider_number: { type: string, example: "PROV-1234567890" }
            client_id: { type: string, format: uuid }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }

    ExternalOrderCreateRequest:
      type: object
      required: [client_id, provider_npi, patient, shipping_address, prescription, lines]
      properties:
        client_id: { type: string, format: uuid }
        provider_npi:
          type: string
          description: "Must resolve to an ACTIVE ProviderProfile at this client."
        external_order_id:
          type: string
          maxLength: 100
          description: "Your internal order id. Round-tripped on every webhook payload and on the response. Distinct from Idempotency-Key."
        notes: { type: string }
        patient: { $ref: '#/components/schemas/ExternalPatientInput' }
        shipping_address: { $ref: '#/components/schemas/ExternalAddressInput' }
        prescription: { $ref: '#/components/schemas/ExternalPrescriptionInput' }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ExternalOrderLineInput' }

    ExternalPatientInput:
      type: object
      required: [first_name, last_name, email, date_of_birth, phone, address]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        date_of_birth: { type: string, format: date }
        phone: { type: string }
        gender: { type: integer, enum: [1, 2, 3] }
        address: { $ref: '#/components/schemas/ExternalAddressInput' }

    ExternalAddressInput:
      type: object
      required: [line1, city, state, postal_code]
      properties:
        line1: { type: string }
        line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string, description: "USPS 2-letter" }
        postal_code: { type: string }
        country: { type: string, default: "US" }

    ExternalPrescriptionInput:
      type: object
      required: [pdf_base64, signed_at, signed_by_name]
      properties:
        pdf_base64:
          type: string
          description: "Base64-encoded PDF bytes. Must begin with `%PDF-` after decoding. Max 10 MB decoded."
        signed_at:
          type: string
          format: date-time
          description: "ISO 8601 timestamp when your e-Rx system signed the PDF."
        signed_by_name:
          type: string
          description: "Human-readable prescriber name as printed on the PDF."

    ExternalOrderLineInput:
      type: object
      required: [sku, quantity, sig, days_supply, dose_amount, dose_unit, frequency]
      properties:
        sku: { type: string, description: "Product SKU. Must resolve to an active Product." }
        quantity: { type: integer, minimum: 1 }
        sig: { type: string }
        days_supply: { type: integer, minimum: 1 }
        dose_amount: { type: string, example: "0.25" }
        dose_unit: { type: string, example: "mg" }
        frequency: { type: string, example: "weekly" }
        refills: { type: integer, default: 0 }
        daw: { type: boolean, default: false }
        compounding_reason_slug:
          type: string
          description: |
            **Required when the resolved product is `is_compounded=true`.**
            Slug from `compounding_reasons.code`. Common values include
            `dose-not-commercially-available`, `commercial-shortage`,
            `titration-flexibility`, `commercial-excipient-allergy`,
            `combination-not-commercial`. Ask your account rep for the
            full catalog.
        clinical_notes: { type: string }

    ExternalOrder:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        order_number: { type: string, example: "ORD-1234567890" }
        idempotency_key: { type: string }
        external_order_id: { type: string, nullable: true }
        client_id: { type: string, format: uuid }
        sales_organization_id: { type: string, format: uuid, nullable: true }
        payment_status:
          type: string
          enum: [CLIENT_BILLED]
          description: "Always CLIENT_BILLED for External Telehealth orders. Sales org invoiced separately; no patient-side capture."
        workflow_status: { type: string, example: "PROCESSING" }
        shipping_status: { type: string, example: "NONE" }
        patient_chart_id: { type: string, format: uuid }
        provider_profile_id: { type: string, format: uuid }
        prescription_id: { type: string, format: uuid }
        prescription_pdf_path: { type: string, description: "S3 path to the supplied PDF (your original, not a re-render)." }
        grand_total: { type: string, example: "150.00" }
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              sku: { type: string }
              quantity: { type: integer }
              wholesale_price: { type: string }
              total_price: { type: string }
        created_at: { type: string, format: date-time }

    ExternalOrderEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ExternalOrder' }
        message: { type: string }
        meta:
          type: object
          properties:
            request_id: { type: string, format: uuid }
            timestamp: { type: string, format: date-time }
