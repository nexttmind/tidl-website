  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      description: >-
        Cancel an order. By default (`process_refund=true`) a captured payment
        is refunded to the card. Send `process_refund=false` to cancel and void
        the order at the fulfillment center WITHOUT refunding (the charge is
        retained). A refund that would exceed the original captured amount
        (e.g. the payment is already fully refunded) is blocked server-side and
        never sent to the gateway, to avoid duplicate-credit rejections.
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                process_refund:
                  type: boolean
                  default: true
                  description: >-
                    Whether to refund the captured payment to the card. Defaults
                    to true. Set false to cancel without refunding (retain the
                    charge).
            example:
              reason: Patient requested cancellation
              process_refund: true
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/record-reversal:
    post:
      tags: [Orders]
      summary: Record an externally-executed reversal (refund or void)
      description: >-
        The reverse-direction mirror of `payment.mode=reference_captured`. Under
        the shared-merchant model YOU ran the refund/void on your gateway; this
        records it on PrescribeRx so the ledger and the order reflect it. PRX
        **never calls the gateway here.** It records the reversal (an external
        transaction), updates the original transaction's refunded/voided ledger,
        flips the order's `payment_status` (which fires the `order.refunded` /
        `order.voided` webhook), and **halts still-unshipped fulfillment on a full
        reversal** (a partial refund does not stop the shipment).


        Idempotent — a reversal already recorded for the same original gateway
        transaction + type is returned unchanged (dedup). A refund exceeding the
        refundable balance is refused (`409`).


        **Invariant:** there must be exactly ONE reversal initiator. If you record
        reversals here, do NOT also use PrescribeRx's own gateway-calling
        refund/void (admin console) on the same order, or the customer is
        double-refunded.
      operationId: recordOrderReversal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: >-
            Replays the prior recorded response on retry. REQUIRED for safe retries
            when you do NOT send reversal_gateway_transaction_id — the server does
            not dedup partial refunds on the original txn alone (distinct partials
            must not be conflated), so without a reversal id or this key a retried
            partial refund would record twice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [refund, void]
                amount:
                  type: number
                  minimum: 0.01
                  description: >-
                    Amount reversed. Required for a partial refund; for a full
                    refund or a void it defaults to the original captured/held amount.
                original_gateway_transaction_id:
                  type: string
                  maxLength: 255
                  description: The gateway transaction id being reversed (locates the PRX row to update).
                reversal_gateway_transaction_id:
                  type: string
                  maxLength: 255
                  description: The reversal's OWN gateway id, if you have one (used for dedup + audit).
                reason:
                  type: string
                  maxLength: 500
                occurred_at:
                  type: string
                  format: date-time
                halt_fulfillment:
                  type: boolean
                  default: true
                  description: Cancel still-unshipped fulfillments on a full reversal.
            example:
              type: refund
              amount: 129.00
              original_gateway_transaction_id: '80059054038'
              reversal_gateway_transaction_id: '80059061111'
              reason: Patient returned product
      responses:
        '200':
          description: Reversal recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [recorded, already_recorded] }
                      reversal_transaction_id: { type: string, format: uuid }
                      order_id: { type: string, format: uuid }
                      payment_status: { type: integer, description: 'PaymentStatus int (5=refunded, 8=partially_refunded, 4=voided).' }
                      amount: { type: number }
                      fulfillment: { description: 'Void result object, or a status string (skipped / unchanged).' }
              example:
                success: true
                message: Reversal recorded.
                data:
                  status: recorded
                  reversal_transaction_id: 01a07d10-1111-7000-9000-abcabcabcabc
                  order_id: 01a07c63-806e-7010-8b97-41eef2f2392a
                  payment_status: 5
                  amount: 129.00
                  fulfillment: { voided: ['FUL-0001'], failed: [], cancelled: ['FUL-0002'] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Refund exceeds the refundable balance, or a reversal is already in progress.

