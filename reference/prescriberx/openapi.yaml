openapi: 3.0.3
info:
  title: PrescribeRx REST API
  description: |
    REST API for the PrescribeRx telehealth and pharmacy platform.

    ## Required Headers

    Every request to `/api/v1/*` MUST include these headers:

    ```
    Accept: application/json
    Authorization: Bearer {token}       (all endpoints except /auth/login and /auth/password/forgot)
    Content-Type: application/json      (POST/PUT/PATCH requests with a JSON body)
    ```

    **The `Accept: application/json` header is mandatory.** Without it, authentication
    failures historically returned a 302 redirect to the web login page instead of a
    JSON 401 body — masking the real error from integrators. The server now injects
    this header via middleware on every `/api/*` request as a safety net, but clients
    SHOULD still send it explicitly for portability and to match the documented contract.

    If you ever receive an HTML response or a 302 redirect, check that (1) your HTTP
    client is actually sending the `Accept: application/json` header, and (2) the full
    token string from `POST /auth/login` is in the `Authorization` header (including
    the `{id}|` prefix Sanctum emits).

    ## Authentication

    All authenticated endpoints require a Bearer token obtained via `POST /auth/login`.

    ```
    Authorization: Bearer {token}
    ```

    Tokens are scoped with abilities based on user type. The ability list
    below mirrors `App\Enums\Api\TokenAbility::forUserType()` exactly — that
    method is the authoritative source. Wildcards are NOT issued (e.g.,
    `encounter:*`); each ability is granted explicitly.

    | User Type           | Value | Abilities |
    |---------------------|-------|-----------|
    | Provider            | 0     | encounter:read, encounter:create, encounter:update, prescription:read, prescription:create, prescription:sign, patient:read, patient:update, provider:read, provider:update, product:read |
    | Patient             | 1     | patient:read, patient:update, patient:vitals, order:read, telehealth:read, telehealth:submit, encounter:read, prescription:read, product:read |
    | Sales Organization  | 2     | sales-org:read, sales-org:update, client:read, client:create, order:read, order:create, order:update, product:read, patient:read, patient:create, patient:update, prescription:read, telehealth:read, telehealth:submit, encounter:read, encounter:create, encounter:update, webhook:read, webhook:create, webhook:update, webhook:delete |
    | API                 | 3     | `*` (all abilities) |
    | System Admin        | 4     | `*` (all abilities) |
    | Client              | 6     | client:read, client:update, order:create, order:read, order:update, prescription:read, patient:read, patient:create, patient:update, product:read, telehealth:read, telehealth:submit, encounter:read, encounter:create, encounter:update, webhook:read, webhook:create, webhook:update, webhook:delete |
    | Super Admin         | 8     | `*` (all abilities) |
    | Client Provider     | 9     | client:read, client:update, order:create, order:read, order:update, prescription:read, prescription:create, prescription:sign, encounter:create, encounter:read, encounter:update, patient:read, patient:create, patient:update, product:read, provider:read, provider:update, telehealth:read, telehealth:submit, webhook:read, webhook:create, webhook:update, webhook:delete |
    | Client Administrator| 10    | Identical ability list to Client (tenant-scoped at policy layer) |

    Ambassador (5), Affiliate (7), and Telehealth Admin (11) currently
    receive no API abilities — `forUserType()` returns `[]` for them.

    **Token type guard on payment.mode=authorize:** sales-org / client tokens
    cannot use `payment.mode=authorize` on the unified intake endpoint —
    PRX is not the merchant of record for API-driven flows. Use
    `reference_captured` (record-only) or `patient_review` (deferred portal
    pay) instead. Embed-form tokens (browser-served) DO support `authorize`
    because PRX is the merchant on the embed flow.

    ## Response Format

    All responses follow a standard envelope:

    ```json
    {
      "success": true,
      "data": { ... },
      "message": "Optional message",
      "meta": {
        "request_id": "uuid",
        "timestamp": "2026-04-03T12:00:00+00:00"
      }
    }
    ```

    Paginated responses include `meta.pagination`:

    ```json
    {
      "meta": {
        "pagination": {
          "current_page": 1,
          "last_page": 5,
          "per_page": 25,
          "total": 112,
          "from": 1,
          "to": 25
        }
      }
    }
    ```

    ## Rate Limiting

    | Scope | Limit |
    |-------|-------|
    | General | 60 requests/minute per user |
    | Auth endpoints | 10 requests/minute per IP |
    | Order creation | 30 requests/minute per user |

    Rate limit headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `Retry-After` (on 429).

    ## HTTP Status Codes

    | Code | Meaning |
    |------|---------|
    | 200 | Success |
    | 201 | Created |
    | 400 | Business rule error |
    | 401 | Unauthenticated |
    | 402 | Payment failed |
    | 403 | Forbidden |
    | 404 | Not found |
    | 422 | Validation error |
    | 429 | Rate limited |
    | 500 | Server error |

  version: 1.0.0
  contact:
    name: PrescribeRx API Support
    email: api@prescribe-rx.com
  license:
    name: Proprietary

servers:
  - url: https://demo.prescribe-rx.com/api/v1
    description: Demo / Sandbox (safe for testing)
  - url: https://prescribe-rx.com/api/v1
    description: Production

tags:
  - name: Auth
    description: Authentication, token management, and password reset
  - name: Clients
    description: Client provisioning, custom pricing, orders, and the order-mirror endpoint
  - name: Products
    description: Product catalog (public + authenticated pricing)
  - name: Packages
    description: Product packages
  - name: Telehealth
    description: Encounter types, schemas, and intake submission
  - name: Encounters
    description: Encounter lifecycle management
  - name: Orders
    description: Order creation, tracking, and fulfillment
  - name: Pricing
    description: Coupon validation, cart preview, and shipping rates
  - name: Patients
    description: Patient chart management and sub-resources
  - name: PaymentMethods
    description: Card vaulting and payment method management
  - name: Payments
    description: Merchant-account discovery (redacted) for subscription billing
  - name: Transactions
    description: External transaction recording
  - name: Subscriptions
    description: Patient subscription management
  - name: LabOrders
    description: Lab order creation and tracking (tenant-scoped index + show)
  - name: LabCatalog
    description: |
      Lab reference data — panels (named test bundles), tests (orderable
      lab units, often Rupa-synced), biomarkers (canonical SystemBiomarker
      concepts that lab tests map to for analytics + flagging), and
      encounter-type lab requirements.
  - name: Scheduling
    description: Provider availability and appointment booking
  - name: Terminology
    description: Medical terminology typeahead search
  - name: Webhooks
    description: Webhook subscription management
  - name: ExternalTelehealth
    description: |
      Surface for 3rd-party telehealth companies that prescribe in their
      own e-Rx system and route fulfillment through PrescribeRx. Three
      endpoints: register providers by NPI, look them up after admin
      approval, and submit fully-formed orders with the signed PDF
      attached. Sales-org tokens (multi-clinic integrators) AND client
      tokens (single-clinic direct integrators) are both supported —
      the effective sales-org id resolves from `user.sales_organization_id`
      or `user.client.sales_organization_id`. The three abilities
      (`external-telehealth:providers:write`/`:read`/`orders:write`) are
      NOT in any default ability set — granted manually per integrator.
      Reference guide: `/api/docs/external-telehealth-guide`.
  - name: Me
    description: Current user profile, password, and settings
  - name: PatientPortal
    description: Patient self-service portal — chart, vitals, allergies, medications, conditions, encounters, orders, dashboard
  - name: PatientVitals
    description: Provider-facing CRUD over patient vital readings + analytics
  - name: Prescriptions
    description: Prescription read, cancel, and status updates
  - name: Chat
    description: |
      Public chat-agent endpoints for the drop-in JS widget on
      sales-org websites. Origin-gated + per-origin rate-limited; no
      Sanctum bearer required. The chat agent recommends 1–3
      products from a sales-org's curated catalog via Bedrock
      (Claude Sonnet 4.6).

      **Important:** these endpoints DO NOT use the standard
      `success/data/meta` envelope. They return domain-shaped JSON
      directly because the public contract is the JS widget — adding
      ~80 bytes per turn for an envelope wasn't worth the
      consistency win. Treat the response shapes as the authoritative
      contract.

      Drop-in widget reference + SDK guide: `/api/docs/chat-widget-guide`.
  - name: Providers
    description: Provider profile, availability, licenses, signature, and weekly schedule / overrides
  - name: SalesOrganizations
    description: Sales-organization CRUD, hierarchy (children), and their clients / orders
  - name: BulkOrders
    description: |
      Asynchronous bulk-order intake for external e-Rx systems — stage a
      fully-formed prescription + order, poll for status, then view/download
      the prescription. Distinct from `POST /orders/bulk` (a synchronous
      checkout). These endpoints do NOT use the standard `success/data/meta`
      envelope; the shapes are documented literally per endpoint.
  - name: Peptides
    description: |
      Read-only Peptide / Ingredient Knowledge Base — a global catalog of
      active compounds with narrative sections (overview, pharmacology,
      clinical evidence, dosing guidelines, safety profile, patient summary),
      approved dosing guidance, and clinical references.

      **Audience shaping** — the `audience` query param (`patient` | `clinician`,
      default `patient`) shapes the detail returned. `patient` returns the
      overview + patient summary; `clinician` adds the dense clinical sections
      (pharmacology, clinical evidence, dosing guidelines, safety profile,
      mechanism, evidence score). Dosing guidance is returned to both.

      **Clinical-safety gating** — approved drug-interactions and preclusions are
      returned ONLY when `audience=clinician` AND the token holds the
      `peptide:clinical:read` ability. A read-only token, or a patient-audience
      request, receives those fields as `null` (gated, not empty).

      **PRX prerequisites** — the `peptide:read` ability (and, for the safety
      data, `peptide:clinical:read`) is granted MANUALLY per integrator on the
      API token; neither is in any default ability set. Only `review_status`
      = `approved` supporting data is ever exposed. No PHI; global (no tenant scope).

# ============================================================================
# PATHS
# ============================================================================
paths:

  # --------------------------------------------------------------------------
  # Peptides — Ingredient Knowledge Base (peptide:read)
  # --------------------------------------------------------------------------
  /peptides:
    get:
      tags: [Peptides]
      summary: List peptides
      description: |
        Searchable, paginated catalog of active compounds. `search` matches
        generic name / class (partial) and exact synonym / brand name.

        Requires the `peptide:read` token ability (manual grant).
      operationId: listPeptides
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          example: semaglutide
        - name: per_page
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl "https://demo.prescribe-rx.com/api/v1/peptides?search=semaglutide" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $res = Http::withToken($token)->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/peptides', ['search' => 'semaglutide']);
            $items = $res->json('data');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch('https://demo.prescribe-rx.com/api/v1/peptides?search=semaglutide', {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const { data } = await res.json();
        - lang: Python
          label: Python (requests)
          source: |
            import requests
            res = requests.get(
                'https://demo.prescribe-rx.com/api/v1/peptides',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
                params={'search': 'semaglutide'},
            )
            items = res.json()['data']
      responses:
        '200':
          description: A page of peptides
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PeptideListItem' }
                  meta: { type: object }
              example:
                success: true
                data:
                  - generic_name: semaglutide
                    compound_class: GLP-1 receptor agonist
                    brand_names: [Ozempic, Wegovy]
                    synonyms: [semaglutide]
                    evidence_tier: A
                    summary: Semaglutide is a GLP-1 receptor agonist used for type 2 diabetes and weight management…
                    updated_at: '2026-09-11T05:12:32+00:00'
                meta: { current_page: 1, per_page: 25, total: 106 }
        '401':
          description: Unauthenticated
        '403':
          description: Token missing the peptide:read ability

  /peptides/{peptide}:
    get:
      tags: [Peptides]
      summary: Get a peptide
      description: |
        One compound by generic name (case-insensitive; falls back to an exact
        synonym / brand-name match).

        `audience=clinician` returns the full clinical sections; `audience=patient`
        (default) returns the patient-facing subset. Approved `drug_interactions`
        and `preclusions` are included ONLY when `audience=clinician` AND the token
        holds `peptide:clinical:read` — otherwise they are `null`.

        Requires the `peptide:read` token ability (manual grant).
      operationId: getPeptide
      security:
        - bearerAuth: []
      parameters:
        - name: peptide
          in: path
          required: true
          description: Generic name (URL-encoded), or an exact synonym / brand name.
          schema: { type: string }
          example: semaglutide
        - name: audience
          in: query
          required: false
          schema: { type: string, enum: [patient, clinician], default: patient }
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl "https://demo.prescribe-rx.com/api/v1/peptides/semaglutide?audience=clinician" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $res = Http::withToken($token)->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/peptides/semaglutide', ['audience' => 'clinician']);
            $peptide = $res->json('data');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch('https://demo.prescribe-rx.com/api/v1/peptides/semaglutide?audience=clinician', {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            const { data } = await res.json();
        - lang: Python
          label: Python (requests)
          source: |
            import requests
            res = requests.get(
                'https://demo.prescribe-rx.com/api/v1/peptides/semaglutide',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
                params={'audience': 'clinician'},
            )
            peptide = res.json()['data']
      responses:
        '200':
          description: The peptide
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Peptide' }
                  meta: { type: object }
        '401':
          description: Unauthenticated
        '403':
          description: Token missing the peptide:read ability
        '404':
          description: Peptide not found

  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticate and receive a bearer token with scoped abilities.
      operationId: login
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X POST "https://demo.prescribe-rx.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -d '{
                "email": "you@example.com",
                "password": "your-password",
                "device_name": "api-integration"
              }'
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $response = Http::acceptJson()
                ->post('https://demo.prescribe-rx.com/api/v1/auth/login', [
                    'email' => 'you@example.com',
                    'password' => 'your-password',
                    'device_name' => 'api-integration',
                ]);

            $token = $response->json('data.token');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch('https://demo.prescribe-rx.com/api/v1/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
              body: JSON.stringify({
                email: 'you@example.com',
                password: 'your-password',
                device_name: 'api-integration',
              }),
            });
            const { data } = await res.json();
            const token = data.token;
        - lang: Python
          label: Python (requests)
          source: |
            import requests

            res = requests.post(
                'https://demo.prescribe-rx.com/api/v1/auth/login',
                headers={'Accept': 'application/json'},
                json={
                    'email': 'you@example.com',
                    'password': 'your-password',
                    'device_name': 'api-integration',
                },
            )
            token = res.json()['data']['token']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: api@demo-client.com
              password: your-password
              device_name: api-integration
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                data:
                  user:
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    email: api@demo-client.com
                    name: API User
                    first_name: API
                    last_name: User
                    user_type: 6
                    user_type_label: Client
                    client_id: "019c94dd-8292-7112-9e5b-c458125e8d33"
                    sales_organization_id: "019c94db-ec31-732b-9fe7-fb97190e7e87"
                    patient_chart_id: null
                    provider_profile_id: null
                  token: "1|abc123def456..."
                  abilities:
                    - "client:read"
                    - "order:create"
                    - "product:read"
                  expires_at: "2026-04-04T12:00:00+00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      description: Exchange current token for a new one. Old token is revoked.
      operationId: refreshToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_name]
              properties:
                device_name:
                  type: string
                  example: api-integration
      responses:
        '200':
          description: New token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revoke current access token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Logged out successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: Get authenticated user profile and current token abilities.
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      description: Send password reset email.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password
      description: Reset password with token from email.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --------------------------------------------------------------------------
  # Products
  # --------------------------------------------------------------------------
  /products:
    get:
      tags: [Products]
      summary: List products
      description: |
        List active products. **Public** (no auth required).
        If authenticated, pricing adjusts to client-specific rates (wholesale or custom).
      operationId: listProducts
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "https://demo.prescribe-rx.com/api/v1/products?per_page=10&sort=name" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $products = Http::withToken($token)
                ->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/products', [
                    'per_page' => 10,
                    'sort' => 'name',
                ])
                ->json('data');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch(
              'https://demo.prescribe-rx.com/api/v1/products?per_page=10&sort=name',
              { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } },
            );
            const { data } = await res.json();
        - lang: Python
          label: Python (requests)
          source: |
            import requests

            res = requests.get(
                'https://demo.prescribe-rx.com/api/v1/products',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
                params={'per_page': 10, 'sort': 'name'},
            )
            products = res.json()['data']
      parameters:
        - name: filter[product_class_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[product_type_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[name]
          in: query
          schema:
            type: string
          description: Partial match
        - name: filter[sku]
          in: query
          schema:
            type: string
          description: Partial match
        - name: filter[rx_required]
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
          description: Full-text search across name, sku, description
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, retail_price, -retail_price]
        - name: include
          in: query
          schema:
            type: string
          description: "Comma-separated: productClass, productType, packages, doses"
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  - id: "019bde3e-e71a-7225-98fe-8f28b4cbcd77"
                    sku: "5AMINO-10MG"
                    name: "5 AMINO 1MQ - 10 mg"
                    description: "5 AMINO 1MQ capsules, 10mg strength"
                    rx_required: true
                    is_active: true
                    image_url: null
                    pricing:
                      retail_price: 10.00
                      price: 10.00
                      price_type: retail
                meta:
                  request_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  timestamp: "2026-04-03T12:00:00+00:00"
                  pagination:
                    current_page: 1
                    last_page: 5
                    per_page: 10
                    total: 48

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product detail
      description: Get a single product with optional includes. **Public.**
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
