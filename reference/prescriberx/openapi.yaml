  # --------------------------------------------------------------------------
  # Provider-added item review (PATIENT_REVIEW workflow)
  # --------------------------------------------------------------------------
  /me/patient/approvals:
    get:
      tags: [PatientPortal]
      summary: List provider-added items awaiting my review
      description: |
        Items the PROVIDER ADDED after intake on a `patient_review` order that are
        still awaiting the patient's decision. Fixed (checkout-purchased) items are
        always captured and never appear here. Self-scoped to the token's chart.

        The server owns the price; echo `total_price` back as `acknowledged_total`
        when accepting. `approval_id` is the value used in the accept/decline paths.
      responses:
        '200':
          description: Pending provider-added items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PendingApproval' }
              example:
                success: true
                data:
                  - approval_id: 01a07c99-1111-7000-9000-abc123abc123
                    order_id: 01a07c63-806e-7010-8b97-41eef2f2392a
                    order_number: ORD-0064996579
                    product_id: 019b9783-6a7e-73fc-92d6-2970937796db
                    product_name: Sermorelin
                    quantity: 1
                    unit_price: 125.00
                    total_price: 125.00
                    currency: USD
                    review_expires_at: '2026-09-09T17:00:00+00:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/patient/approvals/{approval}/accept:
    post:
      tags: [PatientPortal]
      summary: Accept (approve + pay for) a provider-added item
      description: |
        Approves the item and charges it as a **separate, consented** sale against
        the patient's vaulted card — never collected from the base authorization,
        never auto-charged. Requires the `patient:approve-charge` ability.

        Send `acknowledged_total` equal to the item's `total_price`; a mismatch
        returns `409` with the current server price so a stale page cannot silently
        pay a changed amount. The item is marked approved (and becomes shippable)
        **only on a successful charge** — no chargeable card returns `402` and the
        item stays pending. Fires the `approval.accepted` webhook on success.

        **PRX charges — the caller never does.** The delta is a single consented sale
        PRX runs on the shared merchant against the patient's vaulted profile; an
        external portal must NOT charge locally (that would double-charge). Charging
        and ship-eligibility are one atomic decision inside PRX (APPROVED only on a
        successful charge).

        **This endpoint is NON-idempotent from the client's perspective — `402`,
        `409`, and `502` are all TERMINAL, do not blindly retry.** `502` (UNCERTAIN)
        means the money moved but bookkeeping failed; a naive retry-on-5xx would
        re-charge (the gateway idempotency key only truly dedups Stripe/Square). Send
        an **`Idempotency-Key`** header and PRX will replay the prior money-outcome
        response (`X-Idempotent-Replayed: true`) instead of charging again; a
        genuinely new attempt must use a new key.
      parameters:
        - name: approval
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The `approval_id` (order-product id) from `GET /me/patient/approvals`.
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Recommended. Replays the prior money-outcome response instead of re-charging on retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acknowledged_total]
              properties:
                acknowledged_total:
                  type: number
                  minimum: 0
                  description: Must equal the server's current `total_price` for the item.
            example: { acknowledged_total: 125.00 }
      responses:
        '200':
          description: Charged + approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecisionResult' }
              example:
                success: true
                message: "$125 charged. This item will be shipped."
                data:
                  approval_id: 01a07c99-1111-7000-9000-abc123abc123
                  outcome: charged
                  amount: 125.00
                  transaction_id: '80059054099'
                  message: "$125 charged. This item will be shipped."
        '402':
          description: No chargeable card on file, or the card was declined (item stays pending).
        '409':
          description: Price changed (`price_mismatch`) or already reviewed (`already_resolved`).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/patient/approvals/{approval}/decline:
    post:
      tags: [PatientPortal]
      summary: Decline a provider-added item
      description: |
        Declines the item — no charge, and it is **excluded from fulfillment**
        (decline propagation: a declined item never dispenses). Requires
        `patient:update`. Fires the `approval.declined` webhook. Idempotent.
      parameters:
        - name: approval
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDecisionResult' }
              example:
                success: true
                message: 'Item declined. It will not be shipped or charged.'
                data:
                  approval_id: 01a07c99-1111-7000-9000-abc123abc123
                  outcome: declined
                  amount: 0
                  transaction_id: null
                  message: 'Item declined. It will not be shipped or charged.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/patient/payment-methods:
    get:
      tags: [PatientPortal]
      summary: My vaulted payment methods (read-only)
      description: |
        The patient's vaulted cards, so a portal can show which card an accepted
        add-on's charge would hit. Read-only; self-scoped to the token's chart.
      responses:
        '200':
          description: Vaulted payment methods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/VaultedPaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/patient/conversations:
    get:
      tags: [PatientPortal]
      summary: My conversations
      description: |
        The authenticated patient's conversations (those they participate in),
        newest-activity first, with unread counts, participants, and the last
        message.
      operationId: listMyConversations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 25 } }
      responses:
        '200': { description: Conversations, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }

  /me/patient/conversations/{conversation}/messages:
    get:
      tags: [PatientPortal]
      summary: Conversation messages
      description: >
        Messages in one of the patient's conversations. 404 if not a participant.
        Two modes:
        (1) Default (no `after`) — newest-first, paginated by `per_page`.
        (2) Incremental poll (`after` supplied) — returns messages NEWER than the
        cursor, OLDEST-first, un-paginated (capped at `per_page`), with a
        `data.latest_cursor` (the last message id) and `data.has_more`. Feed
        `latest_cursor` back as `after` on the next poll (a stable keyset cursor —
        prefer this over a timestamp, which is only second-granular). Real-time
        push is unavailable to bearer-token clients, so poll this instead.
      operationId: listMyConversationMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: per_page, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - name: after
          in: query
          required: false
          description: Incremental-poll cursor — a message id (preferred, from a prior `latest_cursor`) or an ISO-8601 timestamp. Invalid value → 422.
          schema: { type: string }
      responses:
        '200': { description: Messages, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [PatientPortal]
      summary: Send a message
      description: Send a message in one of the patient's conversations. 404 if not a participant.
      operationId: sendMyConversationMessage
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 5000 }
                reply_to_message_id: { type: string, format: uuid }
            example: { content: "Thanks, I have a question about my dose." }
      responses:
        '201': { description: Message sent, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /me/patient/encounters/{encounter}/conversation:
    post:
      tags: [PatientPortal]
      summary: Open the encounter conversation
      description: |
        Find or create the conversation with the provider on one of the patient's
        encounters, returning its id so the portal can start a thread without a
        pre-existing conversation. Idempotent. 404 if the encounter isn't the
        patient's.
      operationId: openMyEncounterConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: encounter, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Conversation ready, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

