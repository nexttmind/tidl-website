  # --------------------------------------------------------------------------
  # Payment Methods
  # --------------------------------------------------------------------------
  /payment-methods/{patientChartId}:
    get:
      tags: [PaymentMethods]
      summary: List vaulted cards
      description: List vaulted payment methods for a patient.
      operationId: listPaymentMethods
      security:
        - bearerAuth: []
      parameters:
        - name: patientChartId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "019d5561-7b24-7096-baa7-85485643b0a7"
      responses:
        '200':
          description: Vaulted cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
              example:
                success: true
                data:
                  - id: "d4e5f6a7-b8c9-0123-def0-456789012345"
                    card_brand: Visa
                    last_four: "4242"
                    expiration_month: 12
                    expiration_year: 2027
                    is_default: true
                    gateway_provider: authorize_net
                    created_at: "2026-03-15T10:00:00+00:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /payment-methods:
    post:
      tags: [PaymentMethods]
      summary: Vault a new payment method
      description: |
        Vault a card using Accept.js opaque data (new card) or link an existing CIM profile.

        **Mode 1 -- New card:** Pass `opaque_data` from Accept.js tokenization.
        **Mode 2 -- Link existing CIM:** Pass `gateway_customer_profile_id` + `gateway_payment_profile_id`.
      operationId: createPaymentMethod
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentMethodRequest'
            example:
              patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
              opaque_data:
                data_descriptor: "COMMON.ACCEPT.INAPP.PAYMENT"
                data_value: "eyJjb2RlIjoiNTBfMl8wNjAwMDUyN0..."
              card_brand: Visa
              last_four: "4242"
              expiration_month: 12
              expiration_year: 2027
              billing_address:
                first_name: Jane
                last_name: Smith
                street: "456 Oak Ave"
                city: Marietta
                state: GA
                zip: "30060"
              set_as_default: true
      responses:
        '201':
          description: Payment method created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      card_brand:
                        type: string
                      last_four:
                        type: string
                      expiration_month:
                        type: integer
                      expiration_year:
                        type: integer
                      gateway_customer_id:
                        type: string
                      gateway_payment_profile_id:
                        type: string
                      merchant_account_id:
                        type: string
                        format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /payment-methods/{id}:
    delete:
      tags: [PaymentMethods]
      summary: Delete payment method
      description: Soft-delete a vaulted card.
      operationId: deletePaymentMethod
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Payment method deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # Transactions
  # --------------------------------------------------------------------------
  /transactions/external:
    post:
      tags: [Transactions]
      summary: Record external transaction
      description: |
        Record a payment captured externally (e.g., on a partner site).
        If `order_id` or `encounter_id` is provided, the associated order's payment_status is updated to CAPTURED.
      operationId: createExternalTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalTransactionRequest'
            example:
              encounter_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
              amount: 157.00
              currency: USD
              type: sale
              gateway_provider: authorize_net
              gateway_transaction_id: txn_abc123def456
              authorization_code: AUTH789
              billed_on_domain: www.partner-clinic.com
              external_reference: INV-2026-0042
              customer_profile_id: "500000001"
              payment_profile_id: "500000002"
      responses:
        '201':
          description: Transaction recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                      amount:
                        type: number
                      is_external:
                        type: boolean
                      billed_on_domain:
                        type: string
                      has_merchant_account:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --------------------------------------------------------------------------
  # Subscriptions
  # --------------------------------------------------------------------------
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List subscriptions
      operationId: listSubscriptions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: integer
          description: "SubscriptionStatus: 1=Active, 2=Paused, 3=Cancelled, 4=Expired, 5=Pending Renewal"
        - name: patient_chart_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Subscriptions]
      summary: Create subscription
      description: >
        Enroll a subscription. Send the optional `Idempotency-Key` header (#5 B-7): a replay of the
        same key from the same tenant within 24h returns the original 201 verbatim (headers
        `X-Idempotent-Replayed: true` + `X-Idempotent-Original-At`) instead of creating a duplicate.
        For a remotely-originated sub, provide `initial_transaction` to anchor the billing schedule
        and `payment` to vault the card; set `billing_owner`/`renewal_mode` to control who rebills.
      operationId: createSubscription
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Idempotent-create key; 24h replay window, tenant-scoped (#5 B-7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
            examples:
              simple:
                summary: Minimal PRX-billed enrollment
                value:
                  patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
                  product_identifier: "5AMINO-10MG"
                  billing_term: 1
                  base_price: 10.00
                  quantity: 1
                  subtotal: 10.00
                  grand_total: 10.00
              remote_prx_rebill:
                summary: Remotely-originated sub, PRX rebills the org's merchant
                value:
                  patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
                  package_plan_id: "019d7a01-2b8c-71aa-9f42-0c1e6b4d8e10"
                  billing_term: 1
                  base_price: 199.00
                  quantity: 1
                  subtotal: 199.00
                  grand_total: 199.00
                  renewal_mode: auto
                  initial_transaction:
                    gateway_transaction_id: "ch_3PabcXYZ"
                    amount: 199.00
                    transacted_at: "2026-08-01T14:30:00Z"
                  payment:
                    gateway: stripe
                    merchant_owner: sales_org
                    merchant_external_code: "ORG-MAIN-STRIPE"
                    vault:
                      payment_method_id: "pm_1PabcABC"
                      customer_id: "cus_PabcDEF"
              external_billed:
                summary: 3rd party owns billing (external), card vaulted for on-demand use
                value:
                  patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
                  package_plan_id: "019d7a01-2b8c-71aa-9f42-0c1e6b4d8e10"
                  billing_term: 1
                  base_price: 199.00
                  quantity: 1
                  subtotal: 199.00
                  grand_total: 199.00
                  billing_owner: external
                  external_billing_domain: "partner.example.com"
                  term_prepaid: false
                  payment:
                    gateway: nmi
                    merchant_owner: sales_org
                    vault:
                      customer_vault_id: "1234567890"
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing subscription-payment-manage, or no access to the patient chart.
        '422':
          $ref: '#/components/responses/ValidationError'

  /subscriptions/{id}:
    get:
      tags: [Subscriptions]
      summary: Get a subscription
      description: >
        One patient subscription with its related chart, product type, package /
        plan, merchant account, and orders. 403 if the caller cannot access it or
        lacks the `subscription-view` permission.
      operationId: getSubscription
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Subscription
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Subscriptions]
      summary: Update subscription
      operationId: updateSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method_id:
                  type: string
                  format: uuid
                billing_term:
                  type: integer
                  enum: [1, 3, 6, 12]
                should_bill:
                  type: boolean
            example:
              billing_term: 3
              should_bill: true
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /subscriptions/{id}/pause:
    post:
      tags: [Subscriptions]
      summary: Pause subscription
      operationId: pauseSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Subscription paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/{id}/swap-product:
    post:
      tags: [Subscriptions]
      summary: Request a product swap (provider-review gated)
      description: |
        Request changing the product type on a live subscription (#20). The swap
        is NOT applied immediately — it records the pending target and spawns a
        provider-review encounter; the subscription only moves to the new product
        (next cycle) once that encounter is prescribed. Returns 202.
      operationId: requestSubscriptionProductSwap
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_type_id]
              properties:
                product_type_id: { type: string, format: uuid }
            example: { product_type_id: "019b9783-6a7e-73fc-92d6-2970937796db" }
      responses:
        '202':
          description: Swap requested (pending provider review)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subscription_id: { type: string }
                      current_product_type_id: { type: string }
                      pending_swap_product_type_id: { type: string }
                      review_encounter_id: { type: string }
                      status: { type: string, example: pending_provider_review }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subscriptions/{id}/cancel:
    post:
      tags: [Subscriptions]
      summary: Cancel subscription
      operationId: cancelSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/{id}/resume:
    post:
      tags: [Subscriptions]
      summary: Resume paused subscription
      operationId: resumeSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Subscription resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/{id}/refill-request:
    post:
      tags: [Subscriptions]
      summary: Request a refill
      description: >-
        Request a refill on a subscription. The prescription is already on file,
        so no new encounter/consult is created — the refill lane handles drawing
        and shipping the refill.
      operationId: requestSubscriptionRefill
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 1000
                  description: Optional note from the requester.
      responses:
        '200':
          description: Refill requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Refills can only be requested on an active subscription.

  /subscriptions/{id}/payment-method:
    patch:
      tags: [Subscriptions]
      summary: Update the card on file for future rebills
      description: >-
        Re-point the subscription at a different vaulted payment method belonging
        to the patient. Only valid when a system or sales-org merchant collects;
        externally-billed subscriptions return 422.
      operationId: updateSubscriptionPaymentMethod
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_id]
              properties:
                payment_method_id:
                  type: string
                  format: uuid
                  description: A vaulted payment method owned by the patient.
      responses:
        '200':
          description: Payment method updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Method not on file for the patient, or subscription billed externally.

  /subscriptions/{id}/refund:
    post:
      tags: [Subscriptions]
      summary: Refund a subscription charge (pre-fulfillment only)
      description: >-
        Refund a charge tied to the subscription, full or partial. Permitted only
        before the linked order ships — once shipped/in-transit/delivered the
        request returns 422.
      operationId: refundSubscriptionCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id:
                  type: string
                  format: uuid
                  description: The transaction (tied to this subscription) to refund.
                amount:
                  type: number
                  minimum: 0.01
                  description: Partial amount; omit to refund the full remaining amount.
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Order already shipped, transaction missing a gateway reference, or already fully refunded.

  /subscriptions/{id}/discount:
    post:
      tags: [Subscriptions]
      summary: Apply a discount to forward billing
      description: >-
        Apply a flat-amount or percentage discount. recurring=true reduces every
        future rebill; recurring=false applies once to the next charge. Provide
        exactly one of amount or percent.
      operationId: applySubscriptionDiscount
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 0.01
                  description: A flat dollar discount (mutually exclusive with percent).
                percent:
                  type: number
                  minimum: 0.01
                  maximum: 100
                  description: A percentage discount of the subtotal (mutually exclusive with amount).
                recurring:
                  type: boolean
                  default: false
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Discount applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Provide exactly one of amount or percent.

  /subscriptions/{id}/reassessment:
    post:
      tags: [Subscriptions]
      summary: Get (or open) the reassessment consult for a subscription
      description: >-
        #13.9 — returns the follow-up reassessment encounter/intake an integrator tracks when the
        next refill is gated on a reassessment. Idempotent: if a reassessment is due and none is
        open it creates one; a no-op for externally-managed subscriptions (the 3rd party owns
        follow-ups). Requires permission `subscription-refill-manage`.
      operationId: subscriptionReassessment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: The reassessment consult (existing, newly created, or null when none is due).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No access to the subscription, or missing subscription-refill-manage.
        '404':
          description: Subscription not found.

  /subscriptions/{id}/external-refill:
    post:
      tags: [Subscriptions]
      summary: External "paid & ready" refill (externally-billed subs)
      description: >-
        For an externally-billed subscription: the sales org asserts the patient was already
        charged on its own system and this ships the next refill. Bypasses the suppression gate;
        PRX ships and INVOICES the org for wholesale + COGS — the patient is never charged. Only
        the sales organization that bills this sub (or an admin) may call it. Accepts an
        Idempotency-Key header (or idempotency_key body field) so a retry does not ship twice.
      operationId: subscriptionExternalRefill
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paid]
              properties:
                paid:
                  type: boolean
                  description: The org asserts the 3rd party billed the patient; true = ship.
                external_payment_reference:
                  type: string
                  maxLength: 255
                note:
                  type: string
                  maxLength: 1000
                idempotency_key:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Refill accepted / shipped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only the billing sales org (or an admin) may initiate an external refill.
        '422':
          description: Subscription is not eligible for an external refill.

  /subscriptions/{id}/charge:
    post:
      tags: [Subscriptions]
      summary: Staff one-off (ad-hoc) charge on the vaulted card
      description: >-
        G8 — charge the subscription's sticky vaulted card on demand (NOT a rebill: no
        order/shipment, just a recorded sale). The point of vaulting a 3rd-party-tokenized card:
        an externally-billed sub never auto-charges, but staff can charge the stored card when
        needed. Requires permission `subscription-billing-manage` (patients do NOT hold it).
      operationId: subscriptionCharge
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                reason:
                  type: string
                  maxLength: 1000
                idempotency_key:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Charge recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing subscription-billing-manage.
        '422':
          description: Charge failed at the gateway.

  /subscriptions/{id}/billing-mode:
    post:
      tags: [Subscriptions]
      summary: Toggle a subscription between external and platform billing
      description: >-
        D3 — flip the hands-off engine gate. external=true → the sub is billed by a 3rd party and
        is never auto-charged/shipped; external=false → PRX resumes engine processing. Only an
        admin or the sales organization that owns the subscription may change how it is billed.
      operationId: subscriptionBillingMode
      security:
        - bearerAuth: []
      parameters:
