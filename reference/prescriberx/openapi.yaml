  # NOTE: /patients/{patientId}/lab-results paths removed in Phase 2 spec
  # rebuild (2026-05-01) — the routes never shipped. Lab results are
  # surfaced via the /telehealth/lab-orders endpoints + the webhook
  # `lab.results.received` event. The LabResult schema and
