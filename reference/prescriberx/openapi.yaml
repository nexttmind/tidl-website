        '201':
          description: |
            Encounter created successfully. On replay (Idempotency-Key
            matched a prior call within 24h) the response BODY is
            identical to the original, with the extra headers
            `X-Idempotent-Replayed: true` and
            `X-Idempotent-Original-At: <ISO8601>` set.
          headers:
            X-Idempotent-Replayed:
              schema:
                type: string
                enum: ['true']
              description: |
                Present only when the response was served from the
                Idempotency-Key cache. Absent on first-time creates.
            X-Idempotent-Original-At:
              schema:
                type: string
                format: date-time
              description: |
                ISO8601 timestamp of the FIRST call that created the
                cached response. Present alongside `X-Idempotent-Replayed`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      encounter_id:
                        type: string
                        format: uuid
                      encounter_number:
                        type: string
                      patient_chart_id:
                        type: string
                        format: uuid
                      patient_number:
                        type: string
                      user_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                      status_label:
                        type: string
                      encounter_type:
                        type: string
                      encounter_type_details:
                        type: object
                        description: The encounter type's product model + modality.
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          is_quick_consult: { type: boolean }
                          interaction_type: { type: integer, nullable: true }
                          interaction_type_label: { type: string, nullable: true }
                      completeness_score:
                        type: integer
                      preclusions:
                        nullable: true
                      workflow:
                        type: object
                        properties:
                          user_created:
                            type: boolean
                          patient_chart_created:
                            type: boolean
                          encounter_created:
                            type: boolean
                          intake_stored:
                            type: boolean
                          products_linked:
                            type: boolean
                          vitals_synced:
                            type: boolean
                          allergies_synced:
                            type: boolean
                          medications_synced:
                            type: boolean
                          conditions_synced:
                            type: boolean
                          consents_recorded:
                            type: integer
                          appointment_booked:
                            type: boolean
                          preclusions_checked:
                            type: boolean
              example:
                success: true
                message: Encounter created successfully.
                data:
                  encounter_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
                  encounter_number: ENC-00042
                  patient_chart_id: "019d5561-7b24-7096-baa7-85485643b0a7"
                  patient_number: PAT-00021
                  status: pending_intake
                  status_label: Pending Patient Intake
                  encounter_type: Weight Management
                  encounter_type_details:
                    id: "019ce396-46a1-73ab-87d6-c40310555401"
                    name: Weight Management
                    is_quick_consult: false
                    interaction_type: 1
                    interaction_type_label: Asynchronous
                  completeness_score: 80
                  workflow:
                    user_created: true
                    patient_chart_created: true
                    encounter_created: true
                    intake_stored: true
                    consents_recorded: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Duplicate-submission conflict (Encounter Intake Safeguards). The
            payload is a resubmission (same patient + type within 20 days) that
            CHANGES an already-populated field. Merge is additive-only, so the
            change is refused. Send the correction to `PATCH /patients/{id}`,
            `PATCH /encounters/{id}`, or `PATCH /encounters/{id}/answers`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: >-
                  This appears to be a duplicate submission that changes
                  existing patient data. Corrections must go through the update
                  endpoints, not a new intake POST.
                errors:
                  phone: ["This resubmission changes the patient phone on file. Use PATCH /api/v1/patients/{id} to correct it."]
        '422':
          description: |
            Validation failed. In addition to standard field validation, the
            intake gate enforces (Encounter Intake Safeguards):
              - `patient.phone` required
              - a shipping address (`patient.shipping_address` or
                `patient.address`) with `street`, `city`, `state`, `zip`
              - a product/package/plan selection UNLESS the encounter type is a
                quick consult (`is_quick_consult: true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              example:
                success: false
                message: Intake is missing required patient information.
                errors:
                  phone: ["The phone field is required."]
                  "shipping_address.state": ["The shipping address state is required."]
                  products: ["Select at least one product, package, or plan. (Only quick-consult encounter types may be submitted without one.)"]

