  # --------------------------------------------------------------------------
  # Scheduling
  # --------------------------------------------------------------------------
  /scheduling/availability/slots:
    get:
      tags: [Scheduling]
      summary: Get available appointment slots
      description: >
        Returns bookable slots grouped by day for a patient + encounter type over
        a date range. This is the availability query to run before booking a time
        onto an encounter (via `POST /encounters/{id}/schedule` or the intake
        `appointment` block). Omit `provider_profile_id` to aggregate slots across
        every eligible provider (licensed for the patient's shipping state and,
        for sales-org tokens, prioritized to that org's assigned providers); pass
        it to scope to one provider. The earliest date is pushed out by any
        pre-consult lab-collection window (`lab_offset_days`).
      operationId: getAvailableSlots
      security:
        - bearerAuth: []
      parameters:
        - name: encounter_type_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: "019ce396-46a1-73ab-87d6-c40310555401"
        - name: patient_chart_id
          in: query
          required: true
          description: Patient chart the slots are being sourced for (drives licensing state + lab offset).
          schema:
            type: string
            format: uuid
          example: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
        - name: start_date
          in: query
          required: false
          description: Range start (>= today). Floored to the earliest lab-valid date.
          schema:
            type: string
            format: date
          example: "2026-08-10"
        - name: end_date
          in: query
          required: false
          description: Range end (>= start_date). Range is capped at 30 days; defaults to start_date + 14 days.
          schema:
            type: string
            format: date
          example: "2026-08-24"
        - name: fastest
          in: query
          required: false
          description: When true, stops at the first day that has any slots (soonest-available lookup).
          schema:
            type: boolean
        - name: provider_profile_id
          in: query
          required: false
          description: Restrict to a single provider's slots.
          schema:
            type: string
            format: uuid
        - name: timezone
          in: query
          required: false
          description: IANA timezone the slot times are rendered in (default America/New_York).
          schema:
            type: string
          example: "America/New_York"
      responses:
        '200':
          description: Available time slots grouped by day.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      date_range:
                        type: object
                        properties:
                          start: { type: string, format: date, example: "2026-08-10" }
                          end:   { type: string, format: date, example: "2026-08-24" }
                      lab_offset_days:
                        type: integer
                        description: Days the earliest bookable date was pushed out by the pre-consult lab window.
                        example: 0
                      has_valid_labs:
                        type: boolean
                        example: true
                      total_slots:
                        type: integer
                        example: 12
                      slots:
                        type: array
                        items:
                          type: object
                          properties:
                            date:    { type: string, format: date, example: "2026-08-10" }
                            display: { type: string, example: "Monday, Aug 10" }
                            slot_count: { type: integer, example: 6 }
                            slots:
                              type: array
                              items:
                                $ref: '#/components/schemas/AvailableSlot'
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scheduling/availability/providers:
    get:
      tags: [Scheduling]
      summary: Get available providers
      description: >
        Lists providers available for a specific date + encounter type, each with
        a slot count and their next-available time. Licensing is driven by
        `patient_state` (explicit) or derived from the patient chart's default
        address; sales-org tokens prioritize that org's assigned providers.
      operationId: getAvailableProviders
      security:
        - bearerAuth: []
      parameters:
        - name: encounter_type_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: "019ce396-46a1-73ab-87d6-c40310555401"
        - name: date
          in: query
          required: true
          description: Day to check availability for (>= today).
          schema:
            type: string
            format: date
          example: "2026-08-10"
        - name: patient_state
          in: query
          required: false
          description: 2-letter US state code for provider licensing. Derived from patient_chart_id when omitted.
          schema:
            type: string
            minLength: 2
            maxLength: 2
          example: "TX"
        - name: patient_chart_id
          in: query
          required: false
          description: Used to derive patient_state when patient_state is not supplied.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        provider_profile_id: { type: string, format: uuid }
                        name: { type: string, example: "Dr. Jane Smith" }
                        npi:  { type: string, example: "1234567890" }
                        slot_count: { type: integer, example: 4 }
                        next_available: { type: string, nullable: true, example: "9:00 AM" }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scheduling/appointments:
    get:
      tags: [Scheduling]
      summary: List appointments
      description: >
        Paginated appointments, tenant-scoped (admin/API see all; a provider sees
        their own; others are scoped to visible charts). Requires
        `scheduling:read`.
      operationId: listAppointments
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[status]', in: query, required: false, schema: { type: integer }, description: "AppointmentStatus." }
        - { name: 'filter[provider_profile_id]', in: query, required: false, schema: { type: string, format: uuid } }
        - { name: 'filter[patient_chart_id]', in: query, required: false, schema: { type: string, format: uuid } }
        - { name: 'filter[encounter_id]', in: query, required: false, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated appointments
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Scheduling]
      summary: Book appointment
      description: >
        Books an appointment for a provider + patient + encounter type.

        **`encounter_id` behavior (important):** when `encounter_id` is supplied,
        the appointment is linked to that encounter. If the token **owns** the
        encounter (same tenant), the time is also mapped ONTO the encounter via
        the canonical scheduling primitive: `scheduled_at` is set, the provider is
        assigned (→ `SCHEDULED`), and the video room is provisioned — a genuine
        scheduled encounter (video room + join link + reminders), equivalent to
        `POST /encounters/{id}/schedule`, and the response message reads
        "Appointment booked and encounter scheduled." If the token does NOT own the
        encounter, the appointment is linked as a reference only and the encounter
        is left untouched (ownership is required because `encounter_id` is validated
        with `exists`, not ownership — this prevents scheduling another tenant's
        encounter). Omit `encounter_id` to book a standalone appointment. Prefer
        `POST /encounters/{id}/schedule` when you already hold the encounter id.
      operationId: createAppointment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_profile_id, patient_chart_id, encounter_type_id, scheduled_start]
              properties:
                provider_profile_id:
                  type: string
                  format: uuid
                patient_chart_id:
                  type: string
                  format: uuid
                encounter_type_id:
                  type: string
                  format: uuid
                scheduled_start:
                  type: string
                  format: date-time
                  description: Must be in the future (UTC).
                encounter_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Optional. Links the appointment to this encounter (reference
                    only). To map a scheduled time ONTO an encounter (set
                    scheduled_at + assign a provider + provision the video room),
                    use POST /encounters/{id}/schedule instead — this general
                    booking route only creates the appointment row + link.
                duration_minutes:
                  type: integer
                  minimum: 5
                  maximum: 120
                  nullable: true
                  description: Defaults to the encounter type's duration estimate (or 15).
                interaction_type:
                  type: integer
                  nullable: true
                  description: Modality code (defaults to 1).
                patient_timezone:
                  type: string
                  maxLength: 64
                  default: America/New_York
                provider_timezone:
                  type: string
                  maxLength: 64
                  default: America/New_York
                notes:
                  type: string
                  maxLength: 1000
                  nullable: true
                client_id:
                  type: string
                  format: uuid
                  nullable: true
                sales_organization_id:
                  type: string
                  format: uuid
                  nullable: true
            example:
              provider_profile_id: "c1d2e3f4-a5b6-7890-cdef-012345678901"
              patient_chart_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
              encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
              scheduled_start: "2026-08-10T14:00:00Z"
              encounter_id: "019d5561-9aa0-71bc-8d90-4ee49ef2ede8"
              patient_timezone: America/New_York
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Appointment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slot conflict / booking rejected (BookAppointmentAction).
        '422':
          $ref: '#/components/responses/ValidationError'

  /scheduling/appointments/{id}:
    get:
      tags: [Scheduling]
