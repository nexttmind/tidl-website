    # ------------------------------------------------------------------------
    # Subscription Schemas
    # ------------------------------------------------------------------------
    Subscription:
      type: object
      description: >
        The enriched subscription resource (#5 B-6). Carries the billing plan, resolved billing
        mode, coupon summary, billing-ownership flags, per-sub renewal_mode / term_prepaid, a
        redacted sticky-merchant summary (NO credentials), and the next pending checkpoint
        forecast. Every money field is a decimal STRING.
      properties:
        id:
          type: string
          format: uuid
        subscription_number:
          type: string
          nullable: true
          example: SUB-00001
        patient_chart_id:
          type: string
          format: uuid
        product_type_id:
          type: string
          format: uuid
          nullable: true
        package_id:
          type: string
          format: uuid
          nullable: true
        package_plan_id:
          type: string
          format: uuid
          nullable: true
          description: The billing plan this subscription enrolled on (#5 B-6).
        billing_mode:
          type: string
          nullable: true
          enum: [prepaid_term, recurring, installment, external]
          description: >
            Resolved commercial billing mode, from the plan (else package). Lowercased enum name,
            not the integer backing value.
        initial_order_id:
          type: string
          format: uuid
          nullable: true
          description: The order that seeded this subscription (rebill line source when present).
        client_id:
          type: string
          format: uuid
          nullable: true
        sales_organization_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: integer
          description: "See SubscriptionStatus enum: 1=Active, 2=Paused, 3=Cancelled, 4=Expired, 5=Pending Renewal"
        status_label:
          type: string
        billing_term:
          type: integer
          nullable: true
          description: "See BillingTerm enum: 1=Monthly, 3=Quarterly, 6=Semi-Annual, 12=Annual"
        billing_term_label:
          type: string
          nullable: true
        base_price:
          type: string
          description: Decimal string
        quantity:
          type: integer
        subtotal:
          type: string
        discount_amount:
          type: string
        shipping_amount:
          type: string
        grand_total:
          type: string
        coupon_code:
          type: string
          nullable: true
          description: Applied coupon code (#5 B-6), or null.
        coupon_is_recurring:
          type: boolean
          description: Whether the coupon discount carries forward to every cycle (vs one-time).
        coupon_discount_amount:
          type: string
          description: Frozen per-cycle coupon discount (decimal string, "0.00" when none).
        renewal_count:
          type: integer
        should_bill:
          type: boolean
          description: Auto-billing enabled
        billing_responsibility:
          type: integer
          description: "Who pays the rebill: 1=patient, 2=client, 3=org, 4=external."
        billing_responsibility_label:
          type: string
        rebill_managed_externally:
          type: boolean
          description: A 3rd party owns recurring billing + follow-up creation.
        auto_process_suppressed:
          type: boolean
          description: The engine schedules but never auto-charges/ships/reassesses this sub.
        external_billing_domain:
          type: string
          nullable: true
          description: The external system that bills this sub (required when billed externally).
        billed_outside_platform:
          type: boolean
          description: Convenience mirror of auto_process_suppressed.
        renewal_mode:
          type: string
          nullable: true
          enum: [prompted, auto, external]
          description: >
            Per-sub renewal driving mode (#5). null = defer to the org scope
            (RebillAutomationMode, default consent-required). 'external' aliases
            billing_owner=external.
        term_prepaid:
          type: boolean
          description: The term was paid up front; PRX never re-collects on in-term refills (#5 B-5).
        merchant_account_id:
          type: string
          format: uuid
          nullable: true
          description: Sticky merchant the vaulted card lives on (#5 B-6). No credentials.
        merchant_external_code:
          type: string
          nullable: true
          description: The merchant's admin-assigned external code.
        merchant_gateway:
          type: string
          nullable: true
          enum: [nmi, authorize_net, stripe, square]
        payment_method_id:
          type: string
          format: uuid
          nullable: true
          description: The sticky vaulted payment method used for rebills.
        next_bill_at:
          type: string
          format: date-time
          nullable: true
        last_billed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        next_checkpoint:
          type: object
          nullable: true
          description: The next PENDING checkpoint forecast, or null.
          properties:
            due_at:
              type: string
              format: date-time
              nullable: true
            type:
              type: string
              description: Checkpoint type (e.g. rebill, reassessment, labs).
        subscription_items:
          type: array
          nullable: true
          description: Line specs (product/qty/price) used to seed rebill orders when no initial order.
          items:
            type: object
        created_at:
          type: string
          format: date-time
          nullable: true

    CreateSubscriptionRequest:
      type: object
      required: [patient_chart_id, billing_term, base_price, quantity, subtotal, grand_total]
      description: >
        Enroll a subscription. Requires permission `subscription-payment-manage`; the caller must
        be able to see the target chart (attribution is derived from the chart's owning
        client/sales-org, never from a caller field). Send an `Idempotency-Key` header to make
        retries safe (see the POST /subscriptions endpoint). The product may be given by
        package_plan_id (preferred — implies its package + product type), product_identifier
        (slug/name/SKU), package_id, or product_type_id.
      properties:
        patient_chart_id:
          type: string
          format: uuid
        package_id:
          type: string
          format: uuid
        package_plan_id:
          type: string
          format: uuid
          description: >
            #5 B-1 — the billing plan. Implies its package + product type and provides the rebill
            line source, so PRX-billed subs created via API can actually be rebilled.
        product_type_id:
          type: string
          format: uuid
        product_identifier:
          type: string
          description: Slug, name, or SKU (resolved automatically)
        billing_term:
          type: integer
          enum: [1, 3, 6, 12]
        payment_method_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
          description: Admin-only override; otherwise derived from the chart.
        sales_organization_id:
          type: string
          format: uuid
          description: Admin-only override; otherwise derived from the chart.
        base_price:
          type: number
        quantity:
          type: integer
          minimum: 1
        subtotal:
          type: number
        grand_total:
          type: number
        discount_amount:
          type: number
          default: 0
        shipping_amount:
          type: number
          default: 0
        coupon_code:
          type: string
        subscription_items:
          type: array
          description: >
            Optional line specs (product/qty/price). Used as the rebill line source when no
            initial order exists (waterfall: initial order → subscription_items → plan lines).
          items:
            type: object
        billing_owner:
          type: string
          enum: [prescribe_rx, external]
          default: prescribe_rx
          description: >
            Who owns the recurring charge + follow-up creation. prescribe_rx (default) = PRX
            rebills the vaulted card on schedule. external = the 3rd party bills on its own
            system; the sub is flagged EXTERNAL + auto-process-suppressed (the engine schedules
            for forecasting but never auto-charges/ships/reassesses). Requires
            external_billing_domain.
        external_billing_domain:
          type: string
          maxLength: 255
          description: Required when billing_owner=external (or renewal_mode=external).
        renewal_mode:
          type: string
          enum: [prompted, auto, external]
          description: >
            #5 — per-sub renewal driving mode, consulted BEFORE the org scope. prompted = patient
            consent required each rebill; auto = rebill automatically; external ALIASES
            billing_owner=external. Omit to defer to the org default.
        term_prepaid:
          type: boolean
          default: false
          description: >
            #5 B-5 — the term was paid up front. PRX suppresses in-term re-collection on refills.
        initial_transaction:
          type: object
          description: >
            #5 B-2 — the integrator's already-run FIRST charge. Anchors the schedule
            (next_bill_at = transacted_at + term instead of now()+term) and is recorded as an
            external audit transaction on the subscription.
          properties:
            gateway_transaction_id:
              type: string
              maxLength: 255
            amount:
              type: number
              minimum: 0
            transacted_at:
              type: string
              format: date-time
        payment:
          type: object
          description: >
            #5 — optional remote vault. Store a card first tokenized on a 3rd-party checkout as a
            rechargeable PaymentMethod, made sticky on the subscription. Vaulting validates
            synchronously (missing merchant / gateway mismatch / missing vault field → 422). The
            vault/token must be valid on whichever account it lands on (tokens are non-portable).
          required: [gateway, vault]
          properties:
            gateway:
              type: string
              enum: [nmi, authorize_net, stripe, square]
            merchant_owner:
              type: string
              enum: [sales_org, prescribe_rx]
              default: sales_org
              description: >
                #5 B-4 — vault on the org's OWN merchant (default) or on a PRX-owned system
                patient merchant (prescribe_rx). 422 if no matching account exists.
            merchant_account_id:
              type: string
              format: uuid
              description: Target an org-owned merchant by id (sales_org owner only).
            merchant_external_code:
              type: string
              maxLength: 255
              description: >
                #5 B-3 — alternative to the UUID: the merchant's admin-assigned external code
                (discover via GET /merchant-accounts).
            vault:
              type: object
              description: >
                The per-gateway vault reference tuple. NMI=customer_vault_id;
                Authorize.Net=customer_profile_id+payment_profile_id;
                Stripe=payment_method_id(+customer_id); Square=customer_id+card_id.
            card_metadata:
              type: object
              description: Optional brand/last4/exp display metadata.

