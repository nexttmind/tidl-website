  /encounters/{id}/video-room:
    get:
      tags: [Encounters]
      summary: Get the scheduled video room + durable join link
      description: >
        Returns the encounter's durable video room and a persistent, signed
        patient join link (`join_url`) for a synchronous video consult. The
        `{id}` accepts either the encounter UUID or the human `encounter_number`
        (e.g. `ENC-1234567890`). Tenant-scoped — a caller may only read a room
        for an encounter they own (patient, provider, client, sales-org, admin).
        Returns 404 when the encounter has no video room (not a video consult,
        or no room provisioned yet). `join_url` is non-expiring for a scheduled
        room; the 15-minutes-before access gate + one-time-code re-verification
        secure it at redemption.
      operationId: getEncounterVideoRoom
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter UUID or encounter_number.
          schema:
            type: string
          example: "ENC-1234567890"
      responses:
        '200':
          description: The encounter's video room.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/VideoRoom' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /encounters/{id}/schedule:
    post:
      tags: [Encounters]
      summary: Attach a scheduled time to an existing encounter
      description: >
        Books a time onto an already-created encounter — the "create the
        encounter first, query availability, then attach the time" flow. Create
        the encounter without an appointment (e.g. via `POST
        /telehealth/intake/unified` with no `appointment` block), query
        `GET /scheduling/availability/slots`, then POST the chosen time here.

        Unlike posting a bare `POST /scheduling/appointments`, this maps the time
        onto the ENCOUNTER via the canonical scheduling primitive: it sets
        `scheduled_at`, books + links the companion appointment, assigns the
        provider (→ `SCHEDULED`), and provisions the video room — so the visit
        actually appears as a scheduled encounter (with `video_room` + persistent
        join link + reminders).

        **Provider is optional.** Supply `provider_profile_id` to pin a specific
        provider, or omit it to let the platform auto-assign an eligible provider
        available at that slot.

        **Time handling.** `scheduled_start` is ISO-8601: a value carrying an
        offset (or `Z`) is respected as-is; a naive `Y-m-d H:i:s` value is
        interpreted in `patient_timezone` (defaulting to the patient's resolved
        timezone). The time is always stored in UTC.

        `{id}` accepts the encounter UUID or `encounter_number`. Feature-gated:
        returns 404 when scheduled video rooms are not enabled on the instance.
      operationId: scheduleEncounter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter UUID or encounter_number.
          schema:
            type: string
          example: "ENC-1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_start]
              properties:
                scheduled_start:
                  type: string
                  format: date-time
                  description: >
                    Visit start (ISO-8601). An explicit offset/`Z` is respected;
                    a naive `Y-m-d H:i:s` is read in `patient_timezone`. Stored UTC.
                  example: "2026-08-12T15:30:00-04:00"
                provider_profile_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Optional. Omit to let the platform auto-assign an eligible
                    provider available at the requested slot.
                  example: "c1d2e3f4-a5b6-7890-cdef-012345678901"
                patient_timezone:
                  type: string
                  maxLength: 64
                  nullable: true
                  description: >
                    IANA timezone used to interpret a naive `scheduled_start`.
                    Defaults to the patient's resolved timezone.
                  example: "America/New_York"
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: "Patient booked afternoon slot"
            example:
              scheduled_start: "2026-08-12T15:30:00-04:00"
              patient_timezone: "America/New_York"
      responses:
        '200':
          description: Scheduled. Returns the updated encounter (incl. video_room).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Encounter scheduled." }
                  data: { $ref: '#/components/schemas/Encounter' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Unauthorized (encounter belongs to another tenant).
        '404':
          description: Encounter not found, or scheduled video rooms not enabled.
        '422':
          description: >
            Validation failed, or the encounter is not schedulable
            (terminal / locked state).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /encounters/{id}/reschedule:
    post:
      tags: [Encounters]
      summary: Reschedule a scheduled (or no-showed) video visit
      description: >
        Moves a scheduled or no-showed video encounter to a new time. Any token
        that owns the encounter may reschedule it — including a patient token
        (unlike a general update). The encounter keeps its durable room identity
        and persistent join link; the patient is notified and timed reminders
        re-arm for the new time. The encounter is never frozen closed — a
        no-showed encounter is re-opened to SCHEDULED. `{id}` accepts the UUID or
        `encounter_number`. Returns 404 when scheduled video rooms are not
        enabled on the instance.
      operationId: rescheduleEncounter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter UUID or encounter_number.
          schema:
            type: string
          example: "ENC-1234567890"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at:
                  type: string
                  format: date-time
                  description: New visit time (ISO-8601, must be in the future).
                  example: "2026-08-12T15:30:00Z"
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: "Patient requested a later time"
      responses:
        '200':
          description: Rescheduled. Returns the updated encounter (incl. video_room).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Encounter rescheduled." }
                  data: { $ref: '#/components/schemas/Encounter' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Encounter not found, or scheduled video rooms not enabled.
        '422':
          $ref: '#/components/responses/ValidationError'

  /encounters/{id}/no-show:
    post:
      tags: [Encounters]
      summary: Mark a scheduled video visit as a no-show
      description: >
        Flags a scheduled video encounter as a no-show. Staff/integration tokens
        only — a patient token is rejected (403). A no-show is NOT terminal: the
        encounter stays reschedulable and the patient is nudged to pick a new
        time. `{id}` accepts the UUID or `encounter_number`. Returns 404 when
        scheduled video rooms are not enabled on the instance.
      operationId: markEncounterNoShow
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Encounter UUID or encounter_number.
          schema:
            type: string
          example: "ENC-1234567890"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  example: "Patient did not join"
      responses:
        '200':
          description: Marked as no-show. Returns the updated encounter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Encounter marked as no-show." }
                  data: { $ref: '#/components/schemas/Encounter' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: A patient token may not mark a no-show (staff/integration only).
        '404':
          description: Encounter not found, or scheduled video rooms not enabled.
        '422':
          $ref: '#/components/responses/ValidationError'

