  # ==========================================================================
  # Terminology search  (reconciled 2026-09-13)
  # These endpoints return a BARE {data:[...]} — NO success/meta envelope.
  # ==========================================================================
  /terminology/allergies/search:
    get:
      tags: [Terminology]
      summary: Search allergens (typeahead)
      description: >
        SNOMED allergen typeahead (plus drug-as-allergen fallback), ranked by
        friendly name + usage. Returns a bare `{data:[...]}` (no envelope).
      operationId: searchTerminologyAllergies
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 }, description: "Search term (min 2 chars)." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [drug, food, environmental, other] } }
      responses:
        '200':
          description: Matching allergens
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid, nullable: true }
                        name: { type: string }
                        patient_friendly_name: { type: string, nullable: true }
                        category: { type: string, nullable: true }
                        code: { type: string, nullable: true, description: "SNOMED code." }
                        display: { type: string }
                        is_medication_allergen: { type: boolean }
              example: { data: [ { id: "9d..", name: "Penicillin", patient_friendly_name: "Penicillin", category: "drug", code: "764146007", display: "Penicillin (drug)", is_medication_allergen: true } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /terminology/conditions/search:
    get:
      tags: [Terminology]
      summary: Search conditions (typeahead)
      description: >
        ICD-10 + SNOMED condition typeahead. Returns a bare `{data:[...]}`.
      operationId: searchTerminologyConditions
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Matching conditions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid, nullable: true }
                        name: { type: string }
                        patient_friendly_name: { type: string, nullable: true }
                        category: { type: string, nullable: true }
                        icd10_code: { type: string, nullable: true }
                        snomed_code: { type: string, nullable: true }
                        code: { type: string, nullable: true, description: "icd10_code ?? snomed_code." }
                        display: { type: string }
              example: { data: [ { id: "1a..", name: "Type 2 diabetes mellitus", patient_friendly_name: "Type 2 Diabetes", icd10_code: "E11.9", snomed_code: "44054006", code: "E11.9", display: "Type 2 Diabetes (E11.9)" } ] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /terminology/medications/search:
    get:
