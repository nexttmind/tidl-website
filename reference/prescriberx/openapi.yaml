  # ==========================================================================
  # Sales Organizations  (reconciled 2026-09-13)
  # Group ability: sales-org:read; write routes ADD create/update/delete.
  # Adjacency hierarchy: read/show/children/clients/orders/update gate on
  # caller-org ∪ descendants; destroy only blocks deleting your OWN org.
  # ==========================================================================
  /sales-organizations:
    get:
      tags: [SalesOrganizations]
      summary: List sales organizations
      description: >
        Filterable, paginated list. If the caller belongs to an org, results are
        restricted to that org plus all adjacency-list descendants.
      operationId: listSalesOrganizations
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: 'filter[parent_id]', in: query, required: false, schema: { type: string, format: uuid }, description: "Exact." }
        - { name: 'filter[org_status]', in: query, required: false, schema: { type: integer }, description: "Exact (SalesOrganizationStatus 0-6)." }
        - { name: 'filter[org_type]', in: query, required: false, schema: { type: integer }, description: "Exact (SalesOrganizationType 1-3)." }
        - { name: 'filter[name]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: 'filter[email]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: 'filter[sales_org_number]', in: query, required: false, schema: { type: string }, description: "Partial." }
        - { name: sort, in: query, required: false, schema: { type: string, default: '-created_at' }, description: "Allowed: created_at, updated_at, name, sales_org_number." }
        - { name: include, in: query, required: false, schema: { type: string }, description: "Comma-separated: owner, parent, children, clients." }
        - { $ref: '#/components/parameters/PageParam' }
        - { $ref: '#/components/parameters/PerPageParam' }
      responses:
        '200':
          description: Paginated sales organizations
          content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SalesOrganizations]
      summary: Create a sales organization
      description: >
        Create a sales org together with a NEW owner user. Requires
        `sales-org:create`. `parent_id` defaults to the caller's own org when
        omitted. The `owner` block is required — the owner user is created (roles
        assigned by user type), linked to the org, and receives an account-setup
        invitation; the org's `owner_id` is set to that new user (any `owner_id`
        you send is ignored). Depending on the caller and business rules the org
        may be auto-approved (owner activated immediately) or left PENDING for
        admin approval.
      operationId: createSalesOrganization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, org_status, org_type, owner]
              properties:
                name: { type: string, maxLength: 255 }
                org_status: { $ref: '#/components/schemas/SalesOrganizationStatus' }
                org_type: { type: integer, description: "SalesOrganizationType: 1=SALESGROUP, 2=INDIVIDUAL, 3=SUBORGANIZATION." }
                parent_id: { type: string, format: uuid, nullable: true, description: "Defaults to the caller's org if omitted." }
                ein_ssn: { type: string, description: "Stored encrypted." }
                email: { type: string, format: email, maxLength: 255, description: "Organization contact email (distinct from the owner user's email)." }
                phone: { type: string, maxLength: 32 }
                peptide_commission: { type: number, format: float, default: 0, description: "Decimal rate (0.15 = 15%)." }
                medication_commission: { type: number, format: float, default: 0 }
                owner:
                  type: object
                  required: [first_name, last_name, email]
                  description: "The new owner user to create for this org (password is auto-generated; they receive a setup invitation)."
                  properties:
                    first_name: { type: string, maxLength: 100 }
                    last_name: { type: string, maxLength: 100 }
                    email: { type: string, format: email, maxLength: 255 }
                    mobile_phone: { type: string }
            example:
              name: "Acme Sales Group"
              org_status: 1
              org_type: 1
              email: "ops@acme.com"
              phone: "+15125550123"
              parent_id: null
              peptide_commission: 0.15
              medication_commission: 0.10
              owner: { first_name: "Jane", last_name: "Roe", email: "jane.roe@acme.com", mobile_phone: "5125550123" }
      responses:
        '201':
          description: Sales organization created
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales-organizations/{id}:
    get:
      tags: [SalesOrganizations]
      summary: Get a sales organization
      description: "Fetch one org (id, not sales_org_number) with owner/parent/children eager-loaded. 403 if outside the caller's descendant set."
      operationId: getSalesOrganization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sales organization
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [SalesOrganizations]
      summary: Update a sales organization
      description: >
        Partial update (requires `sales-org:update`). Send `id` in the body
        matching the path (DTO requirement). Only non-null keys are persisted.
      operationId: updateSalesOrganization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid, description: "Must equal the path id (DTO requirement)." }
                name: { type: string, maxLength: 255 }
                parent_id: { type: string, format: uuid, nullable: true }
                owner_id: { type: string, format: uuid, nullable: true }
                ein_ssn: { type: string, maxLength: 255 }
                email: { type: string, format: email, maxLength: 255 }
                phone: { type: string, maxLength: 32 }
                org_status: { $ref: '#/components/schemas/SalesOrganizationStatus' }
                org_type: { type: integer }
                peptide_commission: { type: number, format: float }
                medication_commission: { type: number, format: float }
            example: { id: "9c1a2b3c-...", name: "Acme Sales Group", phone: "+15125550123", org_status: 1 }
      responses:
        '200':
          description: Sales organization updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [SalesOrganizations]
      summary: Delete a sales organization
      description: "Soft-deletes an org (requires sales-org:delete). You cannot delete your own org (403). Returns 200 with data:null."
      operationId: deleteSalesOrganization
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Sales organization deleted
          content: { application/json: { schema: { $ref: '#/components/schemas/SuccessResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

