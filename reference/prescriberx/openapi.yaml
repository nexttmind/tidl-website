                      quantity: 1
                  reason_for_visit: Weight management consultation
              02_generic_product_type:
                summary: Order a product TYPE (product_type_id) — provider picks the SKU
                description: |
                  The patient bought a medication TYPE (e.g. Semaglutide); the
                  provider selects the concrete concentration/SKU of that type at
                  prescribe-time. Send the type INSIDE `products[]` — a top-level
                  `product_type_id` is ignored. `quantity` = units purchased (2);
                  `term_months` = intended months of supply (3) — independent axes.
                value:
                  encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
                  patient:
                    first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
                    date_of_birth: "1988-03-22"
                    phone: "770-555-9876"
                    shipping_address:
                      street: "456 Oak Ave"
                      city: Marietta
                      state: GA
                      zip: "30060"
                      country: US
                    billing_same_as_shipping: true
                  products:
                    - product_type_id: "019b9783-6a7e-73fc-92d6-2970937796db"
                      quantity: 2
                      term_months: 3
                  reason_for_visit: Weight management consultation
              03_generic_product_class:
                summary: Order a product CLASS (product_class_slug) — broadest generic
                description: |
                  One level broader than a type: the provider may pick a product
                  of ANY type within the class (e.g. any GLP-1). Use `product_class_id`
                  or `product_class_slug`. Creates a class-scoped generic line.
                value:
                  encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
                  patient:
                    first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
                    date_of_birth: "1988-03-22"
                    phone: "770-555-9876"
                    shipping_address:
                      street: "456 Oak Ave"
                      city: Marietta
                      state: GA
                      zip: "30060"
                      country: US
                    billing_same_as_shipping: true
                  products:
                    - product_class_slug: "glp-1"
                      quantity: 1
                      term_months: 1
                  reason_for_visit: Weight management consultation
              04_package_with_plan:
                summary: Order a PACKAGE + plan — quantity scales the whole package
                description: |
                  A package bundles multiple lines (some may be generic). `plan_id`
                  selects the subscription term (duration comes from the plan, NOT
                  `term_months`). `quantity` here scales the ENTIRE package —
                  quantity 2 doubles every line in the package.
                value:
                  encounter_type_id: "019ce396-46a1-73ab-87d6-c40310555401"
                  patient:
                    first_name: Jane
                    last_name: Smith
                    email: jane.smith@example.com
                    date_of_birth: "1988-03-22"
                    phone: "770-555-9876"
                    shipping_address:
