  /telehealth/encounters/{encounterId}/status:
    get:
      tags: [Telehealth]
      summary: Get encounter status with order tracking
      description: Get encounter status along with linked order and shipping info.
      operationId: getTelehealthEncounterStatus
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "https://demo.prescribe-rx.com/api/v1/telehealth/encounters/$ENCOUNTER_ID/status" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (poll loop)
          source: |
            $terminal = ['prescribed', 'completed', 'cancelled', 'rejected'];

            do {
                sleep(30);
                $status = Http::withToken($token)
                    ->acceptJson()
                    ->get("https://demo.prescribe-rx.com/api/v1/telehealth/encounters/{$encounterId}/status")
                    ->json('data.status');
            } while (! in_array($status, $terminal, true));
        - lang: JavaScript
          label: JavaScript (poll loop)
          source: |
            const terminal = ['prescribed', 'completed', 'cancelled', 'rejected'];
            let status;
            do {
              await new Promise(r => setTimeout(r, 30_000));
              const res = await fetch(
                `https://demo.prescribe-rx.com/api/v1/telehealth/encounters/${encounterId}/status`,
                { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } },
              );
              status = (await res.json()).data.status;
            } while (!terminal.includes(status));
        - lang: Python
          label: Python (poll loop)
          source: |
            import time, requests

            terminal = {'prescribed', 'completed', 'cancelled', 'rejected'}
            url = f'https://demo.prescribe-rx.com/api/v1/telehealth/encounters/{encounter_id}/status'

            while True:
                time.sleep(30)
                status = requests.get(url, headers={'Authorization': f'Bearer {token}'}).json()['data']['status']
                if status in terminal:
                    break
      parameters:
        - name: encounterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
      responses:
        '200':
          description: Encounter status with optional order tracking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      encounter_id:
                        type: string
                        format: uuid
                      encounter_number:
                        type: string
                      status:
                        type: string
                      status_history:
                        type: array
                        items:
                          type: object
                          properties:
                            status:
                              type: string
                            timestamp:
                              type: string
                              format: date-time
                      order:
                        type: object
                        nullable: true
                        properties:
                          order_id:
                            type: string
                            format: uuid
                          order_number:
                            type: string
                          payment_status:
                            type: string
                          shipping_status:
                            type: string
                          tracking_number:
                            type: string
                            nullable: true
              example:
                data:
                  encounter_id: "019d5561-7b2b-7096-8d90-4ee49ef2ede8"
                  encounter_number: ENC-00042
                  status: prescribed
                  status_history:
                    - status: prescribed
                      timestamp: "2026-04-03T12:00:00+00:00"
                  order:
                    order_id: "f6a7b8c9-d0e1-2345-f012-678901234567"
                    order_number: ORD-00123
                    payment_status: captured
                    shipping_status: shipped
                    tracking_number: "1Z999AA10123456784"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # --------------------------------------------------------------------------
  # Encounters
  # --------------------------------------------------------------------------
  /encounters:
    get:
      tags: [Encounters]
      summary: List encounters (tenant-scoped)
      description: |
        List encounters scoped by token tenant: sales-org → org +
        descendants, client → own client_id, patient → own chart, provider
        role → assigned only, admin/API → unscoped. See `EncounterController@index`.
      operationId: listEncounters
      security:
        - bearerAuth: []
      x-codeSamples:
        - lang: cURL
          label: cURL
          source: |
            curl -X GET "https://demo.prescribe-rx.com/api/v1/encounters?per_page=10&sort=-created_at" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/json"
        - lang: PHP
          label: PHP (Laravel HTTP)
          source: |
            $encounters = Http::withToken($token)
                ->acceptJson()
                ->get('https://demo.prescribe-rx.com/api/v1/encounters', [
                    'per_page' => 10,
                    'sort' => '-created_at',
                ])
                ->json('data');
        - lang: JavaScript
          label: JavaScript (fetch)
          source: |
            const res = await fetch(
              'https://demo.prescribe-rx.com/api/v1/encounters?per_page=10&sort=-created_at',
              { headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' } },
            );
            const { data } = await res.json();
        - lang: Python
          label: Python (requests)
          source: |
            import requests

            res = requests.get(
                'https://demo.prescribe-rx.com/api/v1/encounters',
                headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
                params={'per_page': 10, 'sort': '-created_at'},
            )
            encounters = res.json()['data']
      parameters:
        - name: filter[status]
        - name: filter[status]
          in: query
          schema:
            type: string
          description: Encounter status string value
        - name: filter[priority]
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: filter[encounter_type_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[patient_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: filter[provider_profile_id]
          in: query
          schema:
            type: string
            format: uuid
        - name: include
          in: query
          schema:
            type: string
          description: "Comma-separated: patient, providerProfile, encounterType, prescriptions, soapNotes, interactions, assignments"
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, priority, status]
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/PageParam'
