    # ------------------------------------------------------------------------
    # Product Schemas
    # ------------------------------------------------------------------------
    # ------------------------------------------------------------------------
    # Pricing blocks — visibility gated by token catalog scope.
    #   - patient / unauthenticated → retail_price (+ legacy `price` alias).
    #   - sales-org / client / admin → retail + wholesale + (optional)
    #     consumer_price + custom_price + (admin) cost.
    # Sales-org overrides on `sales_organization_products` (when *_override
    # is true) win over the system defaults. Client tier overrides
    # (`client_tier_product_prices`) win over everything for that client.
    # ------------------------------------------------------------------------
    ProductPricing:
      type: object
      required: [retail_price, price, price_type]
      properties:
        retail_price:
          type: number
          description: System or sales-org-overridden retail price.
        wholesale_price:
          type: number
          nullable: true
          description: |
            Token-gated. Present only when caller is sales-org / client / admin.
            Sales-org overrides applied when `wholesale_override=true` on
            `sales_organization_products`.
        consumer_price:
          type: number
          nullable: true
          description: |
            Org-set patient-facing price (e.g. promo / member rate). Present
            only when sales-org override row defines a non-zero value.
        custom_price:
          type: number
          nullable: true
          description: Client-tier override (`client_tier_product_prices`). Wins over wholesale.
        cost:
          type: number
          nullable: true
          description: Admin-only — internal product cost.
        price:
          type: number
          description: |
            Legacy "primary price" alias preserved for backward compat.
            Resolves to `custom_price > wholesale_price (when visible) > retail_price`.
            New integrations should use the explicit fields above.
        price_type:
          type: string
          enum: [retail, wholesale, custom]
          description: Which field `price` resolved to.

    PackagePricing:
      type: object
      required: [retail_price, price, price_type]
      properties:
        retail_price:
          type: number
        wholesale_price:
          type: number
          nullable: true
          description: Token-gated. Sales-org / client / admin only.
        consumer_price:
          type: number
          nullable: true
          description: Set on the package directly (no per-org override yet).
        cost:
          type: number
          nullable: true
          description: Admin-only.
        price:
          type: number
          description: Legacy alias — wholesale when visible, retail otherwise.
        price_type:
          type: string
          enum: [retail, wholesale]

    Product:
