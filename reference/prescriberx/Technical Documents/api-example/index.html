<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrescribeRx &mdash; Telehealth Intake</title>

  <!-- Bootstrap 5 (CDN). Swap for your own bundle to rebrand. -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous">
  <!-- Tabler icons referenced by encounter-type "icon" values (optional). -->
  <link
    href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.1.0/dist/tabler-icons.min.css"
    rel="stylesheet"
    crossorigin="anonymous">

  <link href="assets/wizard.css" rel="stylesheet">
</head>
<body>
  <div class="prx-shell">
    <header class="prx-header">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div>
            <h1 class="prx-title mb-0">Telehealth Intake</h1>
            <p class="prx-subtitle mb-0" id="prx-encounter-desc">Loading&hellip;</p>
          </div>

          <!-- Encounter-type switcher. Populated from the API; change it to
               load a different encounter type's schema at runtime. -->
          <div class="prx-type-switch">
            <label for="prx-encounter-type" class="form-label small mb-1">Encounter type</label>
            <select id="prx-encounter-type" class="form-select form-select-sm"></select>
          </div>
        </div>
      </div>
    </header>

    <main class="container prx-main">
      <!-- Step progress -->
      <nav class="prx-steps" id="prx-steps" aria-label="Intake steps"></nav>

      <!-- Global error banner -->
      <div class="alert alert-danger d-none" id="prx-error" role="alert"></div>

      <!-- The active step renders here -->
      <section class="prx-step-panel" id="prx-step-panel" aria-live="polite"></section>

      <!-- Footer navigation -->
      <div class="prx-nav d-flex justify-content-between align-items-center" id="prx-nav">
        <button type="button" class="btn btn-outline-secondary" id="prx-back" disabled>
          <i class="ti ti-arrow-left"></i> Back
        </button>
        <div class="prx-nav-status text-muted small" id="prx-nav-status"></div>
        <button type="button" class="btn btn-primary" id="prx-next">
          Next <i class="ti ti-arrow-right"></i>
        </button>
      </div>
    </main>

    <!-- Loading overlay -->
    <div class="prx-overlay d-none" id="prx-overlay">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading</span></div>
      <div class="prx-overlay-text mt-3" id="prx-overlay-text">Working&hellip;</div>
    </div>
  </div>

  <!--
    Configure the proxy endpoint and default encounter type here. Everything
    else is discovered from the API at runtime.
  -->
  <script>
    window.PRX_WIZARD = {
      proxyUrl: 'api.php',
      defaultEncounterTypeId: '019ce396-46a1-73ab-87d6-c40310555401'
    };
  </script>
  <script src="assets/wizard.js"></script>
</body>
</html>
